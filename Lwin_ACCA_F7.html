*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{

}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;opacity:.85;
 background:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);

}
#viewport{position:fixed;inset:0;overflow:auto;cursor:grab;scroll-behavior:smooth;padding:22px 0 80px}

#spacer{position:relative}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.node{

}
.node:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#7abff4;opacity:.85}

.node .txt{flex:1;min-width:0;position:relative;z-index:1}

.node.group{width:315px;background:linear-gradient(135deg,#ecfaf6,#fbfffd);font-weight:820;border-color:#bddfd4}.node.group:before{background:#54c1a0}
.node.overview{width:620px;background:linear-gradient(135deg,#effaff,#ffffff);border-color:#b8dced}.node.overview:before{background:#68c6f2}
.node.detail{width:480px;background:linear-gradient(135deg,#fbfff0,#ffffff);border-color:#dbe9ae}.node.detail:before{background:#c9db5b}
.node.formula{width:400px;background:linear-gradient(135deg,#fff6bd,#fffdf1);text-align:center;font-weight:820;border-color:#ead67b}.node.formula:before{background:#e8bb2f}
.node.example{width:460px;background:linear-gradient(135deg,#eefbd5,#fbfff5);border-color:#cbe6a1}.node.example:before{background:#8dc852}
.node.step{width:440px;background:linear-gradient(135deg,#e4f4ff,#ffffff);border-color:#b9dbf4}.node.step:before{background:#54aee9}
.node.trap{width:430px;background:linear-gradient(135deg,#fff0ec,#fffafa);border-color:#f2c5ba}.node.trap:before{background:#ef745e}
.node.exam{width:450px;background:linear-gradient(135deg,#f0edff,#ffffff);border-color:#cec7f4}.node.exam:before{background:#8b7be8}
.node.sheet{width:1500px;background:transparent;border:none;box-shadow:none;padding:0;backdrop-filter:none;overflow:visible}.node.sheet:before{display:none}.node.sheet:hover{transform:none;box-shadow:none}
.arrow{

.master-detail th{width:11.1%}
.topic-detail th:first-child{width:21%}.topic-detail th:nth-child(2){width:49%}.topic-detail th:nth-child(3){width:30%}
.ratio-table th:nth-child(1){width:8%}.ratio-table th:nth-child(2){width:10%}.ratio-table th:nth-child(3){width:12%}.ratio-table th:nth-child(4){width:13%}.ratio-table th:nth-child(5){width:13%}.ratio-table th:nth-child(6){width:16%}.ratio-table th:nth-child(7){width:14%}.ratio-table th:nth-child(8){width:14%}
.conso-table th:nth-child(1){width:7%}.conso-table th:nth-child(2){width:14%}.conso-table th:nth-child(3){width:28%}.conso-table th:nth-child(4){width:20%}.conso-table th:nth-child(5){width:16%}.conso-table th:nth-child(6){width:15%}
.good{background:#f0fae8!important}.bad{background:#fff0ec!important}

#focusCard[data-kind="sheet"] .sheet-wrap{width:100%;box-shadow:none;border-radius:20px}
#focusContent{font-size:18px;line-height:1.8;white-space:pre-line;color:inherit}

#focusCard[data-kind="sheet"] .sheet-subtitle{font-size:14px;padding:14px 18px}
#focusKind{

 border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(132,185,222,.58);

}

#focusClose,#focusRestore{

}
#focusClose{width:38px;height:38px;margin-left:8px;background:#e5f4ff;color:#15436a;font-size:22px;line-height:1}

#focusClose:hover{background:#d3ecff}#focusRestore:hover{background:#3f98dd}
.focus-text{font-weight:650;word-break:break-word}
.focus-help{margin-top:18px;color:#5d7891;font-size:12px;border-top:1px solid rgba(132,185,222,.35);padding-top:12px}
#focusCard[data-kind="root"] .focus-help{color:rgba(255,255,255,.88);border-top-color:rgba(255,255,255,.28)}
@media(max-width:800px){#focusOverlay{padding:12px}#focusCard{width:96vw;max-height:92vh;padding:20px}#focusContent{font-size:15px}#focusCard[data-kind="sheet"] .excel-sheet{font-size:9.2px}#focusRestore{display:none}}

 recoverability နဲ့ liability settlement basis ကို ပြန်စဉ်းစားရမယ်။", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Common Mistakes / Exam Traps", "kind": "group", "children": [{"text": "Framework definition တစ်ကြောင်းအလွတ်ကျက်ပြီး application မရေးခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Prudence = assets အမြဲလျှော့ပြခြင်း လို့မှားယူခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Accrual = cash basis နဲ့ရောခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Specific IFRS ရှိတာကို Framework နဲ့ override လုပ်ခြင်း", "kind": "trap", "children": [], "html": null}], "html": null}, {"text": "Exam Focus", "kind": "group", "children": [{"text": "Section A/B မှာ definitions, qualitative characteristics, substance over form; written scenario မှာ WHY ကို ရှင်းပြနိုင်ရမယ်။", "kind": "exam", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Chapter 2: IFRS 13 Fair Value + IFRS 18 Presentation & Disclosure", "kind": "chapter", "children": [{"text": "Deep Excel-style Study Sheets", "kind": "group", "children": [{"text": "Deep Master Sheet", "kind": "sheet", "children": [], "html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 2 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IFRS 13: fair value uses a market-participant exit-price concept. IFRS 18: classify income/expenses into presentation categories and provide required subtotals/disaggregation.</td>\n   <td>IFRS 13: use market evidence / valuation inputs at the measurement date. IFRS 18: not an asset-measurement standard; it governs presentation and disclosure.</td>\n   <td>IFRS 13: remeasure whenever the related standard requires FV. IFRS 18: maintain consistent category, aggregation/disaggregation and note presentation.</td>\n   <td>Depends on the underlying standard. IFRS 18 generally changes presentation, not recognition by itself.</td>\n   <td><div class='formula-box'><b>Present value (basic)</b><div class='fstack'>PV = Future cash flow ÷ (1 + r)^n</div></div><div class='formula-box'><b>Fair value adjustment</b><div class='fstack'>FV adjustment = Fair value at measurement date − existing carrying amount</div></div></td>\n   <td>IFRS 18 affects SOPL categories/subtotals, OCI, SOFP presentation and Notes. IFRS 13 affects carrying amounts where another standard requires fair value.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Market participant view သို့ entity-specific view လား စစ်ပါ။</li><li><b>Step 2:</b> Asset type အလိုက် highest-and-best-use လို/မလို ခွဲပါ။</li><li><b>Step 3:</b> Input source ကို Level 1/2/3 classify လုပ်ပါ။</li><li><b>Step 4:</b> Presentation question ဆိုရင် income/expense nature ကို operating/investing/financing နဲ့ map လုပ်ပါ။</li></ol></td>\n   <td><div class='mini-example'><b>Factory land with condo potential</b><br>Factory ဆက်သုံးမယ်ဆိုတဲ့ management intent တစ်ခုတည်းမဟုတ်ဘဲ market participants က legally/financially feasible condo redevelopment ကို ပိုတန်ဖိုးထားရင် higher use ကို Fair Value ထဲထည့်စဉ်းစားနိုင်တယ်။</div><div class='mini-example'><b>Quoted share</b><br>Active exchange မှာ identical share quoted price ရှိရင် Level 1 input ဖြစ်ပြီး model-based estimate ထက် priority ပိုမြင့်တယ်။</div></td>\n   <td><ul><li>Fair Value = management&#x27;s preferred value လို့ယူခြင်း</li><li>Highest and best use ကို entity intent နဲ့တူတယ်လို့ယူခြင်း</li><li>Level 3 = unreliable, therefore prohibited လို့မှားယူခြင်း</li><li>Presentation category နဲ့ cash-flow category ကို အလိုအလျောက်တူတယ်လို့ယူခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Fair value definition</b></td><td>Measurement date မှာ orderly transaction တစ်ခုအတွင်း asset ရောင်းရင်ရမယ့် price သို့ liability transfer လုပ်ရင်ပေးရမယ့် price — market participants perspective.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Highest and best use</b></td><td>Non-financial asset အတွက် physically possible, legally permissible, financially feasible ဖြစ်တဲ့ best use ကိုယူတယ်။</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Principal / most advantageous market</b></td><td>Principal market ရှိရင်အဲဒီ market; မရှိမှ most advantageous market စဉ်းစားတယ်။</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Fair value hierarchy</b></td><td>Level 1 = quoted active market inputs; Level 2 = observable other inputs; Level 3 = unobservable valuation inputs.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Presentation logic</b></td><td>SOPL/OCI line items ကို operating, investing, financing logic နဲ့ classify လုပ်ရာမှာ transaction nature ကိုကြည့်ရမယ်။</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Disaggregation &amp; disclosure</b></td><td>Material information ကို meaningful categories ခွဲပြပြီး users နားလည်နိုင်အောင် presentation လုပ်ရမယ်။</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Fair value measurement က consolidation, PPE revaluation, investment property, financial instruments နဲ့ ချိတ်မေးနိုင်တယ်။</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "Fair Value ဆိုတာ entity-specific value မဟုတ်ဘဲ market participant perspective က exit price ဖြစ်တယ်။ Presentation အပိုင်းမှာ financial performance ကို operating / investing / financing စတဲ့ categories နဲ့တစ်ပြေးညီဖော်ပြနိုင်ဖို့ logic ကိုသိရမယ်။", "kind": "overview", "children": [], "html": null}], "html": null}, {"text": "Rules / Criteria / Measurement", "kind": "group", "children": [{"text": "Criteria / Recognition", "kind": "topic", "children": [{"text": "IFRS 13: fair value uses a market-participant exit-price concept. IFRS 18: classify income/expenses into presentation categories and provide required subtotals/disaggregation.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Initial Measurement", "kind": "topic", "children": [{"text": "IFRS 13: use market evidence / valuation inputs at the measurement date. IFRS 18: not an asset-measurement standard; it governs presentation and disclosure.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Subsequent Measurement", "kind": "topic", "children": [{"text": "IFRS 13: remeasure whenever the related standard requires FV. IFRS 18: maintain consistent category, aggregation/disaggregation and note presentation.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Accounting / Journal Treatment", "kind": "topic", "children": [{"text": "Depends on the underlying standard. IFRS 18 generally changes presentation, not recognition by itself.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Financial Statement Impact", "kind": "topic", "children": [{"text": "IFRS 18 affects SOPL categories/subtotals, OCI, SOFP presentation and Notes. IFRS 13 affects carrying amounts where another standard requires fair value.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Topic Details", "kind": "group", ldren": [], "html": null}], "html": null}], "html": null}, {"text": "Exam Thinking Process", "kind": "group", "children": [{"text": "Step 1 — Market participant view သို့ entity-specific view လား စစ်ပါ။", "kind": "step", "children": [], "html": null}, {"text": "Step 2 — Asset type အလိုက် highest-and-best-use လို/မလို ခွဲပါ။", "kind": "step", "children": [], "html": null}, {"text": "Step 3 — Input source ကို Level 1/2/3 classify လုပ်ပါ။", "kind": "step", "children": [], "html": null}, {"text": "Step 4 — Presentation question ဆိုရင် income/expense nature ကို operating/investing/financing နဲ့ map လုပ်ပါ။", "kind": "step", "children": [], "html": null}], "html": null}, {"text": "Examples / Application", "kind": "group", "children": [{"text": "Factory land with condo potential", "kind": "example", "children": [{"text": "Factory ဆက်သုံးမယ်ဆိုတဲ့ management intent တစ်ခုတည်းမဟုတ်ဘဲ market participants က legally/financially feasible condo redevelopment ကို ပိုတန်ဖိုးထားရင် higher use ကို Fair Value ထဲထည့်စဉ်းစားနိုင်တယ်။", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Quoted share", "kind": "example", "children": [{"text": "Active exchange မှာ identical share quoted price ရှိရင် Level 1 input ဖြစ်ပြီး model-based estimate ထက် priority ပိုမြင့်တယ်။", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Common Mistakes / Exam Traps", "kind": "group", "children": [{"text": "Fair Value = management's preferred value လို့ယူခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Highest and best use ကို entity intent နဲ့တူတယ်လို့ယူခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Level 3 = unreliable, therefore prohibited လို့မှားယူခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Presentation category နဲ့ cash-flow category ကို အလိုအလျောက်တူတယ်လို့ယူခြင်း", "kind": "trap", "children": [], "html": null}], "html": null}, {"text": "Exam Focus", "kind": "group", "children": [{"text": "Fair value measurement က consolidation, PPE revaluation, investment property, financial instruments နဲ့ ချိတ်မေးနိုင်တယ်။", "kind": "exam", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Chapter 3: IAS 16 – Property, Plant and Equipment (PPE)", "kind": "chapter", "children": [{"text": "Deep Excel-style Study Sheets", "kind": "group", "children": [{"text": "Deep Master Sheet", "kind": "sheet", "children": [], "html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 3 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 16 recognition: future economic benefits probable + cost reliably measurable. Subsequent expenditure uses the same recognition logic.</td>\n   <td>Cost = purchase price net of trade discounts/rebates + import duties/non-refundable taxes + directly attributable costs + eligible IAS 23 borrowing costs + relevant restoration obligation.</td>\n   <td>Policy choice by class: Cost Model OR Revaluation Model. Depreciate significant components separately; review useful life/residual value/method prospectively.</td>\n   <td>Purchase: Dr PPE / Cr Cash or Payable. Depreciation: Dr Expense / Cr Accumulated Depreciation. Revaluation increase normally Dr PPE / Cr OCI-Revaluation Surplus, subject to reversals.</td>\n   <td><div class='formula-box'><b>Straight-line depreciation</b><div class='fstack'>(Cost − Residual value) ÷ Useful life</div></div><div class='formula-box'><b>Reducing-balance depreciation</b><div class='fstack'>Opening carrying amount × Depreciation rate</div></div><div class='formula-box'><b>Units-of-production</b><div class='fstack'>(Cost − Residual value) ÷ Total expected units × Units produced</div></div><div class='formula-box'><b>Carrying amount</b><div class='fstack'>Cost or revalued amount − Accumulated depreciation − Accumulated impairment</div></div><div class='formula-box'><b>Disposal gain/loss</b><div class='fstack'>Disposal proceeds − Carrying amount at disposal date</div></div><div class='formula-box'><b>Revised annual depreciation</b><div class='fstack'>Carrying amount at estimate-change date − revised residual value, divided by remaining useful life</div></div></td>\n   <td>PPE appears in SOFP at carrying amount. Depreciation/impairment usually affects SOPL. Revaluation surplus usually OCI/Equity. Disposal gain/loss affects SOPL.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Asset ready for use ဖြစ်ပြီလား?</li><li><b>Step 2:</b> Cost item တစ်ခုချင်းကို directly attributable / abnormal / operating cost လား classify လုပ်ပါ။</li><li><b>Step 3:</b> Significant components ရှိ/မရှိစစ်ပါ။</li><li><b>Step 4:</b> Depreciation start date, useful life, residual value, method ကိုသတ်မှတ်ပါ။</li><li><b>Step 5:</b> Revaluation/disposal ဖြစ်ရင် CA ကို event date အထိ update အရင်လုပ်ပါ။</li></ol></td>\n   <td><div class='mini-example'><b>Machine cost</b><br>Machine price 100,000; trade discount 5,000; delivery 3,000; installation 4,000; training 2,000. PPE cost = 102,000. Training 2,000 → expense.</div><div class='mini-example'><b>Estimate change</b><br>CA at 1 Jan = 60,000; revised residual 6,000; remaining life 3 years → new annual depreciation = 18,000 prospectively.</div><div class='mini-example'><b>Disposal</b><br>CA 30,000, proceeds 35,000 → disposal gain 5,000 in SOPL.</div></td>\n   <td><ul><li>Recoverable VAT ကို asset cost ထဲထည့်ခြင်း</li><li>Training / initial operating losses ကို capitalise လုပ်ခြင်း</li><li>Depreciation ကို purchase date မှာစခြင်း instead of available-for-use</li><li>Useful life change ကို retrospective ပြန်ရေးခြင်း</li><li>Revaluation increase အားလုံး SOPL သွင်းခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Recognition</b></td><td>Future economic benefits probable + cost reliably measurable.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Initial cost</b></td><td>Purchase price net of trade discount + import duty + non-refundable taxes + directly attributable transport/installation/site preparation/professional/testing costs + initial dismantling/restoration estimate.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Exclude from cost</b></td><td>Admin/general overhead, initial operating loss, staff training, repair &amp; maintenance, insurance, day-to-day operating cost.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Subsequent expenditure</b></td><td>Future benefits တိုးစေတဲ့ major replacement/overhaul/capacity-quality-life improvement → capitalise; routine repair → expense.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Component accounting</b></td><td>Significant parts with different useful lives → separate depreciation.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Depreciation start/stop</b></td><td>Ready/available for use မှာ start; held for sale classification / derecognition ပေါ်မူတည်၍ cease.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Changes in estimates</b></td><td>Useful life, residual value, depreciation method change → prospective under IAS 8.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Revaluation</b></td><td>Class of assets ကို consistent basis နဲ့ revalue. Increase usually OCI/revaluation surplus, decrease usually SOPL subject to previous surplus/reversal.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Disposal</b></td><td>Profit/loss = proceeds − carrying amount; derecognise cost and accumulated depreciation.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Section A/B အပြင် Section C adjustment တစ်ခုအဖြစ် cost, depreciation, revaluation, disposal ကို မကြာခဏချိတ်မေးနိုင်တယ်။</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "PPE မှာ အဓိကမေးတာက recognition, initial cost, capital vs revenue expenditure, depreciation, component accounting, revaluation, disposal ဖြစ်တယ်။ Source notes မှာ recognition criteria, cost components, depreciation methods, life/scrap/method changes, revaluation နဲ့ complex assets ကို တစ်ဆက်တည်းဖော်ပြထားတယ်။", "kind": "overview", "children": [], "html": null}], "html": null}, {"text": "Rules / Criteria / Measurement", "kind": "group", "children": [{"text": "Criteria / Recognition", "kind": "topic", "children": [{"text": "IAS 16 recognition: future economic benefits probable + cost reliably measurable. Subsequent expenditure uses the same recognition logic.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Initial Measurement", "kind": "topic", "children": [{"text": "Cost = purchase price net of trade discounts/rebates + import duties/non-refundable taxes + directly attributable costs + eligible IAS 23 borrowing costs + relevant restoration obligation.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Subsequent Measurement", "kind": "topic", "children": [{"text": "Policy c ml": null}], "html": null}], "html": null}, {"text": "Chapter 5: IAS 23 – Borrowing Costs", "kind": "chapter", "children": [{"text": "Deep Excel-style Study Sheets", "kind": "group", "children": [{"text": "Deep Master Sheet", "kind": "sheet", "children": [], "html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 5 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 23 applies to borrowing costs directly attributable to a qualifying asset that takes a substantial period to get ready for use or sale.</td>\n   <td>Specific borrowing: actual eligible borrowing costs less temporary investment income. General borrowing: capitalization rate × weighted qualifying expenditure.</td>\n   <td>Capitalize only during eligible construction period; suspend during extended abnormal interruptions; cease when substantially all preparation activities are complete.</td>\n   <td>Dr Qualifying Asset / Cr Interest Payable or Cash for capitalized portion; non-eligible borrowing cost → finance expense.</td>\n   <td><div class='formula-box'><b>Specific borrowing capitalisation</b><div class='fstack'>Actual eligible borrowing cost − relevant temporary investment income</div></div><div class='formula-box'><b>General borrowing capitalisation</b><div class='fstack'>Weighted-average capitalisation rate × weighted qualifying expenditure</div></div><div class='formula-box'><b>Simple interest</b><div class='fstack'>Principal × annual rate × time fraction</div></div></td>\n   <td>Capitalized amount increases asset cost in SOFP; non-capitalized interest affects financing/finance expense in SOPL.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Asset qualifying asset ဟုတ်/မဟုတ်စစ်ပါ။</li><li><b>Step 2:</b> Loan specific/general ခွဲပါ။</li><li><b>Step 3:</b> Start/suspend/cease dates timeline ဆွဲပါ။</li><li><b>Step 4:</b> Eligible period ပေါ် interest တွက်ပါ။</li><li><b>Step 5:</b> Capitalised amount နဲ့ SOPL finance cost ကို split လုပ်ပါ။</li></ol></td>\n   <td><div class='mini-example'><b>Specific loan</b><br>Loan 1,000,000 @ 8%; eligible construction 9 months → gross eligible interest 60,000 before any temporary investment adjustment.</div><div class='mini-example'><b>Suspension</b><br>Strike ကြောင့် 2 months abnormal stop ဖြစ်ရင် those months borrowing cost ကို expense လုပ်နိုင်ပြီး capitalise မလုပ်ရ။</div></td>\n   <td><ul><li>Loan drawdown date ကနေ automatically capitalise လုပ်ခြင်း</li><li>Normal technical/administrative delay နဲ့ abnormal suspension ရောခြင်း</li><li>Asset ready ဖြစ်ပြီးနောက် interest ဆက် capitalise လုပ်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Qualifying asset</b></td><td>Intended use/sale အတွက် substantial period လိုအပ်တဲ့ asset.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Specific borrowing</b></td><td>Specific loan borrowing cost less temporary investment income, where applicable.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>General borrowing</b></td><td>Weighted average capitalization rate ကို qualifying expenditure ပေါ် apply.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Commencement</b></td><td>Expenditure incurred + borrowing costs incurred + activities to prepare asset underway.</td><td>Rule → Apply facts → td>\n   <td>Intangible asset in SOFP; amortization/impairment in SOPL, unless included in another asset cost where permitted.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Identifiable/control/future benefit စစ်ပါ။</li><li><b>Step 2:</b> Purchased vs internally generated ခွဲပါ။</li><li><b>Step 3:</b> Internal project ဆို research/development phase ခွဲပါ။</li><li><b>Step 4:</b> Development criteria satisfied date ကို pinpoint လုပ်ပြီး အဲဒီ date ကစပြီး only capitalise လုပ်ပါ။</li></ol></td>\n   <td><div class='mini-example'><b>R&amp;D project</b><br>Jan–Mar research 30k; development criteria met 1 Apr; Apr–Dec eligible cost 90k → 30k expense, 90k capitalise subject to criteria.</div><div class='mini-example'><b>Purchased patent</b><br>Purchase price + directly attributable legal registration costs → intangible asset cost.</div></td>\n   <td><ul><li>Research cost ကို capitalise လုပ်ခြင်း</li><li>Development project success expected တင်နဲ့ criteria အကုန်ပြည့်တယ်လို့ယူခြင်း</li><li>Internally generated brand valuation ကို asset လုပ်ခြင်း</li><li>Indefinite life asset ကို amortise လုပ်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Definition</b></td><td>Identifiable non-monetary asset without physical substance; separable or contractual/legal rights.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Purchased intangible</b></td><td>Cost measurable ဖြစ်လို့ recognition ပိုရှင်း.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Research phase</b></td><td>Expense as incurred.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Development phase</b></td><td>Technical feasibility, intention, ability, future benefits/market, resources, reliable measurement စတဲ့ criteria ပြည့်မှ capitalise.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Internally generated brands</b></td><td>Brand, masthead, publishing title, customer list စတာတွေကို internally generated value အဖြစ် generally recognise မလုပ်.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Finite life</b></td><td>Amortise systematic basis over useful life.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Indefinite life</b></td><td>No amortisation; annual impairment review.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Revaluation</b></td><td>Active market ရှိတဲ့ rare cases မှသာ revaluation model practical.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Recognition logic နဲ့ capitalisation date အဓိက။ PPE ကဲ့သို့ calculation ရှိပေမယ့် recognition judgement ပိုများတယ်။</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "Intangible asset မှာ purchased asset နဲ့ internally generated expenditure ကို ခွဲရမယ်။ Research expense, development criteria, useful life finite/indefinite, amortisation/impairment က key points။", "kind": "overview", "children": [], "html": null}], "html": null}, {"text": "Rules / Criteria / Measurement", "kind": "group", "children": [{"text": "Criteria / Recognition", "kind": "topic", "children": [{"text": "IAS 38: identifiable non-monetary asset without physical substance. Internally generated development cost capitalized only after required development criteria are met; research is expensed.", "kind": "detail", "children": [ tml": null}, {"text": "Internally generated brands", "kind": "topic", "children": [{"text": "Brand, masthead, publishing title, customer list စတာတွေကို internally generated value အဖြစ် generally recognise မလုပ်.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Finite life", "kind": "topic", "children": [{"text": "Amortise systematic basis over useful life.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Indefinite life", "kind": "topic", "children": [{"text": "No amortisation; annual impairment review.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Revaluation", "kind": "topic", "children": [{"text": "Active market ရှိတဲ့ rare cases မှသာ revaluation model practical.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Formula / Working Map", "kind": "group", "children": [{"text": "Straight-line amortisation", "kind": "formula", "children": [{"text": "(Cost − Residual value) ÷ Useful life", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Development asset CA", "kind": "formula", "children": [{"text": "Capitalised development cost − accumulated amortisation − impairment", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Exam Thinking Process", "kind": "group", "children": [{"text": "Step 1 — Identifiable/control/future benefit စစ်ပါ။", "kind": "step", "children": [], "html": null}, {"text": "Step 2 — Purchased vs internally generated ခွဲပါ။", "kind": "step", "children": [], "html": null}, {"text": "Step 3 — Internal project ဆို research/development phase ခွဲပါ။", "kind": "step", "children": [], "html": null}, {"text": "Step 4 — Development criteria satisfied date ကို pinpoint လုပ်ပြီး အဲဒီ date ကစပြီး only capitalise လုပ်ပါ။", "kind": "step", "children": [], "html": null}], "html": null}, {"text": "Examples / Application", "kind": "group", "children": [{"text": "R&D project", "kind": "example", "children": [{"text": "Jan–Mar research 30k; development criteria met 1 Apr; Apr–Dec eligible cost 90k → 30k expense, 90k capitalise subject to criteria.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Purchased patent", "kind": "example", "children": [{"text": "Purchase price + directly attributable legal registration costs → intangible asset cost.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Common Mistakes / Exam Traps", "kind": "group", "children": [{"text": "Research cost ကို capitalise လုပ်ခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Development project success expected တင်နဲ့ criteria အကုန်ပြည့်တယ်လို့ယူခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Internally generated brand valuation ကို asset လုပ်ခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Indefinite life asset ကို amortise လုပ်ခြင်း", "kind": "trap", "children": [], "html": null}], "html": null}, {"text": "Exam Focus", "kind": "group", "children": [{"text": "Recognition logic နဲ့ capitalisation date အဓိက။ PPE ကဲ့သို့ calculation ရှိပေမယ့် recognition judgement ပိုများတယ်။", "kind": "exam", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Chapter 7: IAS 36 – Impairment of Assets", "kind": "chapter", "children": [{"text": "Deep Excel-style Study Sheets", "kind": "group", "children": [{"text": "Deep Master Sheet", "kind": "sheet", "children": [], "html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 7 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 36 impairment when carrying amount exceeds recoverable amount. Recoverable amount = higher of FVLCD and VIU.</td>\n   <td>N/A as a standalone asset recognition rule; calculate the asset/CGU carrying amount first.</td>\n   <td>Test when indicators exist; some assets require annual testing. Reversal possible for non-goodwill assets subject to ceiling; goodwill impairment is not reversed.</td>\n   <td>Dr Impairment Loss / Cr Asset or Accumulated Impairment. Reversal: Dr Asset / Cr Reversal Gain, where permitted.</td>\n   <td><div class='formula-box'><b>Recoverable Amount</b><div class='fstack'>max(FVLCD, VIU)</div></div><div class='formula-box'><b>Impairment loss</b><div class='fstack'>max(0, Carrying Amount − Recoverable Amount)</div></div><div class='formula-box'><b>VIU basic</b><div class='fstack'>Σ Future cash flowₜ ÷ (1+r)^t</div></div></td>\n   <td>Impairment usually SOPL, unless it reverses a previous revaluation where the underlying standard requires OCI treatment.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Indicator/annual test trigger identify.</li><li><b>Step 2:</b> CA calculate.</li><li><b>Step 3:</b> FVLCD and VIU available data calculate.</li><li><b>Step 4:</b> Higher amount = RA.</li><li><b>Step 5:</b> CA &gt; RA ဆို loss recognise/allocate.</li><li><b>Step 6:</b> Prior impairment reversal question ရှိရင် revised CA ceiling စစ်ပါ။</li></ol></td>\n   <td><div class='mini-example'><b>Single asset</b><br>CA 500k, FVLCD 430k, VIU 460k → RA 460k → impairment 40k.</div><div class='mini-example'><b>CGU</b><br>CGU CA 1,000 including goodwill 100; RA 850 → loss 150: goodwill 100 first, remaining 50 other assets pro-rata subject to minimum limits.</div></td>\n   <td><ul><li>Lower of FVLCD/VIU ကို RA လို့ယူခြင်း</li><li>Goodwill impairment ကို reverse လုပ်ခြင်း</li><li>CGU loss ကို goodwill မတိုင်ခင် assets ထဲ pro-rata ဖြန့်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Impairment indicators</b></td><td>External + internal indicators; certain assets annual testing required.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Recoverable amount</b></td><td>Higher of Fair Value Less Costs of Disposal (FVLCD) and Value in Use (VIU).</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Value in use</b></td><td>Future cash flows discounted to present value.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Individual asset</b></td><td>CA &gt; RA → impairment loss.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>CGU</b></td><td>Independent cash inflows မရှိတဲ့ assets ကို Cash-Generating Unit အဖြစ် test.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>CGU allocation</b></td><td>Loss ကို goodwill first, then other assets pro-rata subject to floors.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Reversal</b></td><td>Conditions improve ရင် reversal possible for non-goodwill assets; goodwill impairment reversal prohibited.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Calculation + journal/FS effect. Consolidation goodwill impairment နဲ့ အလွန်ချိတ်ဆက်တယ်။</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "Impairment question တွေမှာ Carrying Amount ကို Recoverable Amount နဲ့ နှိုင်းပြီး loss ကို allocate လုပ်ရတယ်။ Recoverable Amount = higher of l}, {"text": "Step 5 — CA > RA ဆို loss recognise/allocate.", "kind": "step", "children": [], "html": null}, {"text": "Step 6 — Prior impairment reversal question ရှိရင် revised CA ceiling စစ်ပါ။", "kind": "step", "children": [], "html": null}], "html": null}, {"text": "Examples / Application", "kind": "group", "children": [{"text": "Single asset", "kind": "example", "children": [{"text": "CA 500k, FVLCD 430k, VIU 460k → RA 460k → impairment 40k.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "CGU", "kind": "example", "children": [{"text": "CGU CA 1,000 including goodwill 100; RA 850 → loss 150: goodwill 100 first, remaining 50 other assets pro-rata subject to minimum limits.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Common Mistakes / Exam Traps", "kind": "group", "children": [{"text": "Lower of FVLCD/VIU ကို RA လို့ယူခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Goodwill impairment ကို reverse လုပ်ခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "CGU loss ကို goodwill မတိုင်ခင် assets ထဲ pro-rata ဖြန့်ခြင်း", "kind": "trap", "children": [], "html": null}], "html": null}, {"text": "Exam Focus", "kind": "group", "children": [{"text": "Calculation + journal/FS effect. Consolidation goodwill impairment နဲ့ အလွန်ချိတ်ဆက်တယ်။", "kind": "exam", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Chapter 8: IAS 37 – Provisions, Contingent Liabilities & Contingent Assets", "kind": "chapter", "children": [{"text": "Deep Excel-style Study Sheets", "kind": "group", "children": [{"text": "Deep Master Sheet", "kind": "sheet", "children": [], "html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 8 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 37 provision: present legal/constructive obligation from past event + probable outflow + reliable estimate.</td>\n   <td>Recognize best estimate; use expected value for large populations or most likely outcome adjusted for risk where appropriate; discount if time value is material.</td>\n   <td>Review each reporting date and update to current best estimate. Unwinding of discount increases the provision over time.</td>\n   <td>Dr Expense or Related Asset / Cr Provision. Unwinding: Dr Finance Cost / Cr Provision.</td>\n   <td><div class='formula-box'><b>Expected value</b><div class='fstack'>Σ (Probability × Outcome)</div></div><div class='formula-box'><b>PV of provision</b><div class='fstack'>Future expected payment ÷ (1+r)^n</div></div><div class='formula-box'><b>Unwinding</b><div class='fstack'>Opening discounted provision × discount rate</div></div></td>\n   <td>Provision in SOFP. Expense usually SOPL; decommissioning may initially be included in PPE. Contingent items may be disclosure-only.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Past event ရှိလား?</li><li><b>Step 2:</b> Present legal/constructive obligation ရှိလား?</li><li><b>Step 3:</b> Outflow probable လား?</li><li><b>Step 4:</b> Estimate reliable လား?</li><li><b>Step 5:</b> Recognition vs disclosure vs no action classify.</li><li><b>Step 6:</b> Measurement basis expected value/most likely/PV select.</li></ol></td>\n   <td><div class='mini-example'><b>Warranty</b><br>75% no fault, 20% minor repair 100, 5% major repair 1,000 → expected cost per unit = 0 + 20 + 50 = 70.</div><div class='mini-example'><b>Legal claim</b><br>Lawyer says loss unlikely → no provision; possible but not probable ဆို contingent liability disclosure.</div></td>\n   <td><ul><li>Future operating losses provision လုပ်ခြင်း</li><li>Board decision တစ်ခုတည်းနဲ့ constructive obligation ဖြစ်တယ်လို့ယူခြင်း</li><li>Contingent asset ကို probable ဖြစ်တာနဲ့ asset recognise လုပ်ခြင်း</li><li>Discounted provision unwinding မလုပ်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Provision criteria</b></td><td>Present legal/constructive obligation + probable outflow + reliable estimate.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Contingent liability</b></td><td>Possible obligation or present obligation not recognised because outflow not probable / estimate unreliable; disclose unless remote.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Contingent asset</b></td><td>Possible asset; disclose only when inflow probable, recognise when virtually certain.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Measurement</b></td><td>Best estimate. Large population → expected value; single obligation → most likely outcome adjusted for risks.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Discounting</b></td><td>Time value material ဖြစ်ရင် present value; unwinding = finance cost.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Restructuring</b></td><td>Detailed formal plan + valid expectation; only direct expenditures necessarily entailed.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Onerous contract</b></td><td>Unavoidable costs &gt; expected benefits → provision.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Decommissioning</b></td><td>Initial estimate may be added to related PPE with matching provision.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Scenario wording (&#x27;probable&#x27;, &#x27;possible&#x27;, &#x27;virtually certain&#x27;) ကို အလွန်သတိထား။</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "Provision question က 3-condition test ကို မှန်အောင်သုံးနိုင်ရမယ်: present obligation from past event, probable outflow, reliable estimate. မပြည့်ရင် contingent/disclosure/no action ကို distinguish လုပ်ရတယ်။", "kind": "overview", "children": [], "html": null}], "html": null}, {"text": "Rules / Criteria / Measurement", "kind": "group", "children": [{"text": "Criteria / Recognition", "kind": "topic", "children": [{"text": "IAS 37 provision: present legal/constructive obligation from past event + probable outflow + reliable estimate.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Initial Measurement", "kind": "topic", "children": [{"text": "Recognize best estimate; use expected value for large populations or most likely outcome adjusted for risk where appropriate; discount if time value is material.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Subsequent Measurement", "kind": "topic", "children": [{"text": "Review each reporting date and update to current best estimate. Unwinding of discount increases the provision over time.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Accounting / Journal Treatment", "kind": "topic", "children": [{"text": "Dr Expense or Related Asset / Cr Provision. Unwinding: Dr Finance Cost / Cr Provision.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Financial Statement Impact", "kind": .", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Formula / Working Map", "kind": "group", "children": [{"text": "Expected value", "kind": "formula", "children": [{"text": "Σ (Probability × Outcome)", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "PV of provision", "kind": "formula", "children": [{"text": "Future expected payment ÷ (1+r)^n", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Unwinding", "kind": "formula", "children": [{"text": "Opening discounted provision × discount rate", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Exam Thinking Process", "kind": "group", "children": [{"text": "Step 1 — Past event ရှိလား?", "kind": "step", "children": [], "html": null}, {"text": "Step 2 — Present legal/constructive obligation ရှိလား?", "kind": "step", "children": [], "html": null}, {"text": "Step 3 — Outflow probable လား?", "kind": "step", "children": [], "html": null}, {"text": "Step 4 — Estimate reliable လား?", "kind": "step", "children": [], "html": null}, {"text": "Step 5 — Recognition vs disclosure vs no action classify.", "kind": "step", "children": [], "html": null}, {"text": "Step 6 — Measurement basis expected value/most likely/PV select.", "kind": "step", "children": [], "html": null}], "html": null}, {"text": "Examples / Application", "kind": "group", "children": [{"text": "Warranty", "kind": "example", "children": [{"text": "75% no fault, 20% minor repair 100, 5% major repair 1,000 → expected cost per unit = 0 + 20 + 50 = 70.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Legal claim", "kind": "example", "children": [{"text": "Lawyer says loss unlikely → no provision; possible but not probable ဆို contingent liability disclosure.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Common Mistakes / Exam Traps", "kind": "group", "children": [{"text": "Future operating losses provision လုပ်ခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Board decision တစ်ခုတည်းနဲ့ constructive obligation ဖြစ်တယ်လို့ယူခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Contingent asset ကို probable ဖြစ်တာနဲ့ asset recognise လုပ်ခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Discounted provision unwinding မလုပ်ခြင်း", "kind": "trap", "children": [], "html": null}], "html": null}, {"text": "Exam Focus", "kind": "group", "children": [{"text": "Scenario wording ('probable', 'possible', 'virtually certain') ကို အလွန်သတိထား။", "kind": "exam", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Chapter 9: IAS 10 – Events after the Reporting Period", "kind": "chapter", "children": [{"text": "Deep Excel-style Study Sheets", "kind": "group", "children": [{"text": "Deep Master Sheet", "kind": "sheet", "children": [], "html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 9 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 10: determine whether post-reporting event gives evidence of a condition existing at reporting date (adjusting) or arose after reporting date (non-adjusting).</td>\n   <td>N/A — event classification standard.</td>\n   <td>Adjust amounts for adjusting events. Material non-adjusting events are disclosed, not adjusted. Reassess going concern where necessary.</td>\n   <td>Adjusting event: post the required correcting entry. Non-adjusting material event: no journal entry, disclosure only.</td>\n   <td><div class='formula-box'><b>No special formula</b><div class='fstack'>Classification drives whether existing amounts are adjusted or only disclosed.</div></div></td>\n   <td>May change asset/liability/profit amounts if adjusting; otherwise Notes disclosure. Going concern can affect the entire measurement basis.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Event date vs reporting date timeline ဆွဲပါ။</li><li><b>Step 2:</b> Underlying condition reporting date မှာရှိပြီးသားလား?</li><li><b>Step 3:</b> ရှိ → adjusting; မရှိ → non-adjusting.</li><li><b>Step 4:</b> Material non-adjusting → disclosure.</li><li><b>Step 5:</b> Going concern impact ကို separate check.</li></ol></td>\n   <td><div class='mini-example'><b>Customer bankruptcy</b><br>Year-end receivable customer ဟာ year-end မှာ financial difficulty ရှိပြီး Jan မှာ bankrupt → usually adjusting evidence for impairment.</div><div class='mini-example'><b>Fire after year-end</b><br>Factory fire arose after reporting date → non-adjusting, but material disclosure may be required.</div></td>\n   <td><ul><li>Cash paid after year-end ဆို adjusting လို့ယူခြင်း</li><li>Event date ကိုပဲကြည့်ပြီး underlying condition မကြည့်ခြင်း</li><li>Material non-adjusting event ကို လုံးဝ ignore လုပ်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Adjusting event</b></td><td>Reporting date မှာရှိပြီးသား condition အကြောင်း additional evidence ပေးတဲ့ event → amounts adjust.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Non-adjusting event</b></td><td>Reporting date နောက်မှ new condition ဖြစ် → no adjustment; material ဖြစ်ရင် disclose nature + estimate.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Authorisation date</b></td><td>Events considered up to date financial statements authorised for issue.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Going concern exception</b></td><td>Post-reporting event က going concern assumption ကို မသင့်တော့စေရင် pervasive basis issue ဖြစ်နိုင်တယ်.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Dividends</b></td><td>Reporting date နောက် declared dividend generally liability at reporting date မဟုတ်.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Timeline + evidence test ကို စာကြောင်းတိုတိုနဲ့ justify လုပ်ပါ။</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "Reporting date နောက်ပိုင်း event က reporting-date condition ကို confirm လုပ်တာလား၊ new condition လား ခွဲရတယ်။", "kind": "overview", "children": [], "html": null}], "html": null}, {"text": "Rules / Criteria / Measurement", "kind": "group", "children": [{"text": "Criteria / Recognition", "kind": "topic", "children": [{"text": "IAS 10: determine whether post-reporting event gives evidence of a condition existing at reporting date (adjusting) or arose after reporting date (non-adjusting).", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Initial Measurement", "kind": "topic", "children": [{"text": "N/A — event classification standard.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Subsequent Measurement", "kind": "topic", "children": [{"text": "Adjust amounts for adjusting events. Material non-adjusting events are disclosed, not adjusted. Reassess going concern where necessary.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Accounting / Journal Treatment", "kind": "topic", "children": [{"text": "Adjusting event: post the required co Master Sheet", "kind": "sheet", "children": [], "html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 10 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 2 inventory recognized when entity controls goods held for sale, in production, or materials/supplies to be consumed.</td>\n   <td>Cost = purchase + conversion + other costs to bring inventories to present location/condition; exclude abnormal waste, certain storage/admin/selling costs.</td>\n   <td>Measure at lower of Cost and NRV. Reverse prior write-down when NRV recovers, limited to original write-down.</td>\n   <td>Write-down: Dr Inventory Write-down Expense / Cr Inventory. Reversal: Dr Inventory / Cr Reversal of Write-down.</td>\n   <td><div class='formula-box'><b>NRV</b><div class='fstack'>Estimated selling price − Costs to complete − Selling costs</div></div><div class='formula-box'><b>Closing inventory</b><div class='fstack'>Quantity × lower of unit Cost and unit NRV</div></div><div class='formula-box'><b>Weighted average unit cost</b><div class='fstack'>Total cost of goods available ÷ Total units available</div></div></td>\n   <td>Inventory in Current Assets. Write-down/reversal affects Cost of Sales or operating expense in SOPL.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Inventory item/quantity establish.</li><li><b>Step 2:</b> Unit cost derive.</li><li><b>Step 3:</b> NRV derive.</li><li><b>Step 4:</b> Lower of cost &amp; NRV item-by-item/group appropriate basis.</li><li><b>Step 5:</b> Cut-off/GIT/consignment issueရှိရင် ownership first.</li></ol></td>\n   <td><div class='mini-example'><b>NRV</b><br>Cost 50; selling price 54; completion 3; selling cost 4 → NRV 47 → write down 3.</div><div class='mini-example'><b>Price rise</b><br>FIFO closing inventory tends to reflect latest purchase costs more closely than older layers; source notes compare FIFO vs average effects.</div></td>\n   <td><ul><li>Selling cost ကို inventory cost ထဲထည့်ခြင်း</li><li>Cost &gt; NRV ဖြစ်တာကို gain recognise လုပ်ခြင်း</li><li>NRV = selling price လို့သာယူခြင်း</li><li>Physical count only = ownership လို့ယူခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Cost</b></td><td>Purchase + conversion + other costs to bring inventory to present location/condition.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Exclude</b></td><td>Abnormal waste, unnecessary storage, admin overhead not contributing, selling costs.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Cost formulas</b></td><td>FIFO or weighted average for ordinarily interchangeable items; specific identification for unique items.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>NRV</b></td><td>Estimated selling price less estimated completion and selling costs.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Write-down</b></td><td>Cost &gt; NRV → expense/write-down.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Reversal</b></td><td>NRV recovery ဖြစ်ရင် prior write-down extent အထိ reverse.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Cut-off / ownership</b></td><td>Physical location တစ်ခုတည်းမဟုတ်ဘဲ risks/control/terms ကိုကြည့်ပြီး inventory ownership decide.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Short calculations + cut-off adjustments + gross profit effect တွေမေးလေ့ရှိတယ်။</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "Inventory ကို lower of Cost and NRV နဲ့ measure. Cost composition, FIFO/weighted average, write-down/reversal, cut-off/counting issues အဓိက။", "kind": "overview", "children": [], "html": null}], "html": null}, {"text": "Rules / Criteria / Measurement", "kind": "group", "children": [{"text": "Criteria / Recognition", "kind": "topic", "children": [{"text": "IAS 2 inventory recognized when entity controls goods held for sale, in production, or materials/supplies to be consumed.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Initial Measurement", "kind": "topic", "children": [{"text": "Cost = purchase + conversion + other costs to bring inventories to present location/condition; exclude abnormal waste, certain storage/admin/selling costs.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Subsequent Measurement", "kind": "topic", "children": [{"text": "Measure at lower of Cost and NRV. Reverse prior write-down when NRV recovers, limited to original write-down.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Accounting / Journal Treatment", "kind": "topic", "children": [{"text": "Write-down: Dr Inventory Write-down Expense / Cr Inventory. Reversal: Dr Inventory / Cr Reversal of Write-down.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Financial Statement Impact", "kind": "topic", "children": [{"text": "Inventory in Current Assets. Write-down/reversal affects Cost of Sales or opera ount 115.</div><div class='mini-example'><b>Rubber tree</b><br>Bearer tree itself → IAS 16; latex produce growing/harvest → IAS 41 then IAS 2 at harvest.</div></td>\n   <td><ul><li>Bearer plants ကို IAS 41 နဲ့ အမြဲ measure လုပ်ခြင်း</li><li>Harvestပြီးသား produce ကို IAS 41 ဆက်သုံးခြင်း</li><li>Fair value gain ကို OCI သွင်းခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Biological assets</b></td><td>Living animals/plants within IAS 41 scope.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Bearer plants</b></td><td>Produce bear လုပ်ပြီး themselves normally sold as produce မဟုတ်တဲ့ bearer plants → IAS 16.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Measurement</b></td><td>Initial and reporting date generally FVLCTS.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Changes in fair value</b></td><td>Gain/loss in SOPL.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Produce at harvest</b></td><td>Harvest date FVLCTS becomes deemed cost for IAS 2 thereafter.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Classification is the first mark; then measurement and SOPL effect.</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "Biological assets နဲ့ agricultural produce at harvest ကို Fair Value Less Costs to Sell နဲ့မေးတတ်တယ်။ Bearer plants က IAS 16 ဆီသွားတယ်။", "kind": "overview", "children": [], "html": null}], "html": n ective or prospective decide.</li><li><b>Step 3:</b> Opening equity/comparatives effect check.</li></ol></td>\n   <td><div class='mini-example'><b>Useful life revised</b><br>5 years to remaining 3 years based on new wear information → estimate change, prospective.</div><div class='mini-example'><b>Wrong depreciation omitted</b><br>Prior-year depreciation accidentally not recorded though info available → prior-period error, retrospective.</div></td>\n   <td><ul><li>Estimate change ကို error လို့ယူခြင်း</li><li>Policy change ကို current-year only adjust လုပ်ခြင်း</li><li>Error correction ကို change in estimate လို့ဖုံးခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Accounting policy</b></td><td>Principles/bases/rules used in preparing financial statements.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Policy change</b></td><td>Required by IFRS or more reliable/relevant information; normally retrospective.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Estimate change</b></td><td>New information/development from estimation uncertainty; prospective current + future.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Prior-period error</b></td><td>Mistake/omission/misuse of available reliable information; retrospective correction where practicable.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Disclosure</b></td><td>Nature and amount of material changes/corrections explain.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Classification + treatment + effect on comparatives/opening RE.</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "Policy change / Estimate change / Prior-period error ကို differentiate လုပ်တာက chapter အဓိက။", "kind": "overview", "children": [], "html": null}], "html": null}, {"text": "Rules / Criteria / Measurement", "kind": "group", "children": [{"text": "Criteria / Recognition", "kind": "topic", "children": [{"text": "IAS 8 first classify the change as Accounting Policy, Accounting Estimate, or Prior-period Error.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Initial Measurement", "kind": "topic", "children": [{"text": "N/A — classification/treatment standard.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Subsequent Measurement", "kind": "topic", "children": [{"text": "Policy changes normally retrospective; estimate changes prospective; prior-period material errors retrospective where practicable.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Accounting / Journal Treatment", "kind": "topic", "children": [{"text": "Policy/error may adjust opening Retained Earnings/comparatives; estimate changes affect current/future periods through normal entries.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Financial Statement Impact", "kind": "topic", "children": [{"text": "Can restate comparatives and opening equity, or affect current/future SOPL depending classification.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Topic Details", "kind": "group", "children": [{"text": "Accounting policy", "kind": "topic", "children": [{"text": "Principles/bases/rules used in preparing financial statements.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Policy change", "kind": "topic", "chi depreciation accidentally not recorded though info available → prior-period error, retrospective.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Common Mistakes / Exam Traps", "kind": "group", "children": [{"text": "Estimate change ကို error လို့ယူခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Policy change ကို current-year only adjust လုပ်ခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Error correction ကို change in estimate လို့ဖုံးခြင်း", "kind": "trap", "children": [], "html": null}], "html": null}, {"text": "Exam Focus", "kind": "group", "children": [{"text": "Classification + treatment + effect on comparatives/opening RE.", "kind": "exam", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Chapter 13: IFRS 5 – Non-current Assets Held for Sale & Discontinued Operations", "kind": "chapter", "children": [{"text": "Deep Excel-style Study Sheets", "kind": "group", "children": [{"text": "Deep Master Sheet", "kind": "sheet", "children": [], "html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 13 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IFRS 5 held-for-sale criteria include available for immediate sale and sale highly probable, with active plan/marketing and expected completion generally within one year.</td>\n   <td>Before classification, update carrying amount under applicable standards; then measure at lower of carrying amount and FVLCTS.</td>\n   <td>No depreciation while classified held for sale. Continue to reassess sale criteria and FVLCTS.</td>\n   <td>Impairment on classification: Dr Impairment Loss / Cr Asset. Reversal subject to IFRS 5 limits.</td>\n   <td><div class='formula-box'><b>HFS carrying amount</b><div class='fstack'>min(Carrying amount before classification, FVLCTS)</div></div><div class='formula-box'><b>Impairment on classification</b><div class='fstack'>CA − FVLCTS, if positive</div></div></td>\n   <td>Present separately as Current Asset. Discontinued operation results are separately presented in SOPL where criteria are met.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Criteria all substantially met?</li><li><b>Step 2:</b> Before classification, relevant asset standards update CA.</li><li><b>Step 3:</b> Compare CA vs FVLCTS.</li><li><b>Step 4:</b> Recognise impairment if needed.</li><li><b>Step 5:</b> Stop depreciation and present separately.</li></ol></td>\n   <td><div class='mini-example'><b>Asset CA 500, FVLCTS 460</b><br>Classify at 460; impairment 40; no further depreciation while HFS.</div><div class='mini-example'><b>Plan only</b><br>Management wants sale but no active buyer/marketing and sale not highly probable → criteria not met.</div></td>\n   <td><ul><li>Intention to sell = automatic HFS</li><li>FVLCTS &gt; CA ဖြစ်ရင် revalue up without basis</li><li>Held-for-sale ဖြစ်ပြီး depreciation ဆက်လုပ်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Held-for-sale criteria</b></td><td>Available for immediate sale + sale highly probable + active plan/marketing + expected within one year subject to exceptions.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Measurement</b></td><td>Lower of carrying amount and fair value less costs to sell.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Depreciation</b></td><td>Classification as held for sale after measurement adjustment → depreciation cease.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Presentation</b></td><td>Separate current asset line.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Discontinued operation</b></td><td>Disposed/held-for-sale component representing major line/geographical area etc.; results separately presented.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Criteria wording + measurement sequence ကို မေးတတ်တယ်။</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "Held for sale classification criteria ပြည့်တဲ့အခါ measurement changes, depreciation stop, presentation/discontinued operations ကို သိရမယ်။", "kind": "overview", "children": [], "html": null}], "html": null}, {"text": "Rules / Criteria / Measurement", "kind": "group", "children": [{"text": "Criteria / Recognition", "kind": "topic", "children": [{"text": "IFRS 5 held-for-sale criteria include available for immediate sale and sale highly probable, with active plan/marketing and expected completion generally within one year.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Initial Measurement", "kind": "topic", "children": [{"text": "Before classification, update carrying amount under applicable standards; then measure at lower of carrying amount and FVLCTS.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Subsequent Measurement", "kind": "topic", "children": [{"text": "No depreciation while classified held for sale. Continue to reassess sale criteria and FVLCTS.", "kind": "detail", "children": [], "html": null}], "html": null}, → payable increases 1,000 → FX loss.</div><div class='mini-example'><b>USD receivable</b><br>Rate strengthens from 3.60 to 3.70 local/USD → receivable local value rises → FX gain.</div></td>\n   <td><ul><li>All foreign items closing rate သုံးခြင်း</li><li>Receivable/payable gain/loss direction ပြောင်းမှားခြင်း</li><li>Rate quote numerator/denominator မစစ်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Initial recognition</b></td><td>Transaction-date spot rate.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Monetary items</b></td><td>Cash, receivables, payables etc. → reporting date closing rate.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Non-monetary historical cost</b></td><td>Historical transaction-date rate.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Non-monetary fair value</b></td><td>Rate at date fair value measured.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Exchange differences</b></td><td>Monetary retranslation/settlement differences generally SOPL, subject to specific exceptions.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Functional vs presentation currency</b></td><td>Functional currency reflects primary economic environment; presentation currency is reporting choice.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Simple retranslation + settlement, sometimes multiple date ference debit/credit direction reason with receivable/payable.", "kind": "step", "children": [], "html": null}], "html": null}, {"text": "Examples / Application", "kind": "group", "children": [{"text": "USD payable", "kind": "example", "children": [{"text": "Payable 10,000 USD; initially 3.60 local/USD = 36,000. Closing 3.70 = 37,000 → payable increases 1,000 → FX loss.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "USD receivable", "kind": "example", "children": [{"text": "Rate strengthens from 3.60 to 3.70 local/USD → receivable local value rises → FX gain.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Common Mistakes / Exam Traps", "kind": "group", "children": [{"text": "All foreign items closing rate သုံးခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Receivable/payable gain/loss direction ပြောင်းမှားခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Rate quote numerator/denominator မစစ်ခြင်း", "kind": "trap", "children": [], "html": null}], "html": null}, {"text": "Exam Focus", "kind": "group", "children": [{"text": "Simple retranslation + settlement, sometimes multiple dates.", "kind": "exam", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Chapter 15: IAS 33 – Earnings per Share (EPS)", "kind": "chapter", "children": [{"text": "Deep Excel-style Study Sheets", "kind": "group", "children": [{"text": "Deep Master Sheet", "kind": "sheet", "children": [], "html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 15 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 33 applies to entities required to present EPS. Calculate Basic EPS and, where relevant, Diluted EPS for dilutive potential ordinary shares.</td>\n   <td>Numerator = earnings attributable to ordinary shareholders; denominator = weighted-average ordinary shares.</td>\n   <td>Adjust for bonus/rights issues and potential ordinary shares where dilutive; restate comparatives where required.</td>\n   <td>No journal entry — EPS is a presentation/calculation measure.</td>\n   <td><div class='formula-box'><b>Basic EPS</b><div class='fstack'>Earnings attributable to ordinary shareholders ÷ Weighted-average ordinary shares</div></div><div class='formula-box'><b>P/E ratio link</b><div class='fstack'>Market price per share ÷ EPS</div></div><div class='formula-box'><b>Convertible diluted EPS</b><div class='fstack'>(Earnings + after-tax interest saved) ÷ (Weighted shares + conversion shares)</div></div></td>\n   <td>EPS disclosed/presented with performance information; no direct carrying amount effect.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Numerator clean: preference dividend effects.</li><li><b>Step 2:</b> Share timeline draw.</li><li><b>Step 3:</b> Issue type cash/bonus/rights identify.</li><li><b>Step 4:</b> Weighted average calculate.</li><li><b>Step 5:</b> Potential ordinary shares test for dilution.</li></ol></td>\n   <td><div class='mini-example'><b>Weighted shares</b><br>1m shares all year + 600k issued 1 Oct → WA = 1m + 600k×3/12 = 1.15m.</div><div class='mini-example'><b>Convertible</b><br>Profit 500k, after-tax interest 40k, WA shares 1m, conversion adds 200k → diluted EPS = 540k/1.2m = 0.45.</div></td>\n   <td><ul><li>Closing shares instead of weighted average</li><li>Bonus issue time-apportionment လုပ်ခြင်း</li><li>Anti-dilutive instrument ကို diluted EPS ထဲထည့်ခြင်း</li><li>Interest add-back ကို after-tax မလုပ်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Basic EPS numerator</b></td><td>Profit attributable to ordinary shareholders after preference dividends as relevant.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Weighted-average denominator</b></td><td>Shares × time fraction, adjusted for bonus elements where required.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Bonus issue</b></td><td>Restate comparative EPS as if bonus shares existed throughout.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Rights issue</b></td><td>Contains bonus element; theoretical ex-rights price adjustment may be needed.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Diluted EPS</b></td><td>Potential ordinary shares only if dilutive.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Convertible debt</b></td><td>Add back after-tax interest to numerator and add conversion shares to denominator.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Calculation accuracy and chronology are key.</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "Basic EPS မှာ earnings attributable to ordinary shareholders နဲ့ weighted-average shares ကို မှန်အောင်ပြင်ရမယ်။ Rights/bonus/share issues, convertible instruments dilute effect ကို စစ်တယ်။", "kind": "overview", "children": [], "html": null}], "html": null}, {"text": "Rules / Criteria / Measurement", "kind": "group", "children": [{"text": "Criteria / Recognition", "
