egory rules; compound instruments split into liability and equity at inception.</td>\n   <td>Amortised cost via EIR, FVPL, or FVOCI as applicable. Relevant expected credit loss impairment rules apply.</td>\n   <td>EIR: Dr Finance Cost / Cr Liability (or Dr Asset / Cr Interest Income). FVPL changes → SOPL. Compound issue: split liability/equity components.</td>\n   <td><div class='formula-box'><b>Amortised cost closing</b><div class='fstack'>Opening amortised cost + EIR interest − cash paid/received</div></div><div class='formula-box'><b>Compound liability PV</b><div class='fstack'>PV of interest coupons + PV of redemption amount using market rate for similar non-convertible debt</div></div><div class='formula-box'><b>Equity component</b><div class='fstack'>Issue proceeds − initial liability component</div></div></td>\n   <td>Financial assets/liabilities in SOFP; interest and FV movements affect SOPL/OCI depending category; equity component remains in equity.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Instrument terms read: cash obligation? conversion? discretion?</li><li><b>Step 2:</b> Issuer vs holder perspective separate.</li><li><b>Step 3:</b> Business model + cash flow features map measurement category.</li><li><b>Step 4:</b> EIR schedule build if amortised cost.</li><li><b>Step 5:</b> FV changes/interest presentation decide.</li></ol></td>\n   <td><div class='mini-example'><b>Convertible bond</b><br>Issue 1,000; liability PV at market debt rate = 920 → equity component 80.</div><div class='mini-example'><b>Amortised loan</b><br>Opening 920 × EIR 8% = 73.6 interest; coupon 50 → closing liability 943.6.</div></td>\n   <td><ul><li>Legal name &#x27;share&#x27; ဆိုတိုင်း equity</li><li>Coupon rate = EIR လို့ယူခြင်း</li><li>Compound instrument ကို full liability/full equity တစ်ခုတည်းထားခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Liability vs equity</b></td><td>Contractual obligation to deliver cash → liability; residual interest with no such obligation → equity.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Compound instrument</b></td><td>Convertible bond issue proceeds split liability + equity components at inception.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Amortised cost</b></td><td>Held to collect + SPPI conditions met → effective interest method.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>FVPL</b></td><td>Default/held-for-trading or conditions not met → fair value changes SOPL.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>FVOCI</b></td><td>Certain eligible debt/equity classifications subject to conditions/election.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Transaction costs</b></td><td>Treatment depends on classification; FVPL often expense, other categories may include in initial measurement.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Impairment</b></td><td>Expected credit loss concepts apply to relevant financial assets.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Classification and amortised-cost tables are common.</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "Issuer side မှာ liability vs equity classification; investor side မှာ financial assets measurement. Amortised cost/EIR, FVPL, FVOCI xam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IFRS 16: contract contains a lease when there is an identified asset and customer controls its use for a period in exchange for consideration.</td>\n   <td>Lease Liability = PV of unpaid lease payments. ROU Asset = Lease liability + eligible initial amounts/costs − incentives + restoration estimate where applicable.</td>\n   <td>Lease liability: EIR interest + payments. ROU asset: depreciation + impairment. Remeasure for specified lease changes.</td>\n   <td>Commencement: Dr ROU Asset / Cr Lease Liability. Interest: Dr Finance Cost / Cr Liability. Payment: Dr Liability / Cr Cash. Depreciation: Dr Expense / Cr Accum. Dep.</td>\n   <td><div class='formula-box'><b>Lease liability at commencement</b><div class='fstack'>PV of unpaid lease payments</div></div><div class='formula-box'><b>Closing lease liability</b><div class='fstack'>Opening liability + Finance interest − Cash lease payment</div></div><div class='formula-box'><b>ROU depreciation</b><div class='fstack'>ROU depreciable amount ÷ lease term (or useful life where ownership criteria dictate)</div></div></td>\n   <td>ROU asset and lease liability in SOFP; depreciation generally Operating; interest/finance presentation follows applicable reporting requirements.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Contract contains lease?</li><li><b>Step 2:</b> Payment timing arrears/advance identify.</li><li><b>Step 3:</b> PV schedule build.</li><li><b>Step 4:</b> ROU cost assemble.</li><li><b>Step 5:</b> Annual interest/payment/depreciation separate.</li><li><b>Step 6:</b> Current/non-current liability split if required.</li></ol></td>\n   <td><div class='mini-example'><b>Arrears lease</b><br>Opening LL 100,000, 10% interest, year-end payment 30,000 → closing LL 80,000.</div><div class='mini-example'><b>ROU cost</b><br>LL 100k + initial direct cost 5k + prepaid 10k − incentive 3k = ROU 112k before restoration adjustments.</div></td>\n   <td><ul><li>Lease payment အားလုံး expense</li><li>Interest ကို payment မှနုတ်မပြုဘဲ liability schedule မှားခြင်း</li><li>ROU depreciation နဲ့ liability interest ကိုတစ်ခုတည်းထင်ခြင်း</li><li>Payments in advance vs arrears မခွဲခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Identify a lease</b></td><td>Identified asset + right to control use during period in exchange for consideration.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Lease liability</b></td><td>PV of lease payments using interest rate implicit or incremental borrowing rate where appropriate.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>ROU initial cost</b></td><td>Initial liability + payments before commencement − incentives + initial direct costs + dismantling/restoration estimate.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Subsequent liability</b></td><td>Interest accrues; payments reduce liability.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>ROU subsequent</b></td><td>Depreciation + impairment, subject to ownership/purchase option/useful life rules.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Short-term/low-value exemptions</b></td><td>Election may allow expense recognition rather than full ROU model.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Lease modifications</b></td><td>Depending on scope/consideration changes, separate lease or remeasurement.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Schedule format ကို တိတိကျကျရေးနိုင်ရင် marks မြန်မြန်ရတယ်။</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "Lessee accounting မှာ Right-of-Use Asset (ROU) + Lease Liability ကို recognise လုပ်ပြီး liability ကို interest + payment နဲ့ unwind လုပ်တယ်။", "kind": "overview", "children": [], "html": null}], "html": null}, {"text": "Rules / Criteria / Measurement", "kind": "group", "children": [{"text": "Criteria / Recognition", "kind": "topic", "children": [{"text": "IFRS 16: contract contains a lease when there is an identified asset and customer controls its use for a period in exchange for consideration.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Initial Measurement", "kind": "topic", "children": [{"text": "Lease Liability = PV of unpaid lease payments. ROU Asset = Lease liability + eligible initial amounts/costs − incentives + restoration estimate where applicable.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Subsequent Measurement", "kind": "topic", "children": [{"text": "Lease liability: EIR interest + payments. ROU asset: depreciation + impairment. Remeasure for specified lease changes.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Accounting / Journal Treatment", "kind": "topic", "children": [{"text": "Commencement: Dr ROU Asset / Cr Lease Liability. Interest: Dr Finance Cost / Cr Liability. Payment: Dr Liability / Cr Cash. Depreciation: Dr Expense / Cr Accum. Dep.", it × Current tax rate</div></div><div class='formula-box'><b>Temporary difference</b><div class='fstack'>Carrying Amount − Tax Base (interpret sign with asset/liability nature)</div></div><div class='formula-box'><b>Deferred tax</b><div class='fstack'>Temporary difference × Applicable future tax rate</div></div></td>\n   <td>Current tax payable/receivable and deferred tax in SOFP; tax expense/income in SOPL or OCI/equity following underlying item.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Current tax separate from deferred tax.</li><li><b>Step 2:</b> For each asset/liability write CA and TB side-by-side.</li><li><b>Step 3:</b> Future recovery/settlement produces taxable or deductible amount?</li><li><b>Step 4:</b> DTL/DTA classify.</li><li><b>Step 5:</b> Apply future enacted/substantively enacted rate.</li><li><b>Step 6:</b> Underlying item SOPL/OCI/equity where tax effect should go.</li></ol></td>\n   <td><div class='mini-example'><b>Revalued asset</b><br>CA 150, TB 100, taxable temp diff 50; tax 30% → DTL 15. If difference arose from OCI revaluation, tax effect also OCI.</div><div class='mini-example'><b>Tax loss</b><br>Tax loss 3,000 carried forward; rate 25%; probable future taxable profits sufficient → DTA up to 750.</div></td>\n   <td><ul><li>Current tax provision = deferred tax</li><li>CA-TB sign mechanically useပြီး asset/liability nature မစဉ်းစားခြင်း</li><li>Revaluation tax effect SOPL သွင်းခြင်း when underlying gain OCI</li><li>DTA on losses အလိုအလျောက် recognise</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Current tax</b></td><td>Taxable profit × enacted/substantively enacted rate, adjusted for under/over-provisions.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Tax base</b></td><td>Asset/liability carrying amount နဲ့ tax purposes recoverable/deductible amount relationship.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Temporary differences</b></td><td>Taxable temporary difference → generally DTL; deductible temporary difference → potential DTA subject to recoverability.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Revaluation</b></td><td>Revaluation creates temporary difference even if no immediate sale; tax effect follows underlying transaction (e.g. OCI if revaluation in OCI).</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Unused tax losses</b></td><td>DTA only to extent probable future taxable profits available.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Presentation</b></td><td>Deferred tax generally non-current; tax effect follows location of underlying item where applicable.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> CA/TB table method is safest.</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "Current tax = current-period taxable profit on tax rules. Deferred tax = accounting carrying amount နဲ့ tax base ကြား temporary difference က future tax consequence ကို recognise လုပ်တာ။", "kind": "overview", "children": [], "html": null}], "html": null}, {"text": "Rules / Criteria / Measurement", "kind": "group", "children": [{"text": "Criteria / Recognition", "kind": "topic", "children": [{"text": "IAS 12: compare carrying amount with tax base to identify taxable or deductible temporary differences.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text" ks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IFRS 15: apply 5-step model — contract, performance obligations, transaction price, allocation, recognition when/as performance obligations are satisfied.</td>\n   <td>Measure transaction price including fixed/variable consideration, significant financing and other required adjustments; allocate based on relative stand-alone selling prices.</td>\n   <td>Recognize revenue at a point in time or over time; update progress and variable consideration estimates subject to constraint.</td>\n   <td>Revenue: Dr Receivable/Contract Asset/Cash / Cr Revenue. Advance billing: Dr Cash/Receivable / Cr Contract Liability.</td>\n   <td><div class='formula-box'><b>Expected value</b><div class='fstack'>Σ Probability × Possible consideration</div></div><div class='formula-box'><b>Allocation</b><div class='fstack'>Transaction price × (PO stand-alone price ÷ Total stand-alone prices)</div></div><div class='formula-box'><b>Progress – cost-to-cost</b><div class='fstack'>Costs incurred to date ÷ Total expected costs</div></div><div class='formula-box'><b>Revenue over time</b><div class='fstack'>Allocated transaction price × % progress</div></div><div class='formula-box'><b>Contract asset</b><div class='fstack'>Cumulative revenue recognised − Cumulative amount billed (if positive)</div></div></td>\n   <td>Revenue in SOPL; Contract Assets / Receivables / Contract Liabilities in SOFP.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Contract scope confirm.</li><li><b>Step 2:</b> List distinct POs.</li><li><b>Step 3:</b> Transaction price incl variable/financing adjust.</li><li><b>Step 4:</b> Allocate by relative SSP.</li><li><b>Step 5:</b> For each PO decide point-in-time vs over-time.</li><li><b>Step 6:</b> Compute revenue + contract asset/liability + special return/warranty entries.</li></ol></td>\n   <td><div class='mini-example'><b>Bundle</b><br>Licence SSP 100, support SSP 50, transaction price 120 → allocate 80 to licence and 40 to support.</div><div class='mini-example'><b>Construction</b><br>Price 1m; costs to date 300k; total expected cost 750k → progress 40%; revenue 400k if cost-to-cost faithfully depicts performance.</div><div class='mini-example'><b>Right of return</b><br>Recognise revenue only expected-to-be-kept amount + refund liability for expected returns + right-to-recover asset for returned inventory.</div></td>\n   <td><ul><li>Invoice = revenue</li><li>Cash receipt = revenue</li><li>Variable consideration full amount recognise without constraint</li><li>Multiple obligations ကို one bundle အဖြစ်မစစ်ဘဲတစ်ခါတည်း revenue</li><li>Expected loss on contract treatment ignore</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Step 1 Contract</b></td><td>Approved, rights/payment terms identifiable, commercial substance, collectability probable.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Step 2 Performance obligations</b></td><td>Distinct goods/services identify.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Step 3 Transaction price</b></td><td>Fixed + variable consideration, significant financing, non-cash consideration, consideration payable to customer.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Variable consideration</b></td><td>Expected value or most likely amount; constraint to avoid significant reversal.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Step 4 Allocation</b></td><td>Relative stand-alone selling prices.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure Step 6 — Compute revenue + contract asset/liability + special return/warranty entries.", "kind": "step", "children": [], "html": null}], "html": null}, {"text": "Examples / Application", "kind": "group", "children": [{"text": "Bundle", "kind": "example", "children": [{"text": "Licence SSP 100, support SSP 50, transaction price 120 → allocate 80 to licence and 40 to support.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Construction", "kind": "example", "children": [{"text": "Price 1m; costs to date 300k; total expected cost 750k → progress 40%; revenue 400k if cost-to-cost faithfully depicts performance.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Right of return", "kind": "example", "children": [{"text": "Recognise revenue only expected-to-be-kept amount + refund liability for expected returns + right-to-recover asset for returned inventory.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Common Mistakes / Exam Traps", "kind": "group", "children": [{"text": "Invoice = revenue", "kind": "trap", "children": [], "html": null}, {"text": "Cash receipt = revenue", "kind": "trap", "children": [], "html": null}, {"text": "Variable consideration full amount recognise without constraint", "kind": "trap", "children": [], "html": null}, {"text": "Multiple obligations ကို one bundle အဖြစ်မစစ်ဘဲတစ်ခါတည်း revenue", "kind": "trap", "children": [], "html": null}, {"text": "Expected loss on contract treatment ignore", "kind": "trap", "children": [], "html": null}], "html": null}, {"text": "Exam Focus", "kind": "group", "children": [{"text": "Section B/C scenario အတွက် 5-step headings ကို answer structure အဖြစ်သုံးပါ။", "kind": "exam", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Chapter 20: IAS 20 – Government Grants", "kind": "chapter", "children": [{"text": "Deep Excel-style Study Sheets", "kind": "group", "children": [{"text": "Deep Master Sheet", "kind": "sheet", "children": [], "html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 20 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 20: recognize government grant only when reasonable assurance exists that conditions will be complied with and grant will be received.</td>\n   <td>Measure grant at receivable amount according to grant terms and accounting method.</td>\n   <td>Recognize systematically over periods of related costs. Asset grants may be deferred income or deducted from asset carrying amount under permitted policy.</td>\n   <td>Deferred income method: Dr Cash/Receivable / Cr Deferred Grant; then Dr Deferred Grant / Cr Grant Income over related periods.</td>\n   <td><div class='formula-box'><b>Deferred grant release</b><div class='fstack'>Deferred grant amount ÷ related asset useful life (simple straight-line case)</div></div><div class='formula-box'><b>Net asset method depreciation</b><div class='fstack'>(Asset cost − grant credited against asset − residual value) ÷ useful life</div></div></td>\n   <td>Grant may reduce asset carrying amount or appear as deferred income; related grant income affects SOPL systematically.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Grant conditions + assurance.</li><li><b>Step 2:</b> Asset-related/income-related classify.</li><li><b>Step 3:</b> Policy/presentation method identify.</li><li><b>Step 4:</b> Match release to expense/depreciation period.</li><li><b>Step 5:</b> Repayment/change issue separately.</li></ol></td>\n   <td><div class='mini-example'><b>Asset grant</b><br>Machine 100k, grant 20k, life 4 years. Deferred-income method: asset depreciates on 100k; grant income 5k/year.</div><div class='mini-example'><b>Expense grant</b><br>Training subsidy covering this year&#x27;s eligible expense → recognise grant in same period as related expense, subject to conditions.</div></td>\n   <td><ul><li>Cash received = immediate income</li><li>Asset grant full SOPL day one</li><li>Grant recognition before conditions reasonably assured</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Recognition</b></td><td>Reasonable assurance entity will comply with conditions and grant will be received.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Income-related grants</b></td><td>Related expenses recognised over periods; present gross or net as permitted presentation approach.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Asset-related grants</b></td><td>Deferred income approach or deduct from asset carrying amount depending policy permitted by standard.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Matching</b></td><td>Grant receipt date မဟုတ်ဘဲ related costs period နဲ့ systematic basis.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Repayment</b></td><td>Change in estimate style accounting; repayment consequences depend on grant type.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Calculation small but presentation and matching logic important.</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "Grant ကို reasonable assurance ရှိမှ recognise. Grant purpose နဲ့ related cost periods ကို match လုပ်ရမယ်။ Asset-related vs income-related treatment ခွဲပါ။", "kind": "overview", "children": [], "html": null}], "html": null}, {"text": "Rules / Criteria / Measurement", "kind": "group", "children": [{"text": "Criteria / Recognition", "kind": "topic", "children": [{"text": "IAS 20: recognize government grant only when reasonable assurance exists that conditions will be complied with and grant will be received.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Initial Measurement", "kind": "topic", "children": [{"text": "Measure grant at receivable amount according to grant terms and accounting method.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Subsequent Measurement", "kind": "topic", "children": [{"text": "Recognize systematically over periods of related costs. Asset grants may be deferred income or deducted from asset carrying amount under permitted policy.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Accounting / Journal Treatment", "kind": "topic", "children": [{"text": "Deferred income method: Dr Cash/Receivable / Cr Deferred Grant; then Dr Deferred Grant / Cr Grant Income over related periods.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Financial Statement Impact", "kind": "topic", "children": [{"text": "Grant may reduce asset carrying amount or appear as deferred income; related grant income affects SOPL systematically.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Topic Details", "kind": "group", "children": [{"text": "Recognition", "kind": "topic", "children": [{"text": "Reasonable assurance entity will comply with conditions and grant will be received.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Income-related grants", "kind": "topic", "children": [{"text": "Related expenses recognised over periods; present gross or net as permitted presentation approach.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Asset-related grants", "kind": "topic", "children": [{"text": "Deferred income approach or deduct from asset carrying amount depending policy permitted by standard.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Matching", "kind": "topic", "children": [{"text": "Grant receipt date မဟုတ်ဘဲ related costs period နဲ့ systematic basis.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Repayment", "kind": "topic", "children": [{"text": "Change in estimate style accounting; repayment consequences depend on grant type.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Formula / Working Map", "kind": "group", "children": [{"text": "Deferred grant release", "kind": "formula", "children": [{"text": "Deferred grant amount ÷ related asset useful life (simple straight-line case)", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Net asset method depreciation", "kind": "formula", "children": [{"text": "(Asset cost − grant credited against asset − residual value) ÷ useful life", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Exam Thinking Process", "kind": "group", "children": [{"text": "Step 1 — Grant conditions + assurance.", "kind": "step", "children": [], "html": null}, {"text": "Step 2 — Asset-related/income-related classify.", "kind": "step", "children": [], "html": null}, {"text": "Step 3 — Policy/presentation method identify.", "kind": "step", "children": [], "html": null}, {"text": "Step 4 — Match release to expense/depreciation period.", "kind": "step", "children": [], "html": null}, {"text": "Step 5 — Repayment/change issue separately.", "kind": "step", "children": [], "html": null}], "html": null}, {"text": "Examples / Application", "kind": "group", "children": [{"text": "Asset grant", "kind": "example", "children": [{"text": "Machine 100k, grant 20k, life 4 years. Deferred-income method: asset depreciates on 100k; grant income 5k/year.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Expense grant", "kind": "example", "children": [{"text": "Training subsidy covering this year's eligible expense → recognise grant in same period as related expense, subject to conditions.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Common Mistakes / Exam Traps", "kind": "group", "children": [{"text": "Cash received = immediate income", "kind": "trap", "children": [], "html": null}, {"text": "Asset grant full SOPL day one", "kind": "trap", "children": [], "html": null}, {"text": "Grant recognition before conditions reasonably assured", "kind": "trap", "children": [], "html": null}], "html": null}, {"text": "Exam Focus", "kind": "group", "children": [{"text": "Calculation small but presentation and matching logic important.", "kind": "exam", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Chapter 21: Financial Statement Analysis & Ratios", "kind": "chapter", "children": [{"text": "Deep Excel-style Study Sheets", "kind": "group", "children": [{"text": "Ratio Interpretation — Good / Bad / Caveats", "kind": "sheet", "children": [], "html": "\n    <div class=\"sheet-wrap wide-sheet\">\n      <div class=\"sheet-title\">Chapter 21 — Ratio Interpretation Master Sheet</div>\n      <div class=\"sheet-note\">\n        <b>Important:</b> Ratio တစ်ခုမှာ “↑ = good / ↓ = bad” လို့ mechanical rule မရှိပါ။ \n        Trend + scenario + industry + accounting policy + one-off events ကိုအတူကြည့်ရမယ်။\n      </div>\n      <table class=\"excel-sheet ratio-table\">\n        <thead>\n          <tr>\n            <th>Ratio</th><th>Formula</th><th>What it measures</th>\n            <th>When movement is usually GOOD</th><th>When movement is usually BAD</th>\n            <th>When that judgement can fail</th><th>Cross-link with other ratios</th><th>Exam thinking</th>\n          </tr>\n        </thead>\n        <tbody>\n        <tr>\n          <td><b>ROCE</b></td>\n          <td class=\"formula-text\">PBIT / Capital Employed × 100</td>\n          <td>Long-term capital ကိုသုံးပြီး operating return ဘယ်လောက်ထုတ်နိုင်သလဲကိုကြည့်တယ်။</td>\n          <td class=\"good\">ယေဘုယျအားဖြင့် ↑ ကောင်းတယ် — operating profit ပိုရလာခြင်း သို့ capital employed ကိုပိုထိရောက်စွာသုံးနိုင်ခြင်းဖြစ်နိုင်တယ်။</td>\n          <td class=\"bad\">↓ ဆို operating profit ကျခြင်း၊ capital employed တိုးပြီး profit မလိုက်ခြင်း၊ new assets မထိရောက်သေးခြင်း စတာတွေဖြစ်နိုင်တယ်။</td>\n          <td>Asset age, revaluation vs cost model, industry capital intensity, acquisition timing ကြောင့် ROCE ကို artificial ပြောင်းနိုင်တယ်။ New PPE year-end နီးမှဝယ်ရင် CE တက်ပေမယ့် profit မထုတ်ရသေးလို့ ROCE ကျနိုင်တယ်။</td>\n          <td>ROCE = Profit Margin × Asset Turnover. ROCE ပြောင်းရင် margin side လား asset efficiency side လား ခွဲစစ်ပါ။</td>\n          <td>Step 1 ratio movement → Step 2 margin/asset turnover split → Step 3 scenario reason → Step 4 implication.</td>\n        </tr>\n        <tr>\n          <td><b>Operating / Net Profit Margin</b></td>\n          <td class=\"formula-text\">PBIT / Revenue × 100</td>\n          <td>Sales တစ်ဒေါ်လာ/တစ်ကျပ်က operating profit ဘယ်လောက်ကျန်သလဲ။</td>\n          <td class=\"good\">↑ ဆို selling price, sales mix, operating cost control ကောင်းလာနိုင်တယ်။</td>\n          <td class=\"bad\">↓ ဆို operating expenses တက်ခြင်း၊ discounting, inefficient overheads, impairment/one-off costs စတာတွေဖြစ်နိုင်တယ်။</td>\n          <td>One-off restructuring/impairment, classification changes, acquisition costs, accounting policy differences ရှိရင် normal operating performance ကိုမပြနိုင်ဘူး။</td>\n          <td>Gross margin နဲ့နှိုင်း။ GP margin stable ဖြစ်ပြီး operating margin ↓ ဆို operating expenses side ကိုရှာ။</td>\n          <td>Margin change ကို &#x27;higher/lower&#x27; လို့ပဲမရေးဘဲ exact cause + consequence ကိုချိတ်ရေး။</td>\n        </tr>\n        <tr>\n          <td><b>Gross Profit Margin</b></td>\n          <td class=\"formula-text\">Gross Profit / Revenue × 100</td>\n          <td>Core trading/manufacturing gross spread ကိုတိုင်းတယ်။</td>\n          <td class=\"good\">↑ ဆို selling price တက်၊ purchase/production cost လျော့၊ favourable sales mix ဖြစ်နိုင်တယ်။</td>\n          <td class=\"bad\">↓ ဆို selling price cuts, input cost increases, unfavourable mix, inventory write-down, cost classification change ဖြစ်နိုင်တယ်။</td>\n          <td>Depreciation/COS classification ပြောင်းရင် ratio comparison distort ဖြစ်နိုင်တယ်။ Industry/sector margin differences လည်းများတယ်။</td>\n          <td>GP margin ↓ but Revenue ↑ → growth achieved by discounting ဖြစ်နိုင်လား scenario စစ်။ GP margin ↓ + Inventory days ↑ → slow/obsolete inventory pressure ဖြစ်နိုင်လား စစ်။</td>\n          <td>Source notes list selling price, sales mix, purchase price/cost, cost classification, inventory write-off as drivers.</td>\n        </tr>\n        <tr>\n          <td><b>Asset Turnover</b></td>\n          <td class=\"formula-text\">Revenue / Capital Employed</td>\n          <td>Capital employed တစ်ယူနစ်က revenue ဘယ်လောက်ဖန်တီးသလဲ။</td>\n          <td class=\"good\">↑ ကိုယေဘုယျအားဖြင့် capital use efficiency ပိုကောင်းတယ်။</td>\n          <td class=\"bad\">↓ ဆို under-utilised assets, recent investment, weak sales, capital employed over-expansion ဖြစ်နိုင်တယ်။</td>\n          <td>Old assets have low carrying amounts → turnover artificially high. Revaluation/new PPE → denominator higher → turnover lower even without real deterioration.</td>\n          <td>Profit Margin × Asset Turnover = ROCE. Asset turnover ↑ but margin ↓ could reflect high-volume/low-margin strategy.</td>\n          <td>Industry type (manufacturing vs service) မတူရင် direct comparison မလုပ်ခင် capital intensity စစ်။</td>\n        </tr>\n        <tr>\n          <td><b>ROE</b></td>\n          <td class=\"formula-text\">Profit attributable to ordinary shareholders / Ordinary shareholders&#x27; equity × 100</td>\n          <td>Ordinary shareholders ရဲ့ equity ပေါ် return ကိုကြည့်တယ်။</td>\n          <td class=\"good\">↑ usually shareholder return ပိုမြင့်။</td>\n          <td class=\"bad\">↓ shareholder return လျော့။</td>\n          <td>High debt can boost ROE while increasing financial risk. Source notes say ROE is less widely used than ROCE for overall return analysis.</td>\n          <td>ROE ကို gearing, interest expense, retained earnings နဲ့တွဲကြည့်။</td>\n          <td>High ROE တစ်ခုတည်းနဲ့ &#x27;excellent&#x27; မဆို — debt-funded leverage ရှိ/မရှိစစ်။</td>\n        </tr>\n        <tr>\n          <td><b>Current Ratio</b></td>\n          <td class=\"formula-text\">Current Assets / Current Liabilities</td>\n          <td>Short-term liabilities ကို current assets နဲ့ cover လုပ်နိုင်မှု။</td>\n          <td class=\"good\">↑ generally liquidity improves if current assets are genuinely realisable.</td>\n          <td class=\"bad\">↓ can mean reduced short-term cover / liquidity pressure.</td>\n          <td>အရမ်းမြင့်တာလည်းကောင်းမဟုတ်နိုင် — capital tied up in inventory/receivables. Source notes expect &gt;1 in theory but practical acceptable level depends on business.</td>\n          <td>Quick ratio gap ကိုကြည့် — big gap means inventory is a major component. Inventory quality and receivable recoverability check.</td>\n          <td>Current ratio ↑ = automatically good မဟုတ်။ Composition of current assets ကို comment လုပ်။</td>\n        </tr>\n        <tr>\n          <td><b>Quick / Acid-test Ratio</b></td>\n          <td class=\"formula-text\">(Current Assets − Inventory) / Current Liabilities</td>\n          <td>Inventory မရောင်းဘဲ quick assets နဲ့ short-term liabilities cover လုပ်နိုင်မှု။</td>\n          <td class=\"good\">↑ usually stronger immediate liquidity.</td>\n          <td class=\"bad\">↓ suggests more dependence on inventory conversion or weaker quick liquidity.</td>\n          <td>Fast inventory-turnover businesses can operate acceptably below 1; slow inventory businesses need stronger quick cover. Source notes mention theoretical benchmark around 0.8–1 depending turnover.</td>\n          <td>Current Ratio vs Quick Ratio gap → inventory reliance. Pair with Inventory Days.</td>\n          <td>Supermarket-style fast inventory business နဲ့ slow-moving stock business ကို benchmark တူတူမသုံး။</td>\n        </tr>\n        <tr>\n          <td><b>Inventory Holding Period</b></td>\n          <td class=\"formula-text\">Inventory / Cost of Sales × 365 days</td>\n          <td>Inventory ကို average ဘယ်နှရက်ကိုင်ထားသလဲ။</td>\n          <td class=\"good\">↓ generally faster conversion to sales/cash, lower holding/obsolescence risk.</td>\n          <td class=\"bad\">↑ often slow-moving stock, cash tied up, damage/obsolescence risk.</td>\n          <td>Too low can also signal under-stocking / lost sales. Seasonal build-up may be intentional. Use scenario.</td>\n          <td>Inventory days ↑ + Current ratio ↑ but Quick ratio weak → apparent liquidity may be inventory-heavy.</td>\n          <td>Source notes explicitly link increase with slow moving inventory and capital tied up.</td>\n        </tr>\n        <tr>\n          <td><b>Inventory Turnover</b></td>\n          <td class=\"formula-text\">Cost of Sales / Inventory</td>\n          <td>Year အတွင်း inventory ဘယ်နှကြိမ် turnover ဖြစ်သလဲ။</td>\n          <td class=\"good\">↑ generally faster turnover.</td>\n          <td class=\"bad\">↓ generally slower movement / excess stock.</td>\n          <td>Very high turnover may indicate stock-outs. Seasonal businesses need average inventory / same-period comparison.</td>\n          <td>Rough inverse relationship to Inventory Days.</td>\n          <td>Do not praise high turnover without considering supply reliability and stock-outs.</td>\n        </tr>\n        <tr>\n          <td><b>Receivables Collection Period</b></td>\n          <td class=\"formula-text\">Trade Receivables / Credit Revenue × 365 days</td>\n          <td>Credit customers ထံကနေ collection အတွက် average ဘယ်နှရက်ကြာသလဲ။</td>\n          <td class=\"good\">↓ generally quicker collection, stronger cash position, lower irrecoverable debt risk, effective credit control.</td>\n          <td class=\"bad\">↑ cash tied up, weaker cash flow, higher bad-debt risk, relaxed/poor credit control.</td>\n          <td>Longer period can intentionally support revenue growth if company extends credit terms. Compare to stated credit policy and sales growth.</td>\n          <td>Receivable days ↑ + Revenue ↑ → possibly growth from relaxed credit. Check bad debts / cash flow.</td>\n          <td>Source notes list both possible revenue improvement and cash/bad-debt downside; give balanced interpretation.</td>\n        </tr>\n        <tr>\n          <td><b>Payables Payment Period</b></td>\n          <td class=\"formula-text\">Trade Payables / Credit Purchases × 365 days (COS proxy if necessary)</td>\n          <td>Suppliers ကိုပေးချေဖို့ average ဘယ်နှရက်ယူသလဲ။</td>\n          <td class=\"good\">↑ can improve cash flow because cash is retained longer.</td>\n          <td class=\"bad\">↑ can also signal cash difficulty, lost discounts, supplier relationship damage. ↓ can improve supplier relationship but uses cash faster.</td>\n          <td>There is no simple &#x27;higher = good&#x27;. Compare with supplier terms, discounts, cash pressure and receivable/inventory cycle.</td>\n          <td>Working Capital Cycle = Inventory Days + Receivable Days − Payable Days.</td>\n          <td>Use two-sided answer: liquidity benefit vs supplier/discount/creditworthiness risk.</td>\n        </tr>\n        <tr>\n          <td><b>Working Capital / Cash Cycle</b></td>\n          <td class=\"formula-text\">Inventory Days + Receivable Days − Payable Days</td>\n          <td>Cash inventory/customer cycle ထဲမှာ net ဘယ်နှရက်ပိတ်နေလဲ။</td>\n          <td class=\"good\">↓ generally means cash is recovered faster / lower working-capital funding need.</td>\n          <td class=\"bad\">↑ means more cash tied up for longer.</td>\n          <td>Negative cycle can be normal/good in supermarkets or advance-cash models. Too aggressive payable stretch can damage suppliers.</td>\n          <td>Break change into inventory, receivables and payables rather than comment on total only.</td>\n          <td>Explain which component caused the movement.</td>\n        </tr>\n        <tr>\n          <td><b>Gearing</b></td>\n          <td class=\"formula-text\">Debt / Equity × 100 (source convention)</td>\n          <td>Long-term financing မှာ debt reliance / financial risk ကိုတိုင်းတယ်။</td>\n          <td class=\"good\">Lower generally means lower financial risk and more borrowing capacity.</td>\n          <td class=\"bad\">Higher means higher financial risk, interest burden and possible future borrowing constraint.</td>\n          <td>Source notes say no absolute limit and flag &gt;50% as high geared under their convention. Acceptability depends on industry, cash-flow stability and debt terms.</td>\n          <td>Pair with Interest Cover, ROE and cash flow. Debt may boost ROE but worsen risk.</td>\n          <td>High gearing + low interest cover = stronger risk signal than gearing alone.</td>\n        </tr>\n        <tr>\n          <td><b>Interest Cover</b></td>\n          <td class=\"formula-text\">PBIT / Finance Cost</td>\n          <td>Operating profit က interest expense ကိုဘယ်နှကြိမ် cover လုပ်နိုင်သလဲ။</td>\n          <td class=\"good\">↑ gives larger safety margin.</td>\n          <td class=\"bad\">↓ means higher financing stress. Source notes mark &gt;3 times as acceptable and 2 times or less as low in their teaching benchmark.</td>\n          <td>Cyclical/volatile earnings mean even apparently adequate cover may be risky. Non-cash finance charges or one-offs can distort.</td>\n          <td>Gearing ↑ usually increases finance cost and may reduce interest cover.</td>\n          <td>Do not use a benchmark mechanically; mention trend and earnings stability.</td>\n        </tr>\n        <tr>\n          <td><b>Dividend Yield</b></td>\n          <td class=\"formula-text\">Dividend per Share / Market Price per Share × 100</td>\n          <td>Current share price ပေါ် cash dividend return.</td>\n          <td class=\"good\">Higher yield can attract income investors.</td>\n          <td class=\"bad\">Low yield may mean lower current income.</td>\n          <td>Very high yield can be caused by falling share price and market concern, not strong performance. Low yield may coexist with high capital growth.</td>\n          <td>Compare Dividend Cover and P/E.</td>\n          <td>Yield = income return, not total shareholder return.</td>\n        </tr>\n        <tr>\n          <td><b>Dividend Cover</b></td>\n          <td class=\"formula-text\">EPS / Dividend per Share</td>\n          <td>Earnings က dividend ကိုဘယ်နှကြိမ် cover လုပ်သလဲ; retained profit buffer ကိုပြတယ်။</td>\n          <td class=\"good\">Higher cover = more retained earnings / stronger dividend sustainability buffer.</td>\n          <td class=\"bad\">Low cover = more earnings distributed, less retained for growth; 1x means virtually all distributable earnings paid.</td>\n          <td>Too high cover may disappoint income investors if company retains cash without productive reinvestment.</td>\n          <td>Pair with growth strategy, ROE and cash requirements.</td>\n          <td>Explain trade-off between shareholder distribution and retained financing.</td>\n        </tr>\n        <tr>\n          <td><b>P/E Ratio</b></td>\n          <td class=\"formula-text\">Market Price per Share / EPS</td>\n          <td>Market confidence / market rating — investors earnings တစ်ယူနစ်အတွက်ဘယ်လောက်ပေးချင်သလဲ။</td>\n          <td class=\"good\">Higher often indicates higher growth/confidence expectations.</td>\n          <td class=\"bad\">Lower can indicate lower confidence / lower growth expectations.</td>\n          <td>High P/E can also mean overvaluation; low P/E may reflect undervaluation or mature stable business. Source notes frame high as high confidence and low as low confidence.</td>\n          <td>Compare with EPS trend, dividend policy and sector P/E.</td>\n          <td>Use &#x27;may indicate&#x27; rather than treating P/E as a guaranteed quality score.</td>\n        </tr></tbody>\n      </table>\n      <div class=\"interpret-box\">\n        <b>ACCA Interpretation Formula</b><br>\n        1. State the movement → 2. Quantify it → 3. Use scenario evidence for the cause →\n        4. Explain the business implication → 5. Link another ratio → 6. Give a balanced conclusion.\n      </div>\n    </div>\n    "}, {"text": "Deep Master Sheet", "kind": "sheet", "children": [], "html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 21 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>Performance analysis chapter — compute ratios consistently and interpret using scenario evidence, not numbers alone.</td>\n   <td>N/A — analytical calculations from financial statements.</td>\n   <td>Compare periods/entities after checking accounting policies, one-off events, asset age, acquisitions, lease/purchase and industry differences.</td>\n   <td>No journal entry.</td>\n   <td><div class='formula-box'><b>ROCE</b><div class='fstack'>PBIT / Capital Employed × 100</div></div><div class='formula-box'><b>Operating (net) profit margin</b><div class='fstack'>PBIT / Revenue × 100</div></div><div class='formula-box'><b>Gross profit margin</b><div class='fstack'>Gross Profit / Revenue × 100</div></div><div class='formula-box'><b>Asset turnover</b><div class='fstack'>Revenue / Capital Employed</div></div><div class='formula-box'><b>ROE</b><div class='fstack'>Profit attributable to ordinary shareholders / Ordinary shareholders&#x27; equity × 100</div></div><div class='formula-box'><b>Current ratio</b><div class='fstack'>Current Assets / Current Liabilities</div></div><div class='formula-box'><b>Quick ratio</b><div class='fstack'>(Current Assets − Inventory) / Current Liabilities</div></div><div class='formula-box'><b>Inventory holding period</b><div class='fstack'>Inventory / Cost of Sales × 365 days</div></div><div class='formula-box'><b>Inventory turnover</b><div class='fstack'>Cost of Sales / Inventory</div></div><div class='formula-box'><b>Receivable collection period</b><div class='fstack'>Trade Receivables / Credit Revenue × 365 days</div></div><div class='formula-box'><b>Payable payment period</b><div class='fstack'>Trade Payables / Credit Purchases (or COS proxy if necessary) × 365 days</div></div><div class='formula-box'><b>Working capital cycle</b><div class='fstack'>Inventory days + Receivable days − Payable days</div></div><div class='formula-box'><b>Gearing (source convention)</b><div class='fstack'>Debt / Equity × 100</div></div><div class='formula-box'><b>Interest cover</b><div class='fstack'>PBIT / Finance Cost</div></div><div class='formula-box'><b>Dividend yield</b><div class='fstack'>Dividend per Share / Market Price per Share × 100</div></div><div class='formula-box'><b>Dividend cover</b><div class='fstack'>EPS / Dividend per Share</div></div><div class='formula-box'><b>P/E ratio</b><div class='fstack'>Market Price per Share / EPS</div></div></td>\n   <td>Ratios derive from SOPL, SOFP, market data and notes; interpretation links profitability, efficiency, liquidity, solvency and investor returns.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Question requirement: calculate, compare, explain, recommend?</li><li><b>Step 2:</b> Ratios recalc consistently across periods/entities.</li><li><b>Step 3:</b> Each material movement identify.</li><li><b>Step 4:</b> Cause only scenario evidence နဲ့ချိတ်; pure guess မလုပ်.</li><li><b>Step 5:</b> Cross-link ratios: e.g. margin ↓ + inventory days ↑ may indicate discounting/obsolete stock/price pressure depending facts.</li><li><b>Step 6:</b> Accounting/structural distortions consider.</li><li><b>Step 7:</b> Overall conclusion balanced.</li></ol></td>\n   <td><div class='mini-example'><b>ROCE bridge</b><br>Operating margin 20% × Asset turnover 2.0 times = ROCE 40%. ROCE change ဘာကြောင့်လဲဆိုတာ margin side vs asset efficiency side ခွဲနိုင်တယ်။</div><div class='mini-example'><b>Gross margin fall</b><br>GP margin 30%→24%. Scenario မှာ purchase prices ↑ while selling prices fixed ဆို cost pressure likely. Inventory write-down ရှိရင်လည်း COS တက်ပြီး margin ကျနိုင်တယ်.</div><div class='mini-example'><b>Liquidity conflict</b><br>Current ratio 2.0 looks strong but quick ratio 0.6 + inventory days sharply rising → liquidity &#x27;strong&#x27; လို့တစ်ချက်တည်းမ conclude; current assets inventory ထဲပိတ်နေနိုင်တယ်.</div><div class='mini-example'><b>Receivable days rise</b><br>40→70 days and revenue ↑. Could be relaxed credit terms boosting sales, but cash conversion worsens and bad-debt risk may rise; receivable ageing evidence check.</div></td>\n   <td><ul><li>Ratio တက်/ကျတစ်ကြောင်းတည်းရေးခြင်း</li><li>Profitability = margin 2 ခုတည်းလို့ယူခြင်း</li><li>Industry/accounting policy differences မထည့်ခြင်း</li><li>Average balances available while closing balances blindly use</li><li>Correlation ကို causation အဖြစ်ရေးခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Profitability / return</b></td><td>ROCE, Operating/Net Profit Margin, Gross Profit Margin, ROE. Profit margin × Asset turnover relationship ကိုနားလည်ပါ.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Asset efficiency</b></td><td>Asset Turnover = Revenue / Capital Employed.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Liquidity</b></td><td>Current Ratio, Quick Ratio.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Working capital efficiency</b></td><td>Inventory days/turnover, Receivable days, Payable days, Cash/working-capital cycle.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Long-term solvency</b></td><td>Gearing, Interest Cover.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Investor ratios</b></td><td>Dividend Yield, Dividend Cover, P/E; EPS from IAS 33.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Interpretation method</b></td><td>Movement → Cause → Business implication → Link to another ratio → Balanced conclusion.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Comparability limits</b></td><td>Accounting policies, asset age, lease vs purchase, timing of acquisitions, revaluation model, industry mix, one-off events.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Section C analysis အတွက် &#x27;what changed → why → implication → link&#x27; format သုံးပါ။ Ratio number ထက် explanation quality အရေးကြီးတယ်။</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "ဒီ chapter မှာ ratio တွက်တာထက် interpretation marks ပိုလွယ်လွယ်ဆုံးရှုံးတတ်တယ်။ Profitability ratios နှစ်ခုတည်းမဟုတ်ပါ။ Source notes မှာ ROCE, operating/net profit margin, asset turnover, gross profit margin, ROE အပြင် liquidity, efficiency, gearing, interest cover, investor ratios အထိပါရှိတယ်။", "kind": "overview", "children": [], "html": null}], "html": null}, {"text": "Rules / Criteria / Measurement", "kind": "group", "children": [{"text": "Criteria / Recognition", "kind": "topic", "children": [{"text": "Performance analysis chapter — compute ratios consistently and interpret using scenario evidence, not numbers alone.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Initial Measurement", "kind": "topic", "children": [{"text": "N/A — analytical calculations from financial statements.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Subsequent Measurement", "kind": "topic", "children": [{"text": "Compare periods/entities after checking accounting policies, one-off events, asset age, acquisitions, lease/purchase and industry differences.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Accounting / Journal Treatment", "kind": "topic", "children": [{"text": "No journal entry.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Financial Statement Impact", "kind": "topic", "children": [{"text": "Ratios derive from SOPL, SOFP, market data and notes; interpretation links profitability, efficiency, liquidity, solvency and investor returns.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Topic Details", "kind": "group", "children": [{"text": "Profitability / return", "kind": "topic", "children": [{"text": "ROCE, Operating/Net Profit Margin, Gross Profit Margin, ROE. Profit margin × Asset turnover relationship ကိုနားလည်ပါ.", "kind": "detail", "children":
