": null}], "html": null}, {"text": "Asset turnover", "kind": "formula", "children": [{"text": "Revenue / Capital Employed", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "ROE", "kind": "formula", "children": [{"text": "Profit attributable to ordinary shareholders / Ordinary shareholders' equity × 100", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Current ratio", "kind": "formula", "children": [{"text": "Current Assets / Current Liabilities", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Quick ratio", "kind": "formula", "children": [{"text": "(Current Assets − Inventory) / Current Liabilities", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Inventory holding period", "kind": "formula", "children": [{"text": "Inventory / Cost of Sales × 365 days", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Inventory turnover", "kind": "formula", "children": [{"text": "Cost of Sales / Inventory", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Receivable collection period", "kind": "formula", "children": [{"text": "Trade Receivables / Credit Revenue × 365 days", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Payable payment period", "kind": "formula", "children": [{"text": "Trade Payables / Credit Purchases (or COS proxy if necessary) × 365 days", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Working capital cycle", "kind": "formula", "children": [{"text": "Inventory days + Receivable days − Payable days", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Gearing (source convention)", "kind": "formula", "children": [{"text": "Debt / Equity × 100", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Interest cover", "kind": "formula", "children": [{"text": "PBIT / Finance Cost", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Dividend yield", "kind": "formula", "children": [{"text": "Dividend per Share / Market Price per Share × 100", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Dividend cover", "kind": "formula", "children": [{"text": "EPS / Dividend per Share", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "P/E ratio", "kind": "formula", "children": [{"text": "Market Price per Share / EPS", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Exam Thinking Process", "kind": "group", "children": [{"text": "Step 1 — Question requirement: calculate, compare, explain, recommend?", "kind": "step", "children": [], "html": null}, {"text": "Step 2 — Ratios recalc consistently across periods/entities.", "kind": "step", "children": [], "html": null}, {"text": "Step 3 — Each material movement identify.", "kind": "step", "children": [], "html": null}, {"text": "Step 4 — Cause only scenario evidence နဲ့ချိတ်; pure guess မလုပ်.", "kind": "step", "children": [], "html": null}, {"text": "Step 5 — Cross-link ratios: e.g. margin ↓ + inventory days ↑ may indicate discounting/obsolete stock/price pressure depending facts.", "kind": "step", "children": [], "html": null}, {"text": "Step 6 — Accounting/structural distortions consider.", "kind": "step", "children": [], "html": null}, {"text": "Step 7 — Overall conclusion balanced.", "kind": "step", "children": [], "html": null}], "html": null}, {"text": "Examples / Application", "kind": "group", "children": [{"text": "ROCE bridge", "kind": "example", "children": [{"text": "Operating margin 20% × Asset turnover 2.0 times = ROCE 40%. ROCE change ဘာကြောင့်လဲဆိုတာ margin side vs asset efficiency side ခွဲနိုင်တယ်။", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Gross margin fall", "kind": "example", "children": [{"text": "GP margin 30%→24%. Scenario မှာ purchase prices ↑ while selling prices fixed ဆို cost pressure likely. Inventory write-down ရှိရင်လည်း COS တက်ပြီး margin ကျနိုင်တယ်.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Liquidity conflict", "kind": "example", "children": [{"text": "Current ratio 2.0 looks strong but quick ratio 0.6 + inventory days sharply rising → liquidity 'strong' လို့တစ်ချက်တည်းမ conclude; current assets inventory ထဲပိတ်နေနိုင်တယ်.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Receivable days rise", "kind": "example", "children": [{"text": "40→70 days and revenue ↑. Could be relaxed credit terms boosting sales, but cash conversion worsens and bad-debt risk may rise; receivable ageing evidence check.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Common Mistakes / Exam Traps", "kind": "group", "children": [{"text": "Ratio တက်/ကျတစ်ကြောင်းတည်းရေးခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Profitability = margin 2 ခုတည်းလို့ယူခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Industry/accounting policy differences မထည့်ခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Average balances available while closing balances blindly use", "kind": "trap", "children": [], "html": null}, {"text": "Correlation ကို causation အဖြစ်ရေးခြင်း", "kind": "trap", "children": [], "html": null}], "html": null}, {"text": "Exam Focus", "kind": "group", "children": [{"text": "Section C analysis အတွက် 'what changed → why → implication → link' format သုံးပါ။ Ratio number ထက် explanation quality အရေးကြီးတယ်။", "kind": "exam", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Chapter 22: IAS 7 – Statement of Cash Flows", "kind": "chapter", "children": [{"text": "Deep Excel-style Study Sheets", "kind": "group", "children": [{"text": "Deep Master Sheet", "kind": "sheet", "children": [], "html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 22 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 7: classify cash flows into Operating, Investing and Financing activities; reconcile opening to closing cash and cash equivalents.</td>\n   <td>N/A — statement preparation standard. Start from cash movements or reconcile accrual profit to operating cash flow.</td>\n   <td>Use direct or indirect operating method as required/used. Adjust non-cash items, working capital changes and actual cash payments.</td>\n   <td>No additional journal entry solely for SOCF; derive from ledger balances, notes and non-cash reconciliations.</td>\n   <td><div class='formula-box'><b>Indirect CFO core</b><div class='fstack'>Operating profit or PBT + non-cash charges − non-operating gains + non-operating losses ± working-capital changes − taxes/interest as classification requires</div></div><div class='formula-box'><b>Cash from customers (simple)</b><div class='fstack'>Revenue + Opening receivables − Closing receivables (adjust for other items/taxes if relevant)</div></div><div class='formula-box'><b>Cash paid to suppliers (simple)</b><div class='fstack'>Purchases + Opening payables − Closing payables</div></div><div class='formula-box'><b>Purchases from inventory data</b><div class='fstack'>COS + Closing inventory − Opening inventory</div></div></td>\n   <td>SOCF presents Operating, Investing, Financing cash flows and the net movement in cash/cash equivalents.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Start point identify (PBT or operating profit).</li><li><b>Step 2:</b> Non-cash items add back; gains/losses on disposals remove from operating reconciliation.</li><li><b>Step 3:</b> Working capital signs separately handle.</li><li><b>Step 4:</b> Investing/financing cash items extract from notes/T-accounts.</li><li><b>Step 5:</b> Opening cash + net movement = closing cash sanity check.</li></ol></td>\n   <td><div class='mini-example'><b>Working capital</b><br>Inventory rises 20, receivables fall 10, payables rise 15 → CFO adjustment = −20 +10 +15 = +5.</div><div class='mini-example'><b>PPE purchase derivation</b><br>Opening PPE CA 500 + purchases X + revaluation 40 − depreciation 60 − CA disposed 30 = closing 570 → X = 120.</div></td>\n   <td><ul><li>Depreciation cash outflow လို့ယူခြင်း</li><li>Disposal profit ကို investing inflow အဖြစ်သုံးခြင်း instead of actual proceeds</li><li>Inventory increase sign မှားခြင်း</li><li>Bonus issue ကို financing cash inflow လို့ထည့်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Operating</b></td><td>Principal revenue-producing activities; indirect method starts from profit measure then removes non-cash/non-operating effects and adjusts working capital.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Investing</b></td><td>Purchase/sale of long-term assets and investments, relevant interest/dividend classification per policy/requirements.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Financing</b></td><td>Changes in equity and borrowings; share issues, loans, principal lease payments etc.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Non-cash transactions</b></td><td>Cash flow statement ထဲမထည့်; disclose elsewhere where required.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Working capital signs</b></td><td>Inventory/receivable increase = cash out/absorption; payable increase = cash source.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Asset T-account</b></td><td>PPE/intangible movements can derive cash purchases/disposal proceeds.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Indirect method + working-capital signs ကို speed drill လုပ်ပါ။</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "Cash flow ကို Operating / Investing / Financing သုံးပိုင်းခွဲပြီး indirect method operating cash flow reconciliation ကို အလွတ်မကျက်ဘဲ logic နဲ့လုပ်ရမယ်။", "kind": "overview", "children": [], "html": null}], "html": null}, {"text": "Rules / Criteria / Measurement", "kind": "group", "children": [{"text": "Criteria / Recognition", "kind": "topic", "children": [{"text": "IAS 7: classify cash flows into Operating, Investing and Financing activities; reconcile opening to closing cash and cash equivalents.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Initial Measurement", "kind": "topic", "children": [{"text": "N/A — statement preparation standard. Start from cash movements or reconcile accrual profit to operating cash flow.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Subsequent Measurement", "kind": "topic", "children": [{"text": "Use direct or indirect operating method as required/used. Adjust non-cash items, working capital changes and actual cash payments.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Accounting / Journal Treatment", "kind": "topic", "children": [{"text": "No additional journal entry solely for SOCF; derive from ledger balances, notes and non-cash reconciliations.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Financial Statement Impact", "kind": "topic", "children": [{"text": "SOCF presents Operating, Investing, Financing cash flows and the net movement in cash/cash equivalents.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Topic Details", "kind": "group", "children": [{"text": "Operating", "kind": "topic", "children": [{"text": "Principal revenue-producing activities; indirect method starts from profit measure then removes non-cash/non-operating effects and adjusts working capital.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Investing", "kind": "topic", "children": [{"text": "Purchase/sale of long-term assets and investments, relevant interest/dividend classification per policy/requirements.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Financing", "kind": "topic", "children": [{"text": "Changes in equity and borrowings; share issues, loans, principal lease payments etc.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Non-cash transactions", "kind": "topic", "children": [{"text": "Cash flow statement ထဲမထည့်; disclose elsewhere where required.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Working capital signs", "kind": "topic", "children": [{"text": "Inventory/receivable increase = cash out/absorption; payable increase = cash source.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Asset T-account", "kind": "topic", "children": [{"text": "PPE/intangible movements can derive cash purchases/disposal proceeds.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Formula / Working Map", "kind": "group", "children": [{"text": "Indirect CFO core", "kind": "formula", "children": [{"text": "Operating profit or PBT + non-cash charges − non-operating gains + non-operating losses ± working-capital changes − taxes/interest as classification requires", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Cash from customers (simple)", "kind": "formula", "children": [{"text": "Revenue + Opening receivables − Closing receivables (adjust for other items/taxes if relevant)", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Cash paid to suppliers (simple)", "kind": "formula", "children": [{"text": "Purchases + Opening payables − Closing payables", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Purchases from inventory data", "kind": "formula", "children": [{"text": "COS + Closing inventory − Opening inventory", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Exam Thinking Process", "kind": "group", "children": [{"text": "Step 1 — Start point identify (PBT or operating profit).", "kind": "step", "children": [], "html": null}, {"text": "Step 2 — Non-cash items add back; gains/losses on disposals remove from operating reconciliation.", "kind": "step", "children": [], "html": null}, {"text": "Step 3 — Working capital signs separately handle.", "kind": "step", "children": [], "html": null}, {"text": "Step 4 — Investing/financing cash items extract from notes/T-accounts.", "kind": "step", "children": [], "html": null}, {"text": "Step 5 — Opening cash + net movement = closing cash sanity check.", "kind": "step", "children": [], "html": null}], "html": null}, {"text": "Examples / Application", "kind": "group", "children": [{"text": "Working capital", "kind": "example", "children": [{"text": "Inventory rises 20, receivables fall 10, payables rise 15 → CFO adjustment = −20 +10 +15 = +5.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "PPE purchase derivation", "kind": "example", "children": [{"text": "Opening PPE CA 500 + purchases X + revaluation 40 − depreciation 60 − CA disposed 30 = closing 570 → X = 120.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Common Mistakes / Exam Traps", "kind": "group", "children": [{"text": "Depreciation cash outflow လို့ယူခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Disposal profit ကို investing inflow အဖြစ်သုံးခြင်း instead of actual proceeds", "kind": "trap", "children": [], "html": null}, {"text": "Inventory increase sign မှားခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Bonus issue ကို financing cash inflow လို့ထည့်ခြင်း", "kind": "trap", "children": [], "html": null}], "html": null}, {"text": "Exam Focus", "kind": "group", "children": [{"text": "Indirect method + working-capital signs ကို speed drill လုပ်ပါ။", "kind": "exam", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Chapter 23: Group Accounting I – Control, Goodwill, NCI & Consolidated SOFP", "kind": "chapter", "children": [{"text": "Deep Excel-style Study Sheets", "kind": "group", "children": [{"text": "Consolidated SOFP — Step-by-Step System", "kind": "sheet", "children": [], "html": "\n<div class=\"sheet-wrap wide-sheet\">\n  <div class=\"sheet-title\">Chapter 23 — Consolidated SOFP: Step-by-Step Thinking System</div>\n  <div class=\"sheet-note\"><b>Core principle:</b> Parent + Subsidiary ကို legal entities ၂ ခုမဟုတ်ဘဲ Single Economic Entity တစ်ခုလိုစဉ်းစား။ Control ရှိတဲ့ subsidiary ကို assets/liabilities 100% line-by-line consolidate လုပ်ပြီး NCI ကိုသီးခြားပြ။</div>\n  <table class=\"excel-sheet conso-table\">\n    <thead><tr><th>Step</th><th>What to do</th><th>Detailed thinking / Why</th><th>Working / Formula</th><th>Where it goes</th><th>Common trap</th></tr></thead>\n    <tbody>\n      <tr><td><b>0. Draw group structure</b></td><td>Parent %, NCI %, acquisition date, associate % ကိုပထမရေး။</td><td>Control / significant influence ကိုမသတ်မှတ်ဘဲ calculation စမလုပ်။ Subsidiary = line-by-line; Associate = equity method.</td><td>P% + NCI% = 100% for subsidiary ownership allocation.</td><td>Determines all later workings.</td><td>Ownership % ကို consolidation % နဲ့ရောခြင်း — subsidiary assets/liabilities 80% မဟုတ်ဘဲ 100% consolidate.</td></tr>\n      <tr><td><b>1. Separate pre- vs post-acquisition</b></td><td>Acquisition date ကို timeline ထားပြီး reserves ကို split.</td><td>Pre-acquisition reserves = net assets acquired; Post-acquisition reserves = group earned after control and feed NCI/CRE.</td><td>Post-acq RE = Reporting RE − Acquisition-date RE ± post-acq adjustments.</td><td>W2, W4, W5.</td><td>Whole subsidiary retained earnings ကို group RE ထဲထည့်ခြင်း.</td></tr>\n      <tr><td><b>2. W2 Net Assets of Subsidiary</b></td><td>Acquisition / Reporting / Post-acq columns.</td><td>Share capital, share premium, RE, FV adjustments. Extra depreciation and upstream URP affect post-acquisition column as supported by notes.</td><td>Post-acq net assets C = Reporting net assets B − Acquisition net assets A, adjusted for post-acq items.</td><td>W3 Goodwill, W4 NCI, W5 CRE.</td><td>Upstream URP location and FV extra depreciation omitted.</td></tr>\n      <tr><td><b>3. Consideration</b></td><td>Cash, shares, deferred, contingent consideration identify.</td><td>Deferred consideration uses present value at acquisition; contingent consideration is measured at fair value at acquisition under source notes.</td><td>Consideration = Cash + Share exchange + PV deferred consideration + FV contingent consideration.</td><td>Goodwill working.</td><td>Future interest on deferred consideration ထည့်ပြီး acquisition consideration ကို overstated လုပ်ခြင်း.</td></tr>\n      <tr><td><b>4. W3 Goodwill</b></td><td>Consideration + NCI − acquisition net assets.</td><td>Excess purchase price over identifiable net assets. Full vs proportionate NCI method affects goodwill amount and impairment allocation.</td><td>Goodwill at acq = Consideration transferred + NCI at acq − Net Assets at acq.<br>Goodwill at reporting = Goodwill at acq − Impairment.</td><td>Non-current asset in CSOFP.</td><td>Associate goodwill ကို separate calculate/show; source says it is embedded in associate investment.</td></tr>\n      <tr><td><b>5. W4 NCI</b></td><td>NCI at acquisition + share of post-acq reserves − applicable impairment share.</td><td>NCI represents outside shareholders' claim on subsidiary net assets after acquisition.</td><td>NCI reporting = NCI at acq + NCI% × Post-acq reserves − NCI share of goodwill impairment (when full FV method).</td><td>Equity section of CSOFP.</td><td>Partial goodwill method မှာ impairment ကို NCI ထဲနှုတ်ခြင်း.</td></tr>\n      <tr><td><b>6. W5 Consolidated Retained Earnings</b></td><td>Start Parent RE; add parent share of sub/associate post-acq; deduct group adjustments.</td><td>Group retains only parent owners' share of post-acquisition results, after impairment/URP/deferred consideration finance cost etc.</td><td>Parent RE + P%×Sub post-acq reserves + P%×Associate post-acq reserves − Parent share goodwill impairment − Associate impairment − relevant URP − deferred consideration finance cost.</td><td>Equity attributable to owners of parent.</td><td>Subsidiary pre-acquisition reserve, subsidiary dividend, or NCI share incorrectly included.</td></tr>\n      <tr><td><b>7. W6 Associate</b></td><td>Equity method.</td><td>Associate is not line-by-line consolidated. Investment grows by investor share of post-acquisition profit/reserves and falls for impairment/dividend/URP adjustments.</td><td>Investment in Associate = Cost + P share post-acq profit/(loss) − impairment − P share URP − dividends as applicable in source working.</td><td>Single non-current asset.</td><td>Associate revenue/assets line-by-line adding.</td></tr>\n      <tr><td><b>8. Intragroup balances</b></td><td>Receivable/payable, cash/GIT reconcile and eliminate.</td><td>Group cannot owe itself money. Timing differences such as GIT/CIT adjusted first, then eliminate reciprocal balance.</td><td>Conso receivable = P + S − intragroup balance; similar for payable.</td><td>Current assets/liabilities.</td><td>Only one side eliminate; GIT/CIT timing difference ignored.</td></tr>\n      <tr><td><b>9. Unrealised profit</b></td><td>Remove profit on goods still inside group.</td><td>Single entity has not earned profit until goods leave group. Direction matters because seller's profit determines whose RE/NCI is affected.</td><td>Markup on cost: URP = Unsold inventory at transfer price × markup/(100+markup).<br>Margin on selling price: URP = Unsold transfer price × margin%.</td><td>Reduce inventory + seller-side profit/RE.</td><td>Markup vs margin formula confusion; downstream vs upstream effect on NCI ignored.</td></tr>\n      <tr><td><b>10. Fair value adjustments</b></td><td>Acquisition-date FV adjustments + post-acq extra dep/amortisation.</td><td>Net assets acquired must reflect acquisition-date FV; later depreciation/amortisation changes post-acq reserves.</td><td>Extra dep = FV uplift / remaining useful life (simple straight-line case).</td><td>PPE/intangible + W2/W4/W5.</td><td>FV uplift added but post-acquisition extra depreciation forgotten.</td></tr>\n      <tr><td><b>11. Build CSOFP</b></td><td>Line-by-line P + S for assets/liabilities; apply group adjustments.</td><td>Source format: PPE P+S±FV; Inventory P+S+GIT−URP; Receivables P+S−intragroup; only Parent share capital/premium; CRE W5; NCI W4.</td><td>Total Assets must equal Total Equity & Liabilities.</td><td>Final CSOFP.</td><td>Parent investment in subsidiary left in consolidated assets; subsidiary share capital included.</td></tr>\n    </tbody>\n  </table>\n</div>\n"}, {"text": "Deep Master Sheet", "kind": "sheet", "children": [], "html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 23 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IFRS 10/IFRS 3: first establish control, acquisition date, ownership percentage and fair value of identifiable net assets.</td>\n   <td>At acquisition: measure consideration, identifiable net assets at fair value, NCI and goodwill.</td>\n   <td>Consolidate line-by-line; update NCI, group retained earnings, post-acquisition reserves; eliminate intragroup items and unrealised profit.</td>\n   <td>Consolidation workings/eliminations rather than parent ledger entries: cancel investment against subsidiary equity; eliminate intragroup balances/sales; record FV adjustments and goodwill impairment.</td>\n   <td><div class='formula-box'><b>Goodwill – full NCI</b><div class='fstack'>Consideration + FV of NCI − FV of identifiable net assets at acquisition</div></div><div class='formula-box'><b>Goodwill – proportionate NCI</b><div class='fstack'>Consideration − Parent % × FV net assets at acquisition</div></div><div class='formula-box'><b>NCI at reporting date</b><div class='fstack'>NCI at acquisition + NCI % × post-acquisition adjusted reserves − NCI share of full-goodwill impairment</div></div><div class='formula-box'><b>Group RE</b><div class='fstack'>Parent RE + Parent % × Sub post-acquisition adjusted reserves − parent-side group adjustments</div></div><div class='formula-box'><b>URP on markup</b><div class='fstack'>Unsold inventory at transfer price × markup/(100+markup) when markup is on cost</div></div><div class='formula-box'><b>URP on margin</b><div class='fstack'>Unsold inventory at transfer price × profit margin % when margin is on selling price</div></div></td>\n   <td>Consolidated SOFP shows group assets/liabilities, goodwill and NCI; parent investment in subsidiary is eliminated.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Group diagram and percentages.</li><li><b>Step 2:</b> Acquisition date / reporting date timeline.</li><li><b>Step 3:</b> W1 consideration.</li><li><b>Step 4:</b> W2 net assets pre/post.</li><li><b>Step 5:</b> W3 goodwill.</li><li><b>Step 6:</b> W4 NCI.</li><li><b>Step 7:</b> W5 group RE.</li><li><b>Step 8:</b> Adjust URP, intragroup balances, FV depreciation, impairment.</li><li><b>Step 9:</b> Build CSOFP line-by-line; investment in subsidiary cancelled.</li></ol></td>\n   <td><div class='mini-example'><b>Goodwill</b><br>P buys 80% S for 900; FV NCI 210; FV net assets 1,000 → goodwill = 110.</div><div class='mini-example'><b>Proportionate NCI</b><br>Same net assets 1,000, consideration 900, parent 80% → goodwill = 900 − 800 = 100.</div><div class='mini-example'><b>Inventory URP</b><br>P sells to S for 150 at 25% markup on cost; one-third remains. Unsold transfer price 50; profit fraction 25/125 → URP 10. Reduce group inventory 10 and seller-side retained earnings/profit.</div></td>\n   <td><ul><li>Investment in subsidiary ကို CSOFP ထဲဆက်ထားခြင်း</li><li>Pre-acquisition reserve ကို group RE ထဲထည့်ခြင်း</li><li>Markup vs margin formula ရောခြင်း</li><li>Full-goodwill impairment ကို parent only ခံခြင်း</li><li>FV adjustment extra depreciation မလုပ်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Control</b></td><td>Power over relevant activities + exposure/rights to variable returns + ability to use power to affect returns. Voting % is evidence, not sole test.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Subsidiary vs associate vs investment</b></td><td>Control → subsidiary; significant influence commonly 20–50% indicator → associate; otherwise financial asset subject to facts.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Consideration</b></td><td>Cash, shares, deferred consideration, contingent consideration measured appropriately at acquisition.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Net assets at acquisition</b></td><td>Share capital + pre-acquisition reserves + fair value adjustments + recognised identifiable intangibles/liabilities.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Goodwill</b></td><td>Consideration + NCI at acquisition − fair value of identifiable net assets acquired.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>NCI</b></td><td>Full fair value method or proportionate method depending policy/election as applicable.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Group retained earnings</b></td><td>Parent RE + parent&#x27;s share of post-acquisition subsidiary reserves ± group adjustments.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Intragroup balances</b></td><td>Receivable/payable, cash/GIT, loans, dividends eliminated.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>URP inventory/PPE</b></td><td>Remove unrealised group profit and adjust inventory/PPE/depreciation.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Fair value adjustments</b></td><td>Extra depreciation/amortisation after acquisition flows into post-acquisition results.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Working labels fixed ထားပါ: Goodwill, Net Assets, NCI, Group RE. အစဉ်မပြောင်းရင် error tracing လွယ်တယ်။</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "Group question ကို structure-first ဖြေပါ။ Control determine → acquisition date → net assets → consideration → goodwill → NCI → group retained earnings → intragroup adjustments → CSOFP.", "kind": "overview", "children": [], "html": null}], "html": null}, {"text": "Rules / Criteria / Measurement", "kind": "group", "children": [{"text": "Criteria / Recognition", "kind": "topic", "children": [{"text": "IFRS 10/IFRS 3: first establish control, acquisition date, ownership percentage and fair value of identifiable net assets.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Initial Measurement", "kind": "topic", "children": [{"text": "At acquisition: measure consideration, identifiable net assets at fair value, NCI and goodwill.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Subsequent Measurement", "kind": "topic", "children": [{"text": "Consolidate line-by-line; update NCI, group retained earnings, post-acquisition reserves; eliminate intragroup items and unrealised profit.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Accounting / Journal Treatment", "kind": "topic", "children": [{"text": "Consolidation workings/eliminations rather than parent ledger entries: cancel investment against subsidiary equity; eliminate intragroup balances/sales; record FV adjustments and goodwill impairment.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Financial Statement Impact", "kind": "topic", "children": [{"text": "Consolidated SOFP shows group assets/liabilities, goodwill and NCI; parent investment in subsidiary is eliminated.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Topic Details", "kind": "group", "children": [{"text": "Control", "kind": "topic", "children": [{"text": "Power over relevant activities + exposure/rights to variable returns + ability to use power to affect returns. Voting % is evidence, not sole test.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Subsidiary vs associate vs investment", "kind": "topic", "children": [{"text": "Control → subsidiary; significant influence commonly 20–50% indicator → associate; otherwise financial asset subject to facts.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Consideration", "kind": "topic", "children": [{"text": "Cash, shares, deferred consideration, contingent consideration measured appropriately at acquisition.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Net assets at acquisition", "kind": "topic", "children": [{"text": "Share capital + pre-acquisition reserves + fair value adjustments + recognised identifiable intangibles/liabilities.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Goodwill", "kind": "topic", "children": [{"text": "Consideration + NCI at acquisition − fair value of identifiable net assets acquired.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "NCI", "kind": "topic", "children": [{"text": "Full fair value method or proportionate method depending policy/election as applicable.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Group retained earnings", "kind": "topic", "children": [{"text": "Parent RE + parent's share of post-acquisition subsidiary reserves ± group adjustments.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Intragroup balances", "kind": "topic", "children": [{"text": "Receivable/payable, cash/GIT, loans, dividends eliminated.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "URP inventory/PPE", "kind": "topic", "children": [{"text": "Remove unrealised group profit and adjust inventory/PPE/depreciation.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Fair value adjustments", "kind": "topic", "children": [{"text": "Extra depreciation/amortisation after acquisition flows into post-acquisition results.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Formula / Working Map", "kind": "group", "children": [{"text": "Goodwill – full NCI", "kind": "formula", "children": [{"text": "Consideration + FV of NCI − FV of identifiable net assets at acquisition", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Goodwill – proportionate NCI", "kind": "formula", "children": [{"text": "Consideration − Parent % × FV net assets at acquisition", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "NCI at reporting date", "kind": "formula", "children": [{"text": "NCI at acquisition + NCI % × post-acquisition adjusted reserves − NCI share of full-goodwill impairment", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Group RE", "kind": "formula", "children": [{"text": "Parent RE + Parent % × Sub post-acquisition adjusted reserves − parent-side group adjustments", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "URP on markup", "kind": "formula", "children": [{"text": "Unsold inventory at transfer price × markup/(100+markup) when markup is on cost", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "URP on margin", "kind": "formula", "children": [{"text": "Unsold inventory at transfer price × profit margin % when margin is on selling price", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Exam Thinking Process", "kind": "group", "children": [{"text": "Step 1 — Group diagram and percentages.", "kind": "step", "children": [], "html": null}, {"text": "Step 2 — Acquisition date / reporting date timeline.", "kind": "step", "children": [], "html": null}, {"text": "Step 3 — W1 consideration.", "kind": "step", "children": [], "html": null}, {"text": "Step 4 — W2 net assets pre/post.", "kind": "step", "children": [], "html": null}, {"text": "Step 5 — W3 goodwill.", "kind": "step", "children": [], "html": null}, {"text": "Step 6 — W4 NCI.", "kind": "step", "children": [], "html": null}, {"text": "Step 7 — W5 group RE.", "kind": "step", "children": [], "html": null}, {"text": "Step 8 — Adjust URP, intragroup balances, FV depreciation, impairment.", "kind": "step", "children": [], "html": null}, {"text": "Step 9 — Build CSOFP line-by-line; investment in subsidiary cancelled.", "kind": "step", "children": [], "html": null}], "html": null}, {"text": "Examples / Application", "kind": "group", "children": [{"text": "Goodwill", "kind": "example", "children": [{"text": "P buys 80% S for 900; FV NCI 210; FV net assets 1,000 → goodwill = 110.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Proportionate NCI", "kind": "example", "children": [{"text": "Same net assets 1,000, consideration 900, parent 80% → goodwill = 900 − 800 = 100.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Inventory URP", "kind": "example", "children": [{"text": "P sells to S for 150 at 25% markup on cost; one-third remains. Unsold transfer price 50; profit fraction 25/125 → URP 10. Reduce group inventory 10 and seller-side retained earnings/profit.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Common Mistakes / Exam Traps", "kind": "group", "children": [{"text": "Investment in subsidiary ကို CSOFP ထဲဆက်ထားခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Pre-acquisition reserve ကို group RE ထဲထည့်ခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Markup vs margin formula ရောခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Full-goodwill impairment ကို parent only ခံခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "FV adjustment extra depreciation မလုပ်ခြင်း", "kind": "trap", "children": [], "html": null}], "html": null}, {"text": "Exam Focus", "kind": "group", "children": [{"text": "Working labels fixed ထားပါ: Goodwill, Net Assets, NCI, Group RE. အစဉ်မပြောင်းရင် error tracing လွယ်တယ်။", "kind": "exam", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Chapter 24: Group Accounting II – Consolidated SPLOCI, Associates, Disposals & Related Parties", "kind": "chapter", "children": [{"text": "Deep Excel-style Study Sheets", "kind": "group", "children": [{"text": "Consolidated SPLOCI — Step-by-Step System", "kind": "sheet", "children": [], "html": "\n<div class=\"sheet-wrap wide-sheet\">\n  <div class=\"sheet-title\">Chapter 24 — Consolidated SPLOCI: Step-by-Step Thinking System</div>\n  <div class=\"sheet-note\"><b>Key difference from SOFP:</b> SOPL is a period statement. Consolidate subsidiary results only for the period control existed. Then allocate adjusted post-acquisition profit to Parent/NCI.</div>\n  <table class=\"excel-sheet conso-table\">\n    <thead><tr><th>Step</th><th>Action</th><th>Detailed reasoning</th><th>Adjustment map</th><th>NCI / Associate effect</th><th>Exam trap</th></tr></thead>\n    <tbody>\n      <tr><td><b>1. Timeline first</b></td><td>Identify acquisition/disposal dates and reporting date.</td><td>Mid-year acquisition: only post-acquisition months consolidated. Disposal: consolidate only until loss of control.</td><td>Post-acq fraction e.g. 9/12 or 5/12 if profits accrue evenly and question permits.</td><td>NCI gets share of same controlled-period subsidiary profit.</td><td>Whole-year subsidiary profit included after mid-year acquisition.</td></tr>\n      <tr><td><b>2. Add P + 100% of S post-acq lines</b></td><td>Revenue, COS, expenses line-by-line.</td><td>Because group controls all subsidiary resources/results during control period, show 100%; NCI is attribution at bottom, not line-by-line percentage reduction.</td><td>P line + S post-acq line.</td><td>NCI calculated after adjustments.</td><td>Only parent ownership % of subsidiary revenue included.</td></tr>\n      <tr><td><b>3. Intragroup sales</b></td><td>Eliminate internal revenue and matching COS.</td><td>Group cannot sell to itself. Internal transaction has no group revenue.</td><td>Revenue (−); Cost of Sales (−).</td><td>No profit effect from sales elimination alone, but URP may affect seller's profit and NCI depending direction.</td><td>Revenue eliminated but COS not eliminated.</td></tr>\n      <tr><td><b>4. URP on inventory</b></td><td>Remove profit in closing inventory.</td><td>Profit is unrealised until outside-group sale. Source notes: P→S affects COS and parent/group RE; S→P also reduces subsidiary post RE, affecting NCI.</td><td>Cost of Sales (+); Inventory (−). Seller-side post profit reduced.</td><td>Upstream S→P reduces subsidiary profit before NCI allocation.</td><td>Direction ignored.</td></tr>\n      <tr><td><b>5. Goodwill impairment</b></td><td>Recognise group impairment expense.</td><td>Full goodwill impairment is shared between parent and NCI; partial goodwill impairment belongs to parent only under source treatment.</td><td>Operating/Admin expense (+); Goodwill (−).</td><td>Full method: reduce NCI share; Partial method: no NCI share.</td><td>Same NCI treatment under both goodwill methods.</td></tr>\n      <tr><td><b>6. Fair value extra dep/amort</b></td><td>Adjust post-acq expense.</td><td>Acquisition FV uplift changes subsequent depreciation/amortisation. Source notes map increase to COS and lower subsidiary post RE.</td><td>PPE/intangible uplift → extra Dep/Amort expense (+).</td><td>Subsidiary post profit falls; therefore NCI share also falls.</td><td>Only CSOFP adjustment made, no SPLOCI effect.</td></tr>\n      <tr><td><b>7. Intragroup loan interest</b></td><td>Eliminate interest income and interest expense.</td><td>Group cannot earn interest from itself.</td><td>Income from investments (−); Interest expense (−).</td><td>No group profit effect if perfectly matched.</td><td>Loan principal eliminated but interest left in SOPL.</td></tr>\n      <tr><td><b>8. Deferred consideration finance cost</b></td><td>Unwind discount after acquisition.</td><td>Time passage increases deferred liability; this is post-acquisition finance cost, not part of initial goodwill after acquisition date.</td><td>Finance expense (+); deferred consideration liability (+).</td><td>Usually parent-side adjustment in group RE/source working.</td><td>Adding all later finance cost to acquisition-date goodwill.</td></tr>\n      <tr><td><b>9. Contingent consideration FV change</b></td><td>Remeasure as required by source case.</td><td>Source notes map FV changes to admin/operating expense or income depending increase/decrease.</td><td>Admin/operating expense ±; contingent liability ±.</td><td>Parent-side unless facts indicate otherwise.</td><td>Acquisition-date amount never remeasured.</td></tr>\n      <tr><td><b>10. Associate</b></td><td>Use one-line share of adjusted profit.</td><td>Associate is not controlled; equity accounting includes investor share rather than line-by-line amounts.</td><td>Share of associate profit = P% × adjusted associate post-tax profit, less relevant impairment/URP per working.</td><td>No NCI on associate.</td><td>Associate revenue/COS consolidated line-by-line or included in NCI.</td></tr>\n      <tr><td><b>11. NCI attribution</b></td><td>Calculate after all subsidiary post-acq adjustments.</td><td>NCI must share the subsidiary's adjusted controlled-period result, not raw reported profit.</td><td>NCI share = NCI% × adjusted subsidiary post-acq profit/TCI, adjusted for full-goodwill impairment where applicable.</td><td>Presented at bottom attribution.</td><td>NCI calculated before upstream URP / FV extra dep / impairment adjustments.</td></tr>\n      <tr><td><b>12. Disposal</b></td><td>Consolidate until disposal date; then show group disposal profit/loss.</td><td>At year-end after disposal, subsidiary no longer appears in CSOFP. Group disposal compares consideration with group carrying amount of net assets/goodwill after NCI effect, not simply parent investment cost.</td><td>Source working: Consideration received − [Net assets + Goodwill − NCI] = group disposal profit/loss (for full disposal structure shown).</td><td>Remove NCI at disposal.</td><td>Using Parent separate-FS disposal formula for consolidated disposal.</td></tr>\n    </tbody>\n  </table>\n</div>\n"}, {"text": "Deep Master Sheet", "kind": "sheet", "children": [], "html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 24 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>Group performance chapter — consolidate subsidiary post-acquisition results and apply equity method to associates; identify disposal/related-party effects where relevant.</td>\n   <td>Subsidiary: use acquisition-date fair values. Associate: initially at cost then equity method.</td>\n   <td>Time-apportion post-acquisition results; eliminate intragroup sales/interest/URP; adjust goodwill impairment and FV depreciation; update investment in associate.</td>\n   <td>Consolidation adjustments: eliminate intragroup income/expense; adjust URP; recognize share of associate profit; compute disposal gain/loss on loss of control.</td>\n   <td><div class='formula-box'><b>NCI share of post profit</b><div class='fstack'>Adjusted Sub post-acquisition profit × NCI %</div></div><div class='formula-box'><b>Share of associate profit</b><div class='fstack'>Associate adjusted post-tax profit × Parent %</div></div><div class='formula-box'><b>Investment in associate</b><div class='fstack'>Cost + Parent % × post-acquisition reserves − impairment − applicable URP</div></div><div class='formula-box'><b>Group disposal gain/loss</b><div class='fstack'>Consideration + FV retained interest + carrying amount of NCI − carrying amount of subsidiary net assets incl. goodwill (structure depends on question data)</div></div></td>\n   <td>Consolidated SOPL/OCI includes subsidiary post-acquisition results line-by-line; associate appears as single-line share of profit/investment.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Acquisition/disposal timeline first.</li><li><b>Step 2:</b> Subsidiary post-period results time-apportion.</li><li><b>Step 3:</b> Eliminate intragroup sales/interest/dividends.</li><li><b>Step 4:</b> Adjust URP, FV dep/amort, goodwill impairment.</li><li><b>Step 5:</b> Compute NCI attribution.</li><li><b>Step 6:</b> Associate single-line share, not line-by-line.</li><li><b>Step 7:</b> Disposal: distinguish parent&#x27;s individual FS profit from consolidated disposal profit.</li><li><b>Step 8:</b> Related-party disclosure only after relationship test.</li></ol></td>\n   <td><div class='mini-example'><b>Mid-year acquisition</b><br>Acquire 1 Apr, year end 31 Dec → normally 9/12 subsidiary annual results consolidated if profits accrue evenly and no better data.</div><div class='mini-example'><b>Associate</b><br>30% associate profit 200, impairment 10, downstream URP parent&#x27;s relevant share 6 → share of associate profit starts 60 then adjust relevant items as question requires.</div><div class='mini-example'><b>NCI</b><br>Adjusted sub post profit 500, NCI 20% → NCI share 100 before OCI/other specific adjustments.</div></td>\n   <td><ul><li>Associate revenue/assets line-by-line addခြင်း</li><li>Associate ကို NCI working ထဲထည့်ခြင်း</li><li>Subsidiary whole-year profit consolidate when acquired midyear</li><li>Intragroup sale eliminate but URP မadjust</li><li>Individual disposal profit = consolidated disposal profit လို့ယူခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Post-acquisition time apportionment</b></td><td>Subsidiary results only from control date to reporting date.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Intragroup sales</b></td><td>Revenue and cost of sales eliminate.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Inventory URP</b></td><td>COS/inventory and seller&#x27;s post-acquisition results adjusted depending direction.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Goodwill impairment</b></td><td>Expense in group SOPL; allocation between parent/NCI depends on full vs partial goodwill.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Fair value extra dep/amort</b></td><td>Acquisition FV uplift causes extra depreciation/amortisation, reducing post-acquisition profit.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Intragroup interest</b></td><td>Interest income/expense eliminate.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Associate equity method</b></td><td>Share of post-acquisition profit shown single line; investment carrying amount = cost + share post-acq reserves − impairment − relevant URP.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Associate URP</b></td><td>Recognise only investor&#x27;s share of unrealised profit adjustment.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>NCI attribution</b></td><td>Adjusted subsidiary post-acquisition profit/TCI × NCI %. Associate does not enter NCI.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Disposal of subsidiary</b></td><td>At loss of control, derecognise assets/liabilities/NCI/goodwill and recognise consideration + retained interest FV, compute group disposal gain/loss.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Related parties</b></td><td>Parent/subsidiary/associate/key management and close family/controlled entities disclosures focus on relationship, transactions, balances where required.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Section C group question မှာ workings ကို visible labels နဲ့လုပ်ပြီး line-by-line mapping ထားပါ။</div>\n</div>\n"}], "html": null}, {"text": "Chapter Overview", "kind": "group", "children": [{"text": "Group income statement မှာ subsidiary ကို acquisition date နောက်ပိုင်း results သာ line-by-line consolidate; associate ကို single-line equity method. Intragroup sales, URP, goodwill impairment, FV extra depreciation, loans/interest, dividends, disposal effects ကို adjust လုပ်ရတယ်။", "kind": "overview", "children": [], "html": null}], "html": null}, {"text": "Rules / Criteria / Measurement", "kind": "group", "children": [{"text": "Criteria / Recognition", "kind": "topic", "children": [{"text": "Group performance chapter — consolidate subsidiary post-acquisition results and apply equity method to associates; identify disposal/related-party effects where relevant.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Initial Measurement", "kind": "topic", "children": [{"text": "Subs t", "kind": "topic", "children": [{"text": "Acquisition FV uplift causes extra depreciation/amortisation, reducing post-acquisition profit.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Intragroup interest", "kind": "topic", "children": [{"text": "Interest income/expense eliminate.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Associate equity method", "kind": "topic", "children": [{"text": "Share of post-acquisition profit shown single line; investment carrying amount = cost + share post-acq reserves − impairment − relevant URP.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Associate URP", "kind": "topic", "children": [{"text": "Recognise only investor's share of unrealised profit adjustment.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "NCI attribution", "kind": "topic", "children": [{"text": "Adjusted subsidiary post-acquisition profit/TCI × NCI %. Associate does not enter NCI.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Disposal of subsidiary", "kind": "topic", "children": [{"text": "At loss of control, derecognise assets/liabilities/NCI/goodwill and recognise consideration + retained interest FV, compute group disposal gain/loss.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Related parties", "kind": "topic", "children": [{"text": "Parent/subsidiary/associate/key management and close family/controlled entities disclosures focus on relationship, transactions, balances where required.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Formula / Working Map", "kind": "group", "children": [{"text": "NCI share of post profit", "kind": "formula", "children": [{"text": "Adjusted Sub post-acquisition profit × NCI %", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Share of associate profit", "kind": "formula", "children": [{"text": "Associate adjusted post-tax profit × Parent %", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Investment in associate", "kind": "formula", "children": [{"text": "Cost + Parent % × post-acquisition reserves − impairment − applicable URP", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Group disposal gain/loss", "kind": "formula", "children": [{"text": "Consideration + FV retained interest + carrying amount of NCI − carrying amount of subsidiary net assets incl. goodwill (structure depends on question data)", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Exam Thinking Process", "kind": "group", "children": [{"text": "Step 1 — Acquisition/disposal timeline first.", "kind": "step", "children": [], "html": null}, {"text": "Step 2 — Subsidiary post-period results time-apportion.", "kind": "step", "children": [], "html": null}, {"text": "Step 3 — Eliminate intragroup sales/interest/dividends.", "kind": "step", "children": [], "html": null}, {"text": "Step 4 — Adjust URP, FV dep/amort, goodwill impairment.", "kind": "step", "children": [], "html": null}, {"text": "Step 5 — Compute NCI attribution.", "kind": "step", "children": [], "html": null}, {"text": "Step 6 — Associate single-line share, not line-by-line.", "kind": "step", "children": [], "html": null}, {"text": "Step 7 — Disposal: distinguish parent's individual FS profit from consolidated disposal profit.", "kind": "step", "children": [], "html": null}, {"text": "Step 8 — Related-party disclosure only after relationship test.", "kind": "step", "children": [], "html": null}], "html": null}, {"text": "Examples / Application", "kind": "group", "children": [{"text": "Mid-year acquisition", "kind": "example", "children": [{"text": "Acquire 1 Apr, year end 31 Dec → normally 9/12 subsidiary annual results consolidated if profits accrue evenly and no better data.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "Associate", "kind": "example", "children": [{"text": "30% associate profit 200, impairment 10, downstream URP parent's relevant share 6 → share of associate profit starts 60 then adjust relevant items as question requires.", "kind": "detail", "children": [], "html": null}], "html": null}, {"text": "NCI", "kind": "example", "children": [{"text": "Adjusted sub post profit 500, NCI 20% → NCI share 100 before OCI/other specific adjustments.", "kind": "detail", "children": [], "html": null}], "html": null}], "html": null}, {"text": "Common Mistakes / Exam Traps", "kind": "group", "children": [{"text": "Associate revenue/assets line-by-line addခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Associate ကို NCI working ထဲထည့်ခြင်း", "kind": "trap", "children": [], "html": null}, {"text": "Subsidiary whole-year profit consolidate when acquired midyear", "kind": "trap", "children": [], "html": null}, {"text": "Intragroup sale eliminate but URP မadjust", "kind": "trap", "children": [], "html": null}, {"text": "Individual disposal profit = consolidated disposal profit လို့ယူခြင်း", "kind": "trap", "children": [], "html": null}], "html": null}, {"text": "Exam Focus", "kind": "group", "children": [{"text": "Section C group question မှာ workings ကို visible labels နဲ့လုပ်ပြီး line-by-line mapping ထားပါ။", "kind": "exam", "children": [], "html": null}], "html": null}], "html": null}], "html": null};
const viewport=document.getElementById('viewport'),spacer=document.getElementById('spacer'),
stage=document.getElementById('stage'),svg=document.getElementById('links');
let counter=0,scale=.72,opened=new Set(),els=new Map(),pos=new Map(),isolatedRoot=null;
let audioCtx=null;
function playClick(){
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(620,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(980,audioCtx.currentTime+.035);
  g.gain.setValueAtTime(.001,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.05,audioCtx.currentTime+.01);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.09);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.1);
 }catch(e){}
}
function chapterTitleHTML(s){
 const raw=String(s||'');
 const m=raw.match(/^(Chapter\s*\d+)\s*:\s*(.*)$/i);
 if(!m)return escapeHTML(raw);
 return '<span class="chapter-no">'+escapeHTML(m[1])+'</span><span class="chapter-main">'+escapeHTML(m[2])+'</span>';
}

const X=[40,520,1000,1480,2040,2640,3240,3840,4440],GAP=22;
function prep(n,d=0){n.__id='n'+(++counter);n.__depth=d;(n.children||[]).forEach(c=>prep(c,d+1))}
prep(DATA);opened.add(DATA.__id);
function currentRoot(){return isolatedRoot||DATA}
function visualDepth(n){return Math.max(0,n.__depth-currentRoot().__depth)}
function kids(n){return opened.has(n.__id)?(n.children||[]):[]}
function vis(n,a=[]){a.push(n);kids(n).forEach(c=>vis(c,a));return a}
function make(){
 stage.querySelectorAll('.node').forEach(e=>e.remove());els.clear();
 for(const n of vis(currentRoot(),[])){
  const e=document.createElement('div');e.className='node '+(n.kind||'detail')+((n.children||[]).length?'':' no-kids');
  const vd=visualDepth(n);e.style.left=(X[Math.min(vd,X.length-1)]+Math.max(0,vd-X.length+1)*440)+'px';
  const t=document.createElement('div');t.className='txt';
  if(n.html){t.innerHTML=n.html}
  else if((n.kind||'')==='chapter'){t.innerHTML=chapterTitleHTML(n.text)}
  else{t.textContent=n.text}
  const a=document.createElement('button');a.className='arrow'+(opened.has(n.__id)?' open':'');a.textContent='›';a.title='နှိပ်ပြီး အောက်က content ကို ဖွင့်/ပိတ်ရန်';
  a.addEventListener('click',ev=>{
   ev.stopPropagation();playClick();
   // Full map မှာ chapter arrow/card ကိုနှိပ်ရင် chapter-only mode ကိုဝင်မယ်။
   if((n.kind||'')==='chapter' && isolatedRoot!==n){enterChapterOnly(n);return}
   // Chapter-only mode ထဲမှာ arrow ကိုနှိပ်မှ child nodes ပေါ်မယ်။
   if(opened.has(n.__id)){closeBranch(n)}else{opened.add(n.__id)}
   render(true)
  });
  e.addEventListener('click',ev=>{
   playClick();
   if((n.kind||'')==='chapter' && isolatedRoot!==n){enterChapterOnly(n);return}
   if(ev.target.closest('.arrow'))return;
   openFocus(n)
  });
  e.appendChild(t);e.appendChild(a);stage.appendChild(e);els.set(n.__id,e)
 }
}
function H(n){const e=els.get(n.__id),own=e?e.offsetHeight:36,cs=kids(n);if(!cs.length)return own;const hs=cs.map(H);return Math.max(own,hs.reduce((a,b)=>a+b,0)+GAP*(cs.length-1))}
function place(n,top){
 const e=els.get(n.__id);if(!e)return 0;const own=e.offsetHeight,cs=kids(n),hh=H(n);
 if(!cs.length){e.style.top=top+'px';pos.set(n.__id,{x:parseFloat(e.style.left),y:top,w:e.offsetWidth,h:own,node:n});return hh}
 const hs=cs.map(H),block=hs.reduce((a,b)=>a+b,0)+GAP*(cs.length-1);let ct=top+Math.max(0,(hh-block)/2),first=null,last=null;
 cs.forEach((c,i)=>{place(c,ct);const p=pos.get(c.__id),cy=p.y+p.h/2;if(first===null)first=cy;last=cy;ct+=hs[i]+GAP});
 const y=((first+last)/2)-own/2;e.style.top=y+'px';pos.set(n.__id,{x:parseFloat(e.style.left),y,w:e.offsetWidth,h:own,node:n});return hh
}
function curve(a,b){const x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2,dx=Math.max(45,(x2-x1)*.42);return `M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`}
function draw(){
 svg.innerHTML='';let mx=0,my=0;
 for(const [,p] of pos){mx=Math.max(mx,p.x+p.w);my=Math.max(my,p.y+p.h);
  for(const c of kids(p.node)){const q=pos.get(c.__id);if(!q)continue;const path=document.createElementNS('http://www.w3.org/2000/svg','path');
   path.setAttribute('d',curve(p,q));path.setAttribute('fill','none');let color='#7dbf9c',width=1.4,dash='6 5';
   if(p.node.kind==='root'){color='#6588d7';width=2;dash='8 5'}else if(p.node.kind==='chapter'){color='#4faeae';width=1.8;dash=''}
   path.setAttribute('stroke',color);path.setAttribute('stroke-width',width);if(dash)path.setAttribute('stroke-dasharray',dash);path.setAttribute('opacity','.9');svg.appendChild(path)}
 }
 const W=mx+100,HH=my+100;stage.style.width=W+'px';stage.style.height=HH+'px';svg.setAttribute('width',W);svg.setAttribute('height',HH);spacer.style.width=W*scale+'px';spacer.style.height=HH*scale+'px'
}
function render(keep=true){const sl=viewport.scrollLeft,st=viewport.scrollTop;pos.clear();make();place(currentRoot(),45);draw();stage.style.transform=`scale(${scale})`;if(keep){viewport.scrollLeft=sl;viewport.scrollTop=st}}

const branchBack=document.getElementById('branchBack'),branchLabel=document.getElementById('branchLabel'),branchTitle=document.getElementById('branchTitle');
function closeBranch(n){opened.delete(n.__id);(n.children||[]).forEach(closeBranch)}
function enterChapterOnly(n){
 isolatedRoot=n;
 // အကုန်လုံးကို တခါထဲမဖွင့်တော့ပါ။ Chapter header တစ်ခုပဲပြပြီး
 // user က arrow ကိုနှိပ်မှ next level တစ်ခုချင်းစီပေါ်မယ်။
 opened.clear();
 document.body.classList.add('chapter-only');
 branchTitle.textContent=n.text;
 branchBack.classList.add('show');
 branchLabel.classList.add('show');
 render(false);
 viewport.scrollLeft=0;viewport.scrollTop=0;
}
function exitChapterOnly(){
 isolatedRoot=null;
 document.body.classList.remove('chapter-only');
 branchBack.classList.remove('show');
 branchLabel.classList.remove('show');
 branchTitle.textContent='';
 opened.clear();opened.add(DATA.__id);
 render(false);
 viewport.scrollLeft=0;viewport.scrollTop=0;
}
branchBack.addEventListener('click',()=>{playClick();exitChapterOnly()});

let drag=false,sx=0,sy=0,sl=0,st=0;
viewport.addEventListener('mousedown',e=>{if(e.target.closest('.node'))return;drag=true;viewport.classList.add('dragging');sx=e.clientX;sy=e.clientY;sl=viewport.scrollLeft;st=viewport.scrollTop});
window.addEventListener('mousemove',e=>{if(!drag)return;viewport.scrollLeft=sl-(e.clientX-sx);viewport.scrollTop=st-(e.clientY-sy)});
window.addEventListener('mouseup',()=>{drag=false;viewport.classList.remove('dragging')});

const focusOverlay=document.getElementById('focusOverlay'),focusCard=document.getElementById('focusCard'),focusContent=document.getElementById('focusContent'),focusKind=document.getElementById('focusKind'),focusClose=document.getElementById('focusClose'),focusRestore=document.getElementById('focusRestore'),focusBackdrop=document.getElementById('focusBackdrop');
function escapeHTML(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function labelKind(k){return ({root:'Root',chapter:'Chapter',group:'Group',topic:'Topic',overview:'Overview',detail:'Detail',formula:'Formula',example:'Case / Example',step:'Thinking Step',trap:'Exam Trap',exam:'Exam Focus',sheet:'Deep Study Sheet'}[k]||'Study Card')}
function openFocus(n){
 if(!n)return;
 const kind=n.kind||'detail';
 focusCard.dataset.kind=kind;
 focusKind.textContent=labelKind(kind);
 if(n.html){focusContent.innerHTML=n.html}else if((n.kind||'')==='chapter'){focusContent.innerHTML='<div class="focus-text">'+chapterTitleHTML(n.text)+'</div>'}else{focusContent.innerHTML='<div class="focus-text">'+escapeHTML(n.text)+'</div>'}
 focusOverlay.classList.add('show');focusOverlay.setAttribute('aria-hidden','false');document.body.classList.add('focus-open');
 setTimeout(()=>focusClose.focus({preventScroll:true}),40);
}
function closeFocus(){focusOverlay.classList.remove('show');focusOverlay.setAttribute('aria-hidden','true');document.body.classList.remove('focus-open');focusContent.innerHTML=''}
focusClose.addEventListener('click',()=>{playClick();closeFocus()});focusRestore.addEventListener('click',()=>{playClick();closeFocus()});focusBackdrop.addEventListener('click',()=>{playClick();closeFocus()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&focusOverlay.classList.contains('show'))closeFocus()});
focusCard.addEventListener('click',e=>e.stopPropagation());

render(false);
</script>
</body>
</html>
