115.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Rubber tree","kind": "example","children": [{"text": "Bearer tree itself → IAS 16; latex produce growing/harvest → IAS 41 then IAS 2 at harvest.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Common Mistakes / Exam Traps","kind": "group","children": [{"text": "Bearer plants ကို IAS 41 နဲ့ အမြဲ measure လုပ်ခြင်း","kind": "trap","children": [],"html": null},{"text": "Harvestပြီးသား produce ကို IAS 41 ဆက်သုံးခြင်း","kind": "trap","children": [],"html": null},{"text": "Fair value gain ကို OCI သွင်းခြင်း","kind": "trap","children": [],"html": null}],"html": null},{"text": "Exam Focus","kind": "group","children": [{"text": "Classification is the first mark; then measurement and SOPL effect.","kind": "exam","children": [],"html": null}],"html": null}],"html": null},{"text": "Chapter 12: IAS 8 – Accounting Policies, Estimates & Errors","kind": "chapter","children": [{"text": "Deep Excel-style Study Sheets","kind": "group","children": [{"text": "Deep Master Sheet","kind": "sheet","children": [],"html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 12 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 8 first classify the change as Accounting Policy, Accounting Estimate, or Prior-period Error.</td>\n   <td>N/A — classification/treatment standard.</td>\n   <td>Policy changes normally retrospective; estimate changes prospective; prior-period material errors retrospective where practicable.</td>\n   <td>Policy/error may adjust opening Retained Earnings/comparatives; estimate changes affect current/future periods through normal entries.</td>\n   <td><div class='formula-box'><b>Estimate-change depreciation example</b><div class='fstack'>(CA at change date − revised residual value) ÷ revised remaining useful life</div></div></td>\n   <td>Can restate comparatives and opening equity, or affect current/future SOPL depending classification.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Change ဘာကြောင့်ဖြစ်တာလဲ? new information = estimate; rule/basis change = policy; mistake = error.</li><li><b>Step 2:</b> Retrospective or prospective decide.</li><li><b>Step 3:</b> Opening equity/comparatives effect check.</li></ol></td>\n   <td><div class='mini-example'><b>Useful life revised</b><br>5 years to remaining 3 years based on new wear information → estimate change, prospective.</div><div class='mini-example'><b>Wrong depreciation omitted</b><br>Prior-year depreciation accidentally not recorded though info available → prior-period error, retrospective.</div></td>\n   <td><ul><li>Estimate change ကို error လို့ယူခြင်း</li><li>Policy change ကို current-year only adjust လုပ်ခြင်း</li><li>Error correction ကို change in estimate လို့ဖုံးခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Accounting policy</b></td><td>Principles/bases/rules used in preparing financial statements.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Policy change</b></td><td>Required by IFRS or more reliable/relevant information; normally retrospective.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Estimate change</b></td><td>New information/development from estimation uncertainty; prospective current + future.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Prior-period error</b></td><td>Mistake/omission/misuse of available reliable information; retrospective correction where practicable.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Disclosure</b></td><td>Nature and amount of material changes/corrections explain.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Classification + treatment + effect on comparatives/opening RE.</div>\n</div>\n"}],"html": null},{"text": "Chapter Overview","kind": "group","children": [{"text": "Policy change / Estimate change / Prior-period error ကို differentiate လုပ်တာက chapter အဓိက။","kind": "overview","children": [],"html": null}],"html": null},{"text": "Rules / Criteria / Measurement","kind": "group","children": [{"text": "Criteria / Recognition","kind": "topic","children": [{"text": "IAS 8 first classify the change as Accounting Policy, Accounting Estimate, or Prior-period Error.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial Measurement","kind": "topic","children": [{"text": "N/A — classification/treatment standard.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Subsequent Measurement","kind": "topic","children": [{"text": "Policy changes normally retrospective; estimate changes prospective; prior-period material errors retrospective where practicable.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Accounting / Journal Treatment","kind": "topic","children": [{"text": "Policy/error may adjust opening Retained Earnings/comparatives; estimate changes affect current/future periods through normal entries.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Financial Statement Impact","kind": "topic","children": [{"text": "Can restate comparatives and opening equity, or affect current/future SOPL depending classification.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Topic Details","kind": "group","children": [{"text": "Accounting policy","kind": "topic","children": [{"text": "Principles/bases/rules used in preparing financial statements.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Policy change","kind": "topic","children": [{"text": "Required by IFRS or more reliable/relevant information; normally retrospective.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Estimate change","kind": "topic","children": [{"text": "New information/development from estimation uncertainty; prospective current + future.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Prior-period error","kind": "topic","children": [{"text": "Mistake/omission/misuse of available reliable information; retrospective correction where practicable.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Disclosure","kind": "topic","children": [{"text": "Nature and amount of material changes/corrections explain.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Formula / Working Map","kind": "group","children": [{"text": "Estimate-change depreciation example","kind": "formula","children": [{"text": "(CA at change date − revised residual value) ÷ revised remaining useful life","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Exam Thinking Process","kind": "group","children": [{"text": "Step 1 — Change ဘာကြောင့်ဖြစ်တာလဲ? new information = estimate; rule/basis change = policy; mistake = error.","kind": "step","children": [],"html": null},{"text": "Step 2 — Retrospective or prospective decide.","kind": "step","children": [],"html": null},{"text": "Step 3 — Opening equity/comparatives effect check.","kind": "step","children": [],"html": null}],"html": null},{"text": "Examples / Application","kind": "group","children": [{"text": "Useful life revised","kind": "example","children": [{"text": "5 years to remaining 3 years based on new wear information → estimate change, prospective.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Wrong depreciation omitted","kind": "example","children": [{"text": "Prior-year depreciation accidentally not recorded though info available → prior-period error, retrospective.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Common Mistakes / Exam Traps","kind": "group","children": [{"text": "Estimate change ကို error လို့ယူခြင်း","kind": "trap","children": [],"html": null},{"text": "Policy change ကို current-year only adjust လုပ်ခြင်း","kind": "trap","children": [],"html": null},{"text": "Error correction ကို change in estimate လို့ဖုံးခြင်း","kind": "trap","children": [],"html": null}],"html": null},{"text": "Exam Focus","kind": "group","children": [{"text": "Classification + treatment + effect on comparatives/opening RE.","kind": "exam","children": [],"html": null}],"html": null}],"html": null},{"text": "Chapter 13: IFRS 5 – Non-current Assets Held for Sale & Discontinued Operations","kind": "chapter","children": [{"text": "Deep Excel-style Study Sheets","kind": "group","children": [{"text": "Deep Master Sheet","kind": "sheet","children": [],"html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 13 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IFRS 5 held-for-sale criteria include available for immediate sale and sale highly probable, with active plan/marketing and expected completion generally within one year.</td>\n   <td>Before classification, update carrying amount under applicable standards; then measure at lower of carrying amount and FVLCTS.</td>\n   <td>No depreciation while classified held for sale. Continue to reassess sale criteria and FVLCTS.</td>\n   <td>Impairment on classification: Dr Impairment Loss / Cr Asset. Reversal subject to IFRS 5 limits.</td>\n   <td><div class='formula-box'><b>HFS carrying amount</b><div class='fstack'>min(Carrying amount before classification, FVLCTS)</div></div><div class='formula-box'><b>Impairment on classification</b><div class='fstack'>CA − FVLCTS, if positive</div></div></td>\n   <td>Present separately as Current Asset. Discontinued operation results are separately presented in SOPL where criteria are met.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Criteria all substantially met?</li><li><b>Step 2:</b> Before classification, relevant asset standards update CA.</li><li><b>Step 3:</b> Compare CA vs FVLCTS.</li><li><b>Step 4:</b> Recognise impairment if needed.</li><li><b>Step 5:</b> Stop depreciation and present separately.</li></ol></td>\n   <td><div class='mini-example'><b>Asset CA 500, FVLCTS 460</b><br>Classify at 460; impairment 40; no further depreciation while HFS.</div><div class='mini-example'><b>Plan only</b><br>Management wants sale but no active buyer/marketing and sale not highly probable → criteria not met.</div></td>\n   <td><ul><li>Intention to sell = automatic HFS</li><li>FVLCTS &gt; CA ဖြစ်ရင် revalue up without basis</li><li>Held-for-sale ဖြစ်ပြီး depreciation ဆက်လုပ်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Held-for-sale criteria</b></td><td>Available for immediate sale + sale highly probable + active plan/marketing + expected within one year subject to exceptions.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Measurement</b></td><td>Lower of carrying amount and fair value less costs to sell.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Depreciation</b></td><td>Classification as held for sale after measurement adjustment → depreciation cease.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Presentation</b></td><td>Separate current asset line.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Discontinued operation</b></td><td>Disposed/held-for-sale component representing major line/geographical area etc.; results separately presented.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Criteria wording + measurement sequence ကို မေးတတ်တယ်။</div>\n</div>\n"}],"html": null},{"text": "Chapter Overview","kind": "group","children": [{"text": "Held for sale classification criteria ပြည့်တဲ့အခါ measurement changes, depreciation stop, presentation/discontinued operations ကို သိရမယ်။","kind": "overview","children": [],"html": null}],"html": null},{"text": "Rules / Criteria / Measurement","kind": "group","children": [{"text": "Criteria / Recognition","kind": "topic","children": [{"text": "IFRS 5 held-for-sale criteria include available for immediate sale and sale highly probable, with active plan/marketing and expected completion generally within one year.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial Measurement","kind": "topic","children": [{"text": "Before classification, update carrying amount under applicable standards; then measure at lower of carrying amount and FVLCTS.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Subsequent Measurement","kind": "topic","children": [{"text": "No depreciation while classified held for sale. Continue to reassess sale criteria and FVLCTS.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Accounting / Journal Treatment","kind": "topic","children": [{"text": "Impairment on classification: Dr Impairment Loss / Cr Asset. Reversal subject to IFRS 5 limits.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Financial Statement Impact","kind": "topic","children": [{"text": "Present separately as Current Asset. Discontinued operation results are separately presented in SOPL where criteria are met.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Topic Details","kind": "group","children": [{"text": "Held-for-sale criteria","kind": "topic","children": [{"text": "Available for immediate sale + sale highly probable + active plan/marketing + expected within one year subject to exceptions.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Measurement","kind": "topic","children": [{"text": "Lower of carrying amount and fair value less costs to sell.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Depreciation","kind": "topic","children": [{"text": "Classification as held for sale after measurement adjustment → depreciation cease.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Presentation","kind": "topic","children": [{"text": "Separate current asset line.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Discontinued operation","kind": "topic","children": [{"text": "Disposed/held-for-sale component representing major line/geographical area etc.; results separately presented.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Formula / Working Map","kind": "group","children": [{"text": "HFS carrying amount","kind": "formula","children": [{"text": "min(Carrying amount before classification, FVLCTS)","kind": "detail","children": [],"html": null}],"html": null},{"text": "Impairment on classification","kind": "formula","children": [{"text": "CA − FVLCTS, if positive","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Exam Thinking Process","kind": "group","children": [{"text": "Step 1 — Criteria all substantially met?","kind": "step","children": [],"html": null},{"text": "Step 2 — Before classification, relevant asset standards update CA.","kind": "step","children": [],"html": null},{"text": "Step 3 — Compare CA vs FVLCTS.","kind": "step","children": [],"html": null},{"text": "Step 4 — Recognise impairment if needed.","kind": "step","children": [],"html": null},{"text": "Step 5 — Stop depreciation and present separately.","kind": "step","children": [],"html": null}],"html": null},{"text": "Examples / Application","kind": "group","children": [{"text": "Asset CA 500, FVLCTS 460","kind": "example","children": [{"text": "Classify at 460; impairment 40; no further depreciation while HFS.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Plan only","kind": "example","children": [{"text": "Management wants sale but no active buyer/marketing and sale not highly probable → criteria not met.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Common Mistakes / Exam Traps","kind": "group","children": [{"text": "Intention to sell = automatic HFS","kind": "trap","children": [],"html": null},{"text": "FVLCTS > CA ဖြစ်ရင် revalue up without basis","kind": "trap","children": [],"html": null},{"text": "Held-for-sale ဖြစ်ပြီး depreciation ဆက်လုပ်ခြင်း","kind": "trap","children": [],"html": null}],"html": null},{"text": "Exam Focus","kind": "group","children": [{"text": "Criteria wording + measurement sequence ကို မေးတတ်တယ်။","kind": "exam","children": [],"html": null}],"html": null}],"html": null},{"text": "Chapter 14: IAS 21 – Foreign Currency Transactions","kind": "chapter","children": [{"text": "Deep Excel-style Study Sheets","kind": "group","children": [{"text": "Deep Master Sheet","kind": "sheet","children": [],"html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 14 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 21: identify functional currency and classify items as monetary or non-monetary.</td>\n   <td>Foreign currency transaction initially recorded using transaction-date spot rate.</td>\n   <td>Monetary items → closing rate. Historical-cost non-monetary items → historical rate. FV non-monetary items → rate at FV measurement date.</td>\n   <td>Exchange differences on monetary items generally Dr/Cr FX Loss/Gain against the receivable/payable/cash balance.</td>\n   <td><div class='formula-box'><b>Translated amount</b><div class='fstack'>Foreign currency amount × quoted home-currency rate (or ÷ depending on quote convention)</div></div><div class='formula-box'><b>Exchange difference</b><div class='fstack'>Revised translated carrying amount − previous translated carrying amount</div></div></td>\n   <td>Closing monetary balances in SOFP at closing rate; FX differences generally SOPL subject to specific exceptions.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Quote convention ကို ပထမ fix.</li><li><b>Step 2:</b> Item monetary/non-monetary classify.</li><li><b>Step 3:</b> Relevant date rate choose.</li><li><b>Step 4:</b> Carrying amount retranslate.</li><li><b>Step 5:</b> Difference debit/credit direction reason with receivable/payable.</li></ol></td>\n   <td><div class='mini-example'><b>USD payable</b><br>Payable 10,000 USD; initially 3.60 local/USD = 36,000. Closing 3.70 = 37,000 → payable increases 1,000 → FX loss.</div><div class='mini-example'><b>USD receivable</b><br>Rate strengthens from 3.60 to 3.70 local/USD → receivable local value rises → FX gain.</div></td>\n   <td><ul><li>All foreign items closing rate သုံးခြင်း</li><li>Receivable/payable gain/loss direction ပြောင်းမှားခြင်း</li><li>Rate quote numerator/denominator မစစ်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Initial recognition</b></td><td>Transaction-date spot rate.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Monetary items</b></td><td>Cash, receivables, payables etc. → reporting date closing rate.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Non-monetary historical cost</b></td><td>Historical transaction-date rate.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Non-monetary fair value</b></td><td>Rate at date fair value measured.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Exchange differences</b></td><td>Monetary retranslation/settlement differences generally SOPL, subject to specific exceptions.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Functional vs presentation currency</b></td><td>Functional currency reflects primary economic environment; presentation currency is reporting choice.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Simple retranslation + settlement, sometimes multiple dates.</div>\n</div>\n"}],"html": null},{"text": "Chapter Overview","kind": "group","children": [{"text": "Foreign currency transaction ကို transaction date, settlement date, reporting date သုံးချိန်လုံးမှာ ဘယ် rate သုံးလဲ ခွဲရမယ်။ Monetary items retranslate at closing rate; differences usually SOPL.","kind": "overview","children": [],"html": null}],"html": null},{"text": "Rules / Criteria / Measurement","kind": "group","children": [{"text": "Criteria / Recognition","kind": "topic","children": [{"text": "IAS 21: identify functional currency and classify items as monetary or non-monetary.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial Measurement","kind": "topic","children": [{"text": "Foreign currency transaction initially recorded using transaction-date spot rate.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Subsequent Measurement","kind": "topic","children": [{"text": "Monetary items → closing rate. Historical-cost non-monetary items → historical rate. FV non-monetary items → rate at FV measurement date.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Accounting / Journal Treatment","kind": "topic","children": [{"text": "Exchange differences on monetary items generally Dr/Cr FX Loss/Gain against the receivable/payable/cash balance.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Financial Statement Impact","kind": "topic","children": [{"text": "Closing monetary balances in SOFP at closing rate; FX differences generally SOPL subject to specific exceptions.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Topic Details","kind": "group","children": [{"text": "Initial recognition","kind": "topic","children": [{"text": "Transaction-date spot rate.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Monetary items","kind": "topic","children": [{"text": "Cash, receivables, payables etc. → reporting date closing rate.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Non-monetary historical cost","kind": "topic","children": [{"text": "Historical transaction-date rate.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Non-monetary fair value","kind": "topic","children": [{"text": "Rate at date fair value measured.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Exchange differences","kind": "topic","children": [{"text": "Monetary retranslation/settlement differences generally SOPL, subject to specific exceptions.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Functional vs presentation currency","kind": "topic","children": [{"text": "Functional currency reflects primary economic environment; presentation currency is reporting choice.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Formula / Working Map","kind": "group","children": [{"text": "Translated amount","kind": "formula","children": [{"text": "Foreign currency amount × quoted home-currency rate (or ÷ depending on quote convention)","kind": "detail","children": [],"html": null}],"html": null},{"text": "Exchange difference","kind": "formula","children": [{"text": "Revised translated carrying amount − previous translated carrying amount","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Exam Thinking Process","kind": "group","children": [{"text": "Step 1 — Quote convention ကို ပထမ fix.","kind": "step","children": [],"html": null},{"text": "Step 2 — Item monetary/non-monetary classify.","kind": "step","children": [],"html": null},{"text": "Step 3 — Relevant date rate choose.","kind": "step","children": [],"html": null},{"text": "Step 4 — Carrying amount retranslate.","kind": "step","children": [],"html": null},{"text": "Step 5 — Difference debit/credit direction reason with receivable/payable.","kind": "step","children": [],"html": null}],"html": null},{"text": "Examples / Application","kind": "group","children": [{"text": "USD payable","kind": "example","children": [{"text": "Payable 10,000 USD; initially 3.60 local/USD = 36,000. Closing 3.70 = 37,000 → payable increases 1,000 → FX loss.","kind": "detail","children": [],"html": null}],"html": null},{"text": "USD receivable","kind": "example","children": [{"text": "Rate strengthens from 3.60 to 3.70 local/USD → receivable local value rises → FX gain.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Common Mistakes / Exam Traps","kind": "group","children": [{"text": "All foreign items closing rate သုံးခြင်း","kind": "trap","children": [],"html": null},{"text": "Receivable/payable gain/loss direction ပြောင်းမှားခြင်း","kind": "trap","children": [],"html": null},{"text": "Rate quote numerator/denominator မစစ်ခြင်း","kind": "trap","children": [],"html": null}],"html": null},{"text": "Exam Focus","kind": "group","children": [{"text": "Simple retranslation + settlement, sometimes multiple dates.","kind": "exam","children": [],"html": null}],"html": null}],"html": null},{"text": "Chapter 15: IAS 33 – Earnings per Share (EPS)","kind": "chapter","children": [{"text": "Deep Excel-style Study Sheets","kind": "group","children": [{"text": "Deep Master Sheet","kind": "sheet","children": [],"html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 15 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 33 applies to entities required to present EPS. Calculate Basic EPS and, where relevant, Diluted EPS for dilutive potential ordinary shares.</td>\n   <td>Numerator = earnings attributable to ordinary shareholders; denominator = weighted-average ordinary shares.</td>\n   <td>Adjust for bonus/rights issues and potential ordinary shares where dilutive; restate comparatives where required.</td>\n   <td>No journal entry — EPS is a presentation/calculation measure.</td>\n   <td><div class='formula-box'><b>Basic EPS</b><div class='fstack'>Earnings attributable to ordinary shareholders ÷ Weighted-average ordinary shares</div></div><div class='formula-box'><b>P/E ratio link</b><div class='fstack'>Market price per share ÷ EPS</div></div><div class='formula-box'><b>Convertible diluted EPS</b><div class='fstack'>(Earnings + after-tax interest saved) ÷ (Weighted shares + conversion shares)</div></div></td>\n   <td>EPS disclosed/presented with performance information; no direct carrying amount effect.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Numerator clean: preference dividend effects.</li><li><b>Step 2:</b> Share timeline draw.</li><li><b>Step 3:</b> Issue type cash/bonus/rights identify.</li><li><b>Step 4:</b> Weighted average calculate.</li><li><b>Step 5:</b> Potential ordinary shares test for dilution.</li></ol></td>\n   <td><div class='mini-example'><b>Weighted shares</b><br>1m shares all year + 600k issued 1 Oct → WA = 1m + 600k×3/12 = 1.15m.</div><div class='mini-example'><b>Convertible</b><br>Profit 500k, after-tax interest 40k, WA shares 1m, conversion adds 200k → diluted EPS = 540k/1.2m = 0.45.</div></td>\n   <td><ul><li>Closing shares instead of weighted average</li><li>Bonus issue time-apportionment လုပ်ခြင်း</li><li>Anti-dilutive instrument ကို diluted EPS ထဲထည့်ခြင်း</li><li>Interest add-back ကို after-tax မလုပ်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Basic EPS numerator</b></td><td>Profit attributable to ordinary shareholders after preference dividends as relevant.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Weighted-average denominator</b></td><td>Shares × time fraction, adjusted for bonus elements where required.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Bonus issue</b></td><td>Restate comparative EPS as if bonus shares existed throughout.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Rights issue</b></td><td>Contains bonus element; theoretical ex-rights price adjustment may be needed.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Diluted EPS</b></td><td>Potential ordinary shares only if dilutive.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Convertible debt</b></td><td>Add back after-tax interest to numerator and add conversion shares to denominator.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Calculation accuracy and chronology are key.</div>\n</div>\n"}],"html": null},{"text": "Chapter Overview","kind": "group","children": [{"text": "Basic EPS မှာ earnings attributable to ordinary shareholders နဲ့ weighted-average shares ကို မှန်အောင်ပြင်ရမယ်။ Rights/bonus/share issues, convertible instruments dilute effect ကို စစ်တယ်။","kind": "overview","children": [],"html": null}],"html": null},{"text": "Rules / Criteria / Measurement","kind": "group","children": [{"text": "Criteria / Recognition","kind": "topic","children": [{"text": "IAS 33 applies to entities required to present EPS. Calculate Basic EPS and, where relevant, Diluted EPS for dilutive potential ordinary shares.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial Measurement","kind": "topic","children": [{"text": "Numerator = earnings attributable to ordinary shareholders; denominator = weighted-average ordinary shares.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Subsequent Measurement","kind": "topic","children": [{"text": "Adjust for bonus/rights issues and potential ordinary shares where dilutive; restate comparatives where required.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Accounting / Journal Treatment","kind": "topic","children": [{"text": "No journal entry — EPS is a presentation/calculation measure.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Financial Statement Impact","kind": "topic","children": [{"text": "EPS disclosed/presented with performance information; no direct carrying amount effect.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Topic Details","kind": "group","children": [{"text": "Basic EPS numerator","kind": "topic","children": [{"text": "Profit attributable to ordinary shareholders after preference dividends as relevant.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Weighted-average denominator","kind": "topic","children": [{"text": "Shares × time fraction, adjusted for bonus elements where required.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Bonus issue","kind": "topic","children": [{"text": "Restate comparative EPS as if bonus shares existed throughout.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Rights issue","kind": "topic","children": [{"text": "Contains bonus element; theoretical ex-rights price adjustment may be needed.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Diluted EPS","kind": "topic","children": [{"text": "Potential ordinary shares only if dilutive.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Convertible debt","kind": "topic","children": [{"text": "Add back after-tax interest to numerator and add conversion shares to denominator.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Formula / Working Map","kind": "group","children": [{"text": "Basic EPS","kind": "formula","children": [{"text": "Earnings attributable to ordinary shareholders ÷ Weighted-average ordinary shares","kind": "detail","children": [],"html": null}],"html": null},{"text": "P/E ratio link","kind": "formula","children": [{"text": "Market price per share ÷ EPS","kind": "detail","children": [],"html": null}],"html": null},{"text": "Convertible diluted EPS","kind": "formula","children": [{"text": "(Earnings + after-tax interest saved) ÷ (Weighted shares + conversion shares)","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Exam Thinking Process","kind": "group","children": [{"text": "Step 1 — Numerator clean: preference dividend effects.","kind": "step","children": [],"html": null},{"text": "Step 2 — Share timeline draw.","kind": "step","children": [],"html": null},{"text": "Step 3 — Issue type cash/bonus/rights identify.","kind": "step","children": [],"html": null},{"text": "Step 4 — Weighted average calculate.","kind": "step","children": [],"html": null},{"text": "Step 5 — Potential ordinary shares test for dilution.","kind": "step","children": [],"html": null}],"html": null},{"text": "Examples / Application","kind": "group","children": [{"text": "Weighted shares","kind": "example","children": [{"text": "1m shares all year + 600k issued 1 Oct → WA = 1m + 600k×3/12 = 1.15m.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Convertible","kind": "example","children": [{"text": "Profit 500k, after-tax interest 40k, WA shares 1m, conversion adds 200k → diluted EPS = 540k/1.2m = 0.45.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Common Mistakes / Exam Traps","kind": "group","children": [{"text": "Closing shares instead of weighted average","kind": "trap","children": [],"html": null},{"text": "Bonus issue time-apportionment လုပ်ခြင်း","kind": "trap","children": [],"html": null},{"text": "Anti-dilutive instrument ကို diluted EPS ထဲထည့်ခြင်း","kind": "trap","children": [],"html": null},{"text": "Interest add-back ကို after-tax မလုပ်ခြင်း","kind": "trap","children": [],"html": null}],"html": null},{"text": "Exam Focus","kind": "group","children": [{"text": "Calculation accuracy and chronology are key.","kind": "exam","children": [],"html": null}],"html": null}],"html": null},{"text": "Chapter 16: IAS 32 & IFRS 9 – Financial Instruments","kind": "chapter","children": [{"text": "Deep Excel-style Study Sheets","kind": "group","children": [{"text": "Deep Master Sheet","kind": "sheet","children": [],"html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 16 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 32 issuer classification focuses on contractual obligation to deliver cash. IFRS 9 holder classification depends on business model and cash-flow characteristics.</td>\n   <td>Financial assets/liabilities initially measured under IFRS 9 category rules; compound instruments split into liability and equity at inception.</td>\n   <td>Amortised cost via EIR, FVPL, or FVOCI as applicable. Relevant expected credit loss impairment rules apply.</td>\n   <td>EIR: Dr Finance Cost / Cr Liability (or Dr Asset / Cr Interest Income). FVPL changes → SOPL. Compound issue: split liability/equity components.</td>\n   <td><div class='formula-box'><b>Amortised cost closing</b><div class='fstack'>Opening amortised cost + EIR interest − cash paid/received</div></div><div class='formula-box'><b>Compound liability PV</b><div class='fstack'>PV of interest coupons + PV of redemption amount using market rate for similar non-convertible debt</div></div><div class='formula-box'><b>Equity component</b><div class='fstack'>Issue proceeds − initial liability component</div></div></td>\n   <td>Financial assets/liabilities in SOFP; interest and FV movements affect SOPL/OCI depending category; equity component remains in equity.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Instrument terms read: cash obligation? conversion? discretion?</li><li><b>Step 2:</b> Issuer vs holder perspective separate.</li><li><b>Step 3:</b> Business model + cash flow features map measurement category.</li><li><b>Step 4:</b> EIR schedule build if amortised cost.</li><li><b>Step 5:</b> FV changes/interest presentation decide.</li></ol></td>\n   <td><div class='mini-example'><b>Convertible bond</b><br>Issue 1,000; liability PV at market debt rate = 920 → equity component 80.</div><div class='mini-example'><b>Amortised loan</b><br>Opening 920 × EIR 8% = 73.6 interest; coupon 50 → closing liability 943.6.</div></td>\n   <td><ul><li>Legal name &#x27;share&#x27; ဆိုတိုင်း equity</li><li>Coupon rate = EIR လို့ယူခြင်း</li><li>Compound instrument ကို full liability/full equity တစ်ခုတည်းထားခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Liability vs equity</b></td><td>Contractual obligation to deliver cash → liability; residual interest with no such obligation → equity.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Compound instrument</b></td><td>Convertible bond issue proceeds split liability + equity components at inception.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Amortised cost</b></td><td>Held to collect + SPPI conditions met → effective interest method.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>FVPL</b></td><td>Default/held-for-trading or conditions not met → fair value changes SOPL.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>FVOCI</b></td><td>Certain eligible debt/equity classifications subject to conditions/election.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Transaction costs</b></td><td>Treatment depends on classification; FVPL often expense, other categories may include in initial measurement.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Impairment</b></td><td>Expected credit loss concepts apply to relevant financial assets.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Classification and amortised-cost tables are common.</div>\n</div>\n"}],"html": null},{"text": "Chapter Overview","kind": "group","children": [{"text": "Issuer side မှာ liability vs equity classification; investor side မှာ financial assets measurement. Amortised cost/EIR, FVPL, FVOCI logic နဲ့ compound instruments ကို အဓိကထား။","kind": "overview","children": [],"html": null}],"html": null},{"text": "Rules / Criteria / Measurement","kind": "group","children": [{"text": "Criteria / Recognition","kind": "topic","children": [{"text": "IAS 32 issuer classification focuses on contractual obligation to deliver cash. IFRS 9 holder classification depends on business model and cash-flow characteristics.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial Measurement","kind": "topic","children": [{"text": "Financial assets/liabilities initially measured under IFRS 9 category rules; compound instruments split into liability and equity at inception.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Subsequent Measurement","kind": "topic","children": [{"text": "Amortised cost via EIR, FVPL, or FVOCI as applicable. Relevant expected credit loss impairment rules apply.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Accounting / Journal Treatment","kind": "topic","children": [{"text": "EIR: Dr Finance Cost / Cr Liability (or Dr Asset / Cr Interest Income). FVPL changes → SOPL. Compound issue: split liability/equity components.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Financial Statement Impact","kind": "topic","children": [{"text": "Financial assets/liabilities in SOFP; interest and FV movements affect SOPL/OCI depending category; equity component remains in equity.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Topic Details","kind": "group","children": [{"text": "Liability vs equity","kind": "topic","children": [{"text": "Contractual obligation to deliver cash → liability; residual interest with no such obligation → equity.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Compound instrument","kind": "topic","children": [{"text": "Convertible bond issue proceeds split liability + equity components at inception.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Amortised cost","kind": "topic","children": [{"text": "Held to collect + SPPI conditions met → effective interest method.","kind": "detail","children": [],"html": null}],"html": null},{"text": "FVPL","kind": "topic","children": [{"text": "Default/held-for-trading or conditions not met → fair value changes SOPL.","kind": "detail","children": [],"html": null}],"html": null},{"text": "FVOCI","kind": "topic","children": [{"text": "Certain eligible debt/equity classifications subject to conditions/election.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Transaction costs","kind": "topic","children": [{"text": "Treatment depends on classification; FVPL often expense, other categories may include in initial measurement.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Impairment","kind": "topic","children": [{"text": "Expected credit loss concepts apply to relevant financial assets.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Formula / Working Map","kind": "group","children": [{"text": "Amortised cost closing","kind": "formula","children": [{"text": "Opening amortised cost + EIR interest − cash paid/received","kind": "detail","children": [],"html": null}],"html": null},{"text": "Compound liability PV","kind": "formula","children": [{"text": "PV of interest coupons + PV of redemption amount using market rate for similar non-convertible debt","kind": "detail","children": [],"html": null}],"html": null},{"text": "Equity component","kind": "formula","children": [{"text": "Issue proceeds − initial liability component","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Exam Thinking Process","kind": "group","children": [{"text": "Step 1 — Instrument terms read: cash obligation? conversion? discretion?","kind": "step","children": [],"html": null},{"text": "Step 2 — Issuer vs holder perspective separate.","kind": "step","children": [],"html": null},{"text": "Step 3 — Business model + cash flow features map measurement category.","kind": "step","children": [],"html": null},{"text": "Step 4 — EIR schedule build if amortised cost.","kind": "step","children": [],"html": null},{"text": "Step 5 — FV changes/interest presentation decide.","kind": "step","children": [],"html": null}],"html": null},{"text": "Examples / Application","kind": "group","children": [{"text": "Convertible bond","kind": "example","children": [{"text": "Issue 1,000; liability PV at market debt rate = 920 → equity component 80.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Amortised loan","kind": "example","children": [{"text": "Opening 920 × EIR 8% = 73.6 interest; coupon 50 → closing liability 943.6.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Common Mistakes / Exam Traps","kind": "group","children": [{"text": "Legal name 'share' ဆိုတိုင်း equity","kind": "trap","children": [],"html": null},{"text": "Coupon rate = EIR လို့ယူခြင်း","kind": "trap","children": [],"html": null},{"text": "Compound instrument ကို full liability/full equity တစ်ခုတည်းထားခြင်း","kind": "trap","children": [],"html": null}],"html": null},{"text": "Exam Focus","kind": "group","children": [{"text": "Classification and amortised-cost tables are common.","kind": "exam","children": [],"html": null}],"html": null}],"html": null},{"text": "Chapter 17: IFRS 16 – Leases","kind": "chapter","children": [{"text": "Deep Excel-style Study Sheets","kind": "group","children": [{"text": "Deep Master Sheet","kind": "sheet","children": [],"html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 17 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IFRS 16: contract contains a lease when there is an identified asset and customer controls its use for a period in exchange for consideration.</td>\n   <td>Lease Liability = PV of unpaid lease payments. ROU Asset = Lease liability + eligible initial amounts/costs − incentives + restoration estimate where applicable.</td>\n   <td>Lease liability: EIR interest + payments. ROU asset: depreciation + impairment. Remeasure for specified lease changes.</td>\n   <td>Commencement: Dr ROU Asset / Cr Lease Liability. Interest: Dr Finance Cost / Cr Liability. Payment: Dr Liability / Cr Cash. Depreciation: Dr Expense / Cr Accum. Dep.</td>\n   <td><div class='formula-box'><b>Lease liability at commencement</b><div class='fstack'>PV of unpaid lease payments</div></div><div class='formula-box'><b>Closing lease liability</b><div class='fstack'>Opening liability + Finance interest − Cash lease payment</div></div><div class='formula-box'><b>ROU depreciation</b><div class='fstack'>ROU depreciable amount ÷ lease term (or useful life where ownership criteria dictate)</div></div></td>\n   <td>ROU asset and lease liability in SOFP; depreciation generally Operating; interest/finance presentation follows applicable reporting requirements.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Contract contains lease?</li><li><b>Step 2:</b> Payment timing arrears/advance identify.</li><li><b>Step 3:</b> PV schedule build.</li><li><b>Step 4:</b> ROU cost assemble.</li><li><b>Step 5:</b> Annual interest/payment/depreciation separate.</li><li><b>Step 6:</b> Current/non-current liability split if required.</li></ol></td>\n   <td><div class='mini-example'><b>Arrears lease</b><br>Opening LL 100,000, 10% interest, year-end payment 30,000 → closing LL 80,000.</div><div class='mini-example'><b>ROU cost</b><br>LL 100k + initial direct cost 5k + prepaid 10k − incentive 3k = ROU 112k before restoration adjustments.</div></td>\n   <td><ul><li>Lease payment အားလုံး expense</li><li>Interest ကို payment မှနုတ်မပြုဘဲ liability schedule မှားခြင်း</li><li>ROU depreciation နဲ့ liability interest ကိုတစ်ခုတည်းထင်ခြင်း</li><li>Payments in advance vs arrears မခွဲခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Identify a lease</b></td><td>Identified asset + right to control use during period in exchange for consideration.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Lease liability</b></td><td>PV of lease payments using interest rate implicit or incremental borrowing rate where appropriate.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>ROU initial cost</b></td><td>Initial liability + payments before commencement − incentives + initial direct costs + dismantling/restoration estimate.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Subsequent liability</b></td><td>Interest accrues; payments reduce liability.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>ROU subsequent</b></td><td>Depreciation + impairment, subject to ownership/purchase option/useful life rules.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Short-term/low-value exemptions</b></td><td>Election may allow expense recognition rather than full ROU model.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Lease modifications</b></td><td>Depending on scope/consideration changes, separate lease or remeasurement.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Schedule format ကို တိတိကျကျရေးနိုင်ရင် marks မြန်မြန်ရတယ်။</div>\n</div>\n"}],"html": null},{"text": "Chapter Overview","kind": "group","children": [{"text": "Lessee accounting မှာ Right-of-Use Asset (ROU) + Lease Liability ကို recognise လုပ်ပြီး liability ကို interest + payment နဲ့ unwind လုပ်တယ်။","kind": "overview","children": [],"html": null}],"html": null},{"text": "Rules / Criteria / Measurement","kind": "group","children": [{"text": "Criteria / Recognition","kind": "topic","children": [{"text": "IFRS 16: contract contains a lease when there is an identified asset and customer controls its use for a period in exchange for consideration.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial Measurement","kind": "topic","children": [{"text": "Lease Liability = PV of unpaid lease payments. ROU Asset = Lease liability + eligible initial amounts/costs − incentives + restoration estimate where applicable.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Subsequent Measurement","kind": "topic","children": [{"text": "Lease liability: EIR interest + payments. ROU asset: depreciation + impairment. Remeasure for specified lease changes.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Accounting / Journal Treatment","kind": "topic","children": [{"text": "Commencement: Dr ROU Asset / Cr Lease Liability. Interest: Dr Finance Cost / Cr Liability. Payment: Dr Liability / Cr Cash. Depreciation: Dr Expense / Cr Accum. Dep.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Financial Statement Impact","kind": "topic","children": [{"text": "ROU asset and lease liability in SOFP; depreciation generally Operating; interest/finance presentation follows applicable reporting requirements.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Topic Details","kind": "group","children": [{"text": "Identify a lease","kind": "topic","children": [{"text": "Identified asset + right to control use during period in exchange for consideration.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Lease liability","kind": "topic","children": [{"text": "PV of lease payments using interest rate implicit or incremental borrowing rate where appropriate.","kind": "detail","children": [],"html": null}],"html": null},{"text": "ROU initial cost","kind": "topic","children": [{"text": "Initial liability + payments before commencement − incentives + initial direct costs + dismantling/restoration estimate.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Subsequent liability","kind": "topic","children": [{"text": "Interest accrues; payments reduce liability.","kind": "detail","children": [],"html": null}],"html": null},{"text": "ROU subsequent","kind": "topic","children": [{"text": "Depreciation + impairment, subject to ownership/purchase option/useful life rules.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Short-term/low-value exemptions","kind": "topic","children": [{"text": "Election may allow expense recognition rather than full ROU model.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Lease modifications","kind": "topic","children": [{"text": "Depending on scope/consideration changes, separate lease or remeasurement.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Formula / Working Map","kind": "group","children": [{"text": "Lease liability at commencement","kind": "formula","children": [{"text": "PV of unpaid lease payments","kind": "detail","children": [],"html": null}],"html": null},{"text": "Closing lease liability","kind": "formula","children": [{"text": "Opening liability + Finance interest − Cash lease payment","kind": "detail","children": [],"html": null}],"html": null},{"text": "ROU depreciation","kind": "formula","children": [{"text": "ROU depreciable amount ÷ lease term (or useful life where ownership criteria dictate)","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Exam Thinking Process","kind": "group","children": [{"text": "Step 1 — Contract contains lease?","kind": "step","children": [],"html": null},{"text": "Step 2 — Payment timing arrears/advance identify.","kind": "step","children": [],"html": null},{"text": "Step 3 — PV schedule build.","kind": "step","children": [],"html": null},{"text": "Step 4 — ROU cost assemble.","kind": "step","children": [],"html": null},{"text": "Step 5 — Annual interest/payment/depreciation separate.","kind": "step","children": [],"html": null},{"text": "Step 6 — Current/non-current liability split if required.","kind": "step","children": [],"html": null}],"html": null},{"text": "Examples / Application","kind": "group","children": [{"text": "Arrears lease","kind": "example","children": [{"text": "Opening LL 100,000, 10% interest, year-end payment 30,000 → closing LL 80,000.","kind": "detail","children": [],"html": null}],"html": null},{"text": "ROU cost","kind": "example","children": [{"text": "LL 100k + initial direct cost 5k + prepaid 10k − incentive 3k = ROU 112k before restoration adjustments.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Common Mistakes / Exam Traps","kind": "group","children": [{"text": "Lease payment အားလုံး expense","kind": "trap","children": [],"html": null},{"text": "Interest ကို payment မှနုတ်မပြုဘဲ liability schedule မှားခြင်း","kind": "trap","children": [],"html": null},{"text": "ROU depreciation နဲ့ liability interest ကိုတစ်ခုတည်းထင်ခြင်း","kind": "trap","children": [],"html": null},{"text": "Payments in advance vs arrears မခွဲခြင်း","kind": "trap","children": [],"html": null}],"html": null},{"text": "Exam Focus","kind": "group","children": [{"text": "Schedule format ကို တိတိကျကျရေးနိုင်ရင် marks မြန်မြန်ရတယ်။","kind": "exam","children": [],"html": null}],"html": null}],"html": null},{"text": "Chapter 18: IAS 12 – Current Tax & Deferred Tax","kind": "chapter","children": [{"text": "Deep Excel-style Study Sheets","kind": "group","children": [{"text": "Deep Master Sheet","kind": "sheet","children": [],"html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 18 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 12: compare carrying amount with tax base to identify taxable or deductible temporary differences.</td>\n   <td>Current tax based on taxable profit. Deferred tax = temporary difference × enacted/substantively enacted future tax rate, subject to recognition criteria for DTA.</td>\n   <td>Remeasure deferred tax when carrying amounts/tax bases/rates change; recognize tax effect consistently with underlying transaction.</td>\n   <td>DTL: Dr Tax Expense/OCI / Cr Deferred Tax Liability. DTA: Dr Deferred Tax Asset / Cr Tax Income/OCI, subject to recoverability.</td>\n   <td><div class='formula-box'><b>Current tax</b><div class='fstack'>Taxable profit × Current tax rate</div></div><div class='formula-box'><b>Temporary difference</b><div class='fstack'>Carrying Amount − Tax Base (interpret sign with asset/liability nature)</div></div><div class='formula-box'><b>Deferred tax</b><div class='fstack'>Temporary difference × Applicable future tax rate</div></div></td>\n   <td>Current tax payable/receivable and deferred tax in SOFP; tax expense/income in SOPL or OCI/equity following underlying item.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Current tax separate from deferred tax.</li><li><b>Step 2:</b> For each asset/liability write CA and TB side-by-side.</li><li><b>Step 3:</b> Future recovery/settlement produces taxable or deductible amount?</li><li><b>Step 4:</b> DTL/DTA classify.</li><li><b>Step 5:</b> Apply future enacted/substantively enacted rate.</li><li><b>Step 6:</b> Underlying item SOPL/OCI/equity where tax effect should go.</li></ol></td>\n   <td><div class='mini-example'><b>Revalued asset</b><br>CA 150, TB 100, taxable temp diff 50; tax 30% → DTL 15. If difference arose from OCI revaluation, tax effect also OCI.</div><div class='mini-example'><b>Tax loss</b><br>Tax loss 3,000 carried forward; rate 25%; probable future taxable profits sufficient → DTA up to 750.</div></td>\n   <td><ul><li>Current tax provision = deferred tax</li><li>CA-TB sign mechanically useပြီး asset/liability nature မစဉ်းစားခြင်း</li><li>Revaluation tax effect SOPL သွင်းခြင်း when underlying gain OCI</li><li>DTA on losses အလိုအလျောက် recognise</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Current tax</b></td><td>Taxable profit × enacted/substantively enacted rate, adjusted for under/over-provisions.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Tax base</b></td><td>Asset/liability carrying amount နဲ့ tax purposes recoverable/deductible amount relationship.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Temporary differences</b></td><td>Taxable temporary difference → generally DTL; deductible temporary difference → potential DTA subject to recoverability.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Revaluation</b></td><td>Revaluation creates temporary difference even if no immediate sale; tax effect follows underlying transaction (e.g. OCI if revaluation in OCI).</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Unused tax losses</b></td><td>DTA only to extent probable future taxable profits available.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Presentation</b></td><td>Deferred tax generally non-current; tax effect follows location of underlying item where applicable.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> CA/TB table method is safest.</div>\n</div>\n"}],"html": null},{"text": "Chapter Overview","kind": "group","children": [{"text": "Current tax = current-period taxable profit on tax rules. Deferred tax = accounting carrying amount နဲ့ tax base ကြား temporary difference က future tax consequence ကို recognise လုပ်တာ။","kind": "overview","children": [],"html": null}],"html": null},{"text": "Rules / Criteria / Measurement","kind": "group","children": [{"text": "Criteria / Recognition","kind": "topic","children": [{"text": "IAS 12: compare carrying amount with tax base to identify taxable or deductible temporary differences.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial Measurement","kind": "topic","children": [{"text": "Current tax based on taxable profit. Deferred tax = temporary difference × enacted/substantively enacted future tax rate, subject to recognition criteria for DTA.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Subsequent Measurement","kind": "topic","children": [{"text": "Remeasure deferred tax when carrying amounts/tax bases/rates change; recognize tax effect consistently with underlying transaction.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Accounting / Journal Treatment","kind": "topic","children": [{"text": "DTL: Dr Tax Expense/OCI / Cr Deferred Tax Liability. DTA: Dr Deferred Tax Asset / Cr Tax Income/OCI, subject to recoverability.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Financial Statement Impact","kind": "topic","children": [{"text": "Current tax payable/receivable and deferred tax in SOFP; tax expense/income in SOPL or OCI/equity following underlying item.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Topic Details","kind": "group","children": [{"text": "Current tax","kind": "topic","children": [{"text": "Taxable profit × enacted/substantively enacted rate, adjusted for under/over-provisions.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Tax base","kind": "topic","children": [{"text": "Asset/liability carrying amount နဲ့ tax purposes recoverable/deductible amount relationship.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Temporary differences","kind": "topic","children": [{"text": "Taxable temporary difference → generally DTL; deductible temporary difference → potential DTA subject to recoverability.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Revaluation","kind": "topic","children": [{"text": "Revaluation creates temporary difference even if no immediate sale; tax effect follows underlying transaction (e.g. OCI if revaluation in OCI).","kind": "detail","children": [],"html": null}],"html": null},{"text": "Unused tax losses","kind": "topic","children": [{"text": "DTA only to extent probable future taxable profits available.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Presentation","kind": "topic","children": [{"text": "Deferred tax generally non-current; tax effect follows location of underlying item where applicable.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Formula / Working Map","kind": "group","children": [{"text": "Current tax","kind": "formula","children": [{"text": "Taxable profit × Current tax rate","kind": "detail","children": [],"html": null}],"html": null},{"text": "Temporary difference","kind": "formula","children": [{"text": "Carrying Amount − Tax Base (interpret sign with asset/liability nature)","kind": "detail","children": [],"html": null}],"html": null},{"text": "Deferred tax","kind": "formula","children": [{"text": "Temporary difference × Applicable future tax rate","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Exam Thinking Process","kind": "group","children": [{"text": "Step 1 — Current tax separate from deferred tax.","kind": "step","children": [],"html": null},{"text": "Step 2 — For each asset/liability write CA and TB side-by-side.","kind": "step","children": [],"html": null},{"text": "Step 3 — Future recovery/settlement produces taxable or deductible amount?","kind": "step","children": [],"html": null},{"text": "Step 4 — DTL/DTA classify.","kind": "step","children": [],"html": null},{"text": "Step 5 — Apply future enacted/substantively enacted rate.","kind": "step","children": [],"html": null},{"text": "Step 6 — Underlying item SOPL/OCI/equity where tax effect should go.","kind": "step","children": [],"html": null}],"html": null},{"text": "Examples / Application","kind": "group","children": [{"text": "Revalued asset","kind": "example","children": [{"text": "CA 150, TB 100, taxable temp diff 50; tax 30% → DTL 15. If difference arose from OCI revaluation, tax effect also OCI.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Tax loss","kind": "example","children": [{"text": "Tax loss 3,000 carried forward; rate 25%; probable future taxable profits sufficient → DTA up to 750.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Common Mistakes / Exam Traps","kind": "group","children": [{"text": "Current tax provision = deferred tax","kind": "trap","children": [],"html": null},{"text": "CA-TB sign mechanically useပြီး asset/liability nature မစဉ်းစားခြင်း","kind": "trap","children": [],"html": null},{"text": "Revaluation tax effect SOPL သွင်းခြင်း when underlying gain OCI","kind": "trap","children": [],"html": null},{"text": "DTA on losses အလိုအလျောက် recognise","kind": "trap","children": [],"html": null}],"html": null},{"text": "Exam Focus","kind": "group","children": [{"text": "CA/TB table method is safest.","kind": "exam","children": [],"html": null}],"html": null}],"html": null},{"text": "Chapter 19: IFRS 15 – Revenue from Contracts with Customers","kind": "chapter","children": [{"text": "Deep Excel-style Study Sheets","kind": "group","children": [{"text": "Deep Master Sheet","kind": "sheet","children": [],"html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 19 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IFRS 15: apply 5-step model — contract, performance obligations, transaction price, allocation, recognition when/as performance obligations are satisfied.</td>\n   <td>Measure transaction price including fixed/variable consideration, significant financing and other required adjustments; allocate based on relative stand-alone selling prices.</td>\n   <td>Recognize revenue at a point in time or over time; update progress and variable consideration estimates subject to constraint.</td>\n   <td>Revenue: Dr Receivable/Contract Asset/Cash / Cr Revenue. Advance billing: Dr Cash/Receivable / Cr Contract Liability.</td>\n   <td><div class='formula-box'><b>Expected value</b><div class='fstack'>Σ Probability × Possible consideration</div></div><div class='formula-box'><b>Allocation</b><div class='fstack'>Transaction price × (PO stand-alone price ÷ Total stand-alone prices)</div></div><div class='formula-box'><b>Progress – cost-to-cost</b><div class='fstack'>Costs incurred to date ÷ Total expected costs</div></div><div class='formula-box'><b>Revenue over time</b><div class='fstack'>Allocated transaction price × % progress</div></div><div class='formula-box'><b>Contract asset</b><div class='fstack'>Cumulative revenue recognised − Cumulative amount billed (if positive)</div></div></td>\n   <td>Revenue in SOPL; Contract Assets / Receivables / Contract Liabilities in SOFP.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Contract scope confirm.</li><li><b>Step 2:</b> List distinct POs.</li><li><b>Step 3:</b> Transaction price incl variable/financing adjust.</li><li><b>Step 4:</b> Allocate by relative SSP.</li><li><b>Step 5:</b> For each PO decide point-in-time vs over-time.</li><li><b>Step 6:</b> Compute revenue + contract asset/liability + special return/warranty entries.</li></ol></td>\n   <td><div class='mini-example'><b>Bundle</b><br>Licence SSP 100, support SSP 50, transaction price 120 → allocate 80 to licence and 40 to support.</div><div class='mini-example'><b>Construction</b><br>Price 1m; costs to date 300k; total expected cost 750k → progress 40%; revenue 400k if cost-to-cost faithfully depicts performance.</div><div class='mini-example'><b>Right of return</b><br>Recognise revenue only expected-to-be-kept amount + refund liability for expected returns + right-to-recover asset for returned inventory.</div></td>\n   <td><ul><li>Invoice = revenue</li><li>Cash receipt = revenue</li><li>Variable consideration full amount recognise without constraint</li><li>Multiple obligations ကို one bundle အဖြစ်မစစ်ဘဲတစ်ခါတည်း revenue</li><li>Expected loss on contract treatment ignore</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Step 1 Contract</b></td><td>Approved, rights/payment terms identifiable, commercial substance, collectability probable.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Step 2 Performance obligations</b></td><td>Distinct goods/services identify.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Step 3 Transaction price</b></td><td>Fixed + variable consideration, significant financing, non-cash consideration, consideration payable to customer.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Variable consideration</b></td><td>Expected value or most likely amount; constraint to avoid significant reversal.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Step 4 Allocation</b></td><td>Relative stand-alone selling prices.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Step 5 Recognition</b></td><td>Point in time or over time when control transfers/performance obligation satisfied.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Contract assets/liabilities</b></td><td>Performance vs billing timing differences.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Special topics</b></td><td>Returns/refund liability, warranties, consignment, repurchase, bill-and-hold, contract costs.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Section B/C scenario အတွက် 5-step headings ကို answer structure အဖြစ်သုံးပါ။</div>\n</div>\n"}],"html": null},{"text": "Chapter Overview","kind": "group","children": [{"text": "IFRS 15 ကို 5-step model နဲ့သာစဉ်းစားပါ: contract → performance obligations → transaction price → allocation → recognition when/as obligations satisfied.","kind": "overview","children": [],"html": null}],"html": null},{"text": "Rules / Criteria / Measurement","kind": "group","children": [{"text": "Criteria / Recognition","kind": "topic","children": [{"text": "IFRS 15: apply 5-step model — contract, performance obligations, transaction price, allocation, recognition when/as performance obligations are satisfied.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial Measurement","kind": "topic","children": [{"text": "Measure transaction price including fixed/variable consideration, significant financing and other required adjustments; allocate based on relative stand-alone selling prices.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Subsequent Measurement","kind": "topic","children": [{"text": "Recognize revenue at a point in time or over time; update progress and variable consideration estimates subject to constraint.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Accounting / Journal Treatment","kind": "topic","children": [{"text": "Revenue: Dr Receivable/Contract Asset/Cash / Cr Revenue. Advance billing: Dr Cash/Receivable / Cr Contract Liability.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Financial Statement Impact","kind": "topic","children": [{"text": "Revenue in SOPL; Contract Assets / Receivables / Contract Liabilities in SOFP.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Topic Details","kind": "group","children": [{"text": "Step 1 Contract","kind": "topic","children": [{"text": "Approved, rights/payment terms identifiable, commercia
