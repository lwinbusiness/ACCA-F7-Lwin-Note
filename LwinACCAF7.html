*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
 font-family:Inter,"Noto Sans Myanmar","Myanmar Text","Segoe UI",Arial,sans-serif;
 color:var(--ink);
 background:
  radial-gradient(circle at 14% 12%, rgba(130,210,255,.48), transparent 31%),
  radial-gradient(circle at 84% 18%, rgba(174,235,255,.48), transparent 28%),
  radial-gradient(circle at 50% 100%, rgba(188,226,255,.42), transparent 38%),
  linear-gradient(135deg,var(--bg-a),var(--bg-b) 52%,var(--bg-c));
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;opacity:.85;
 background:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);

 mask-image:linear-gradient(to bottom,rgba(0,0,0,.95),rgba(0,0,0,.42));
}
#viewport{position:fixed;inset:0;overflow:auto;cursor:grab;scroll-behavior:smooth;padding:22px 0 80px}
#viewport.dragging{cursor:grabbing}
#spacer{position:relative}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.node{
 position:absolute;display:flex;align-items:flex-start;gap:10px;
 border:1px solid rgba(123,176,213,.55);
 box-shadow:var(--shadow-soft);border-radius:18px;padding:13px 14px;color:var(--ink);
 font-size:15.5px;line-height:1.72;white-space:pre-line;background:rgba(255,255,255,.82);
 backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
 transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,filter .18s ease;
 overflow:hidden;
}
.node:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#7abff4;opacity:.85}
.node:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:rgba(58,139,209,.72);z-index:8}
.node .txt{flex:1;min-width:0;position:relative;z-index:1}
.node.root{width:430px;background:linear-gradient(135deg,var(--root),var(--root2));color:white;font-weight:900;font-size:17px;border-color:rgba(255,255,255,.65);letter-spacing:.1px}
.node.root:before{background:rgba(255,255,255,.55)}
.node.chapter{width:450px;background:linear-gradient(135deg,#dff0ff,#f6fbff);font-weight:850;border-color:#a9d1ef}
.node.chapter:before{background:#3d91f2}
.node.topic{width:400px;background:linear-gradient(135deg,#ddfbef,#f7fffb);font-weight:800;border-color:#b6e4d0}.node.topic:before{background:#30b987}
.node.group{width:315px;background:linear-gradient(135deg,#ecfaf6,#fbfffd);font-weight:820;border-color:#bddfd4}.node.group:before{background:#54c1a0}
.node.overview{width:620px;background:linear-gradient(135deg,#effaff,#ffffff);border-color:#b8dced}.node.overview:before{background:#68c6f2}
.node.detail{width:480px;background:linear-gradient(135deg,#fbfff0,#ffffff);border-color:#dbe9ae}.node.detail:before{background:#c9db5b}
.node.formula{width:400px;background:linear-gradient(135deg,#fff6bd,#fffdf1);text-align:center;font-weight:820;border-color:#ead67b}.node.formula:before{background:#e8bb2f}
.node.example{width:460px;background:linear-gradient(135deg,#eefbd5,#fbfff5);border-color:#cbe6a1}.node.example:before{background:#8dc852}
.node.step{width:440px;background:linear-gradient(135deg,#e4f4ff,#ffffff);border-color:#b9dbf4}.node.step:before{background:#54aee9}
.node.trap{width:430px;background:linear-gradient(135deg,#fff0ec,#fffafa);border-color:#f2c5ba}.node.trap:before{background:#ef745e}
.node.exam{width:450px;background:linear-gradient(135deg,#f0edff,#ffffff);border-color:#cec7f4}.node.exam:before{background:#8b7be8}
.node.sheet{width:1500px;background:transparent;border:none;box-shadow:none;padding:0;backdrop-filter:none;overflow:visible}.node.sheet:before{display:none}.node.sheet:hover{transform:none;box-shadow:none}
.arrow{
 flex:0 0 28px;width:28px;height:28px;display:grid;place-items:center;
 border:1px solid rgba(74,139,190,.35);border-radius:999px;background:rgba(255,255,255,.78);
 color:#2e6e9f;cursor:pointer;font-weight:950;font-size:18px;line-height:1;
 box-shadow:0 3px 10px rgba(51,117,170,.12);transition:.16s ease;position:relative;z-index:2;
}
.arrow:hover{background:#edf8ff;border-color:#5bacf2;transform:scale(1.06)}
.arrow.open{transform:rotate(90deg)}
.arrow.open:hover{transform:rotate(90deg) scale(1.06)}
.no-kids .arrow{visibility:hidden}
.sheet-wrap{width:1460px;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.sheet-title{padding:15px 18px;background:linear-gradient(135deg,#d7edff,#f4fbff);border-bottom:1px solid #b7d6ea;font-weight:900;font-size:17px;color:#154067;letter-spacing:.15px}
.sheet-subtitle{padding:11px 16px;background:#f1f9ff;border-top:1px solid #c1dced;border-bottom:1px solid #c1dced;font-weight:850;color:#245375}
.sheet-note{padding:12px 16px;background:#f8fdff;border-bottom:1px solid #c5ddea;font-size:13px;color:var(--muted)}
.excel-sheet{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:10px;line-height:1.55}
.excel-sheet th{background:linear-gradient(180deg,#e8f5ff,#d9ecfa);border-right:1px solid #b5d2e3;border-bottom:1px solid #a9c8db;padding:9px;vertical-align:top;text-align:left;font-weight:900;color:#173d5a}
.excel-sheet td{border-right:1px solid #c5dbe8;border-bottom:1px solid #d5e6ef;padding:9px;vertical-align:top;background:rgba(255,255,255,.96);white-space:normal}
.excel-sheet th:last-child,.excel-sheet td:last-child{border-right:none}.excel-sheet tbody tr:last-child td{border-bottom:none}
.excel-sheet tbody tr:nth-child(even) td{background:#f8fcff}
.excel-sheet tbody tr:hover td{background:#f1f9ff}
.master-detail th{width:11.1%}
.topic-detail th:first-child{width:21%}.topic-detail th:nth-child(2){width:49%}.topic-detail th:nth-child(3){width:30%}
.ratio-table th:nth-child(1){width:8%}.ratio-table th:nth-child(2){width:10%}.ratio-table th:nth-child(3){width:12%}.ratio-table th:nth-child(4){width:13%}.ratio-table th:nth-child(5){width:13%}.ratio-table th:nth-child(6){width:16%}.ratio-table th:nth-child(7){width:14%}.ratio-table th:nth-child(8){width:14%}
.conso-table th:nth-child(1){width:7%}.conso-table th:nth-child(2){width:14%}.conso-table th:nth-child(3){width:28%}.conso-table th:nth-child(4){width:20%}.conso-table th:nth-child(5){width:16%}.conso-table th:nth-child(6){width:15%}
.good{background:#f0fae8!important}.bad{background:#fff0ec!important}
.formula-text,.fstack{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.formula-box{margin:5px 0 9px;padding:10px;border:1px solid #dfcc68;background:linear-gradient(135deg,#fff8cc,#fffef5);border-radius:12px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.72)}
.formula-box b{display:block;margin-bottom:4px;color:#6b5600}.fstack{line-height:1.7;font-size:9.8px;color:#17324a}
.mini-example{margin-bottom:8px;padding:9px 10px;background:linear-gradient(135deg,#f1fbe3,#fbfff4);border-left:4px solid #8ec758;border-radius:10px}
.steps-list{margin:0;padding-left:18px}.steps-list li{margin-bottom:6px}
.excel-sheet ul{margin:0;padding-left:16px}
.interpret-box,.exam-focus{padding:12px 16px;background:linear-gradient(135deg,#f4fbff,#ffffff);border-top:1px solid #b7d0dc;font-size:13px;color:#173d5a}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-track{background:#e8f5ff}::-webkit-scrollbar-thumb{background:#8fc5e8;border:3px solid #e8f5ff;border-radius:999px}::-webkit-scrollbar-thumb:hover{background:#64aee0}
@media(max-width:900px){.node.sheet{width:1240px}.sheet-wrap{width:1210px}.excel-sheet{font-size:8.9px}.node{font-size:11.5px}.node.root,.node.chapter{width:320px}}
@media print{html,body{overflow:visible;background:white}body:before{display:none}#viewport{position:static;overflow:visible;padding:0}#stage{position:relative;transform:none!important}.node{box-shadow:none;break-inside:avoid}.arrow{display:none}.sheet-wrap{box-shadow:none}}

/* Click-to-focus enlargement layer */
.node{cursor:zoom-in}
.node.sheet{cursor:zoom-in}
.arrow{cursor:pointer}
#focusOverlay{
 position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;
 padding:30px;isolation:isolate;
}
#focusOverlay.show{display:flex}
#focusBackdrop{
 position:absolute;inset:0;background:rgba(203,232,250,.62);
 backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
}
body.focus-open #viewport{filter:blur(1.2px) saturate(.95)}
#focusCard{
 position:relative;z-index:1;width:min(92vw,980px);max-height:88vh;overflow:auto;
 background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(244,251,255,.97));
 border:1px solid rgba(132,185,222,.72);border-radius:26px;
 box-shadow:0 26px 80px rgba(35,99,150,.24),0 8px 24px rgba(35,99,150,.14);
 padding:28px 30px 30px;transform:scale(.92) translateY(10px);opacity:0;
 transition:transform .22s ease,opacity .22s ease;cursor:default;
}
#focusOverlay.show #focusCard{transform:scale(1) translateY(0);opacity:1}
#focusCard[data-kind="root"]{background:linear-gradient(135deg,#5a9cf8,#79cdfc);color:white;border-color:rgba(255,255,255,.8)}
#focusCard[data-kind="chapter"]{background:linear-gradient(135deg,#d9efff,#ffffff)}
#focusCard[data-kind="topic"]{background:linear-gradient(135deg,#dffbf0,#ffffff)}
#focusCard[data-kind="group"]{background:linear-gradient(135deg,#ecfaf6,#ffffff)}
#focusCard[data-kind="detail"]{background:linear-gradient(135deg,#fbfff0,#ffffff)}
#focusCard[data-kind="formula"]{background:linear-gradient(135deg,#fff5b4,#fffef3)}
#focusCard[data-kind="example"]{background:linear-gradient(135deg,#eefbd5,#ffffff)}
#focusCard[data-kind="step"]{background:linear-gradient(135deg,#e4f4ff,#ffffff)}
#focusCard[data-kind="trap"]{background:linear-gradient(135deg,#fff0ec,#ffffff)}
#focusCard[data-kind="exam"]{background:linear-gradient(135deg,#f0edff,#ffffff)}
#focusCard[data-kind="sheet"]{width:min(96vw,1580px);padding:18px;max-height:90vh;background:rgba(255,255,255,.98)}
#focusCard[data-kind="sheet"] .sheet-wrap{width:100%;box-shadow:none;border-radius:20px}
#focusContent{font-size:18px;line-height:1.8;white-space:pre-line;color:inherit}
#focusCard[data-kind="sheet"] #focusContent{font-size:12px;line-height:1.55;white-space:normal}
#focusCard[data-kind="sheet"] .excel-sheet{font-size:12px;line-height:1.65}
#focusCard[data-kind="sheet"] .excel-sheet th,#focusCard[data-kind="sheet"] .excel-sheet td{padding:12px}
#focusCard[data-kind="sheet"] .sheet-title{font-size:17px;padding:18px 20px}
#focusCard[data-kind="sheet"] .sheet-subtitle{font-size:14px;padding:14px 18px}
#focusKind{
 display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:7px 12px;
 border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(132,185,222,.58);

}

#focusClose,#focusRestore{

 box-shadow:0 8px 18px rgba(35,99,150,.14);font-weight:900;
}
#focusClose{width:38px;height:38px;margin-left:8px;background:#e5f4ff;color:#15436a;font-size:22px;line-height:1}
#focusRestore{height:38px;padding:0 16px;background:#5caae9;color:white;font-size:12px;letter-spacing:.02em}
#focusClose:hover{background:#d3ecff}#focusRestore:hover{background:#3f98dd}
.focus-text{font-weight:650;word-break:break-word}
.focus-help{margin-top:18px;color:#5d7891;font-size:12px;border-top:1px solid rgba(132,185,222,.35);padding-top:12px}
#focusCard[data-kind="root"] .focus-help{color:rgba(255,255,255,.88);border-top-color:rgba(255,255,255,.28)}
@media(max-width:800px){#focusOverlay{padding:12px}#focusCard{width:96vw;max-height:92vh;padding:20px}#focusContent{font-size:15px}#focusCard[data-kind="sheet"] .excel-sheet{font-size:9.2px}#focusRestore{display:none}}

.node.chapter.front-90{

lement.</td>\n   <td><div class='formula-box'><b>No single calculation</b><div class='fstack'>ဒီ chapter က formula-heavy မဟုတ်ဘဲ definition → recognition → measurement → presentation reasoning ကို အဓိကစစ်တယ်။</div></div></td>\n   <td>Determines whether an item belongs in SOFP, SOPL, OCI, Equity or disclosure only.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Scenario ထဲက economic event ကို ပထမဆုံး identify လုပ်ပါ။</li><li><b>Step 2:</b> ဘယ် financial statement element ကို ထိသလဲ ခွဲပါ။</li><li><b>Step 3:</b> Specific IFRS/IAS ရှိ/မရှိ စစ်ပါ။ ရှိရင် specific standard က Framework ထက် priority ရှိတယ်။</li><li><b>Step 4:</b> Specific rule မရှင်းရင် relevance, faithful representation, substance over form ကို သုံးပြီး treatment ကို justify လုပ်ပါ။</li><li><b>Step 5:</b> Financial statement effect ကို SOFP / SOPL / OCI / disclosure အလိုက် conclude လုပ်ပါ။</li></ol></td>\n   <td><div class='mini-example'><b>Internally generated brand</b><br>Brand က future benefits ရနိုင်ပေမယ့် internally generated value ကို reliable/faithful measurement မရနိုင်တာကြောင့် arbitrary value ထည့်တာ မသင့်။ Exam မှာ &#x27;future benefit ရှိတယ်&#x27; တစ်ချက်တည်းနဲ့ asset မလုပ်ပါနဲ့။</div><div class='mini-example'><b>Going concern warning</b><br>Entity က liquidation ဆုံးဖြတ်ပြီးသားဆိုရင် normal going-concern carrying amounts ကို မျက်စိမှိတ်မသုံးရ။ Asset recoverability နဲ့ liability settlement basis ကို ပြန်စဉ်းစားရမယ်။</div></td>\n   <td><ul><li>Framework definition တစ်ကြောင်းအလွတ်ကျက်ပြီး application မရေးခြင်း</li><li>Prudence = assets အမြဲလျှော့ပြခြင်း လို့မှားယူခြင်း</li><li>Accrual = cash basis နဲ့ရောခြင်း</li><li>Specific IFRS ရှိတာကို Framework နဲ့ override လုပ်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Financial statements elements</b></td><td>Asset, Liability, Equity, Income, Expense ကို definition တင်မဟုတ်ဘဲ transaction တစ်ခုက ဘယ် element ကိုထိသလဲ ခွဲတတ်ရမယ်။</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Recognition</b></td><td>Item ကို financial statements ထဲသွင်းခြင်းက useful information ပေးနိုင်ရမယ်။ Measurement uncertainty များလွန်းရင် faithful representation ကို ထိခိုက်နိုင်တယ်။</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Measurement</b></td><td>Historical cost, Fair Value, Value in Use, Current Cost စတဲ့ measurement bases ကို context အလိုက်ခွဲပါ။</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Qualitative characteristics</b></td><td>Fundamental = Relevance + Faithful Representation. Enhancing = Comparability, Verifiability, Timeliness, Understandability.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Going concern</b></td><td>Entity က foreseeable future ဆက်လက်လည်ပတ်မယ်လို့ယူဆခြင်း။ Going concern မသင့်တော့ရင် breakup / liquidation basis နီးစပ်တဲ့ measurement ကို စဉ်းစားရမယ်။</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Accrual basis</b></td><td>Cash ဝင်/ထွက်ချိန်မဟုတ်ဘဲ transaction ဖြစ်ပေါ်ချိန်မှာ recognition လုပ်တယ်။ Expense နဲ့ related revenue ကို period တူအောင် match လုပ်တယ်။</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Prudence &amp; substance over form</b></td><td>Uncertainty အောက်မှာ caution သုံးပေမယ့် deliberate understatement မလုပ်ရ။ Legal form ထက် commercial substance ကိုကြည့်ရမယ်။</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Regulatory structure</b></td><td>IFRS Foundation → IASB → IFRS Interpretations Committee. Standard setting, oversight နဲ့ interpretation functions ကွဲတယ်။</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Sustainability</b></td><td>IFRS S1/S2 အောက်မှာ Governance, Strategy, Risk Management, Metrics &amp; Targets ကို disclosure framework အဖြစ်နားလည်ပါ။</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Section A/B မှာ definitions, qualitative characteristics, substance over form; written scenario မှာ WHY ကို ရှင်းပြနိုင်ရမယ်။</div>\n</div>\n"}],"html": null},{"text": "Chapter Overview","kind": "group","children": [{"text": "ဒီ Chapter က FR တစ်ဘာသာလုံးရဲ့ reasoning base ဖြစ်တယ်။ Rule တစ်ခုကို အလွတ်ကျက်တာထက် Asset / Liability / Income / Expense ဆိုတာဘာလဲ၊ information က Relevant နဲ့ Faithful Representation ဖြစ်ဖို့ဘာလိုလဲ၊ Going Concern နဲ့ Accrual Basis ဘာကြောင့်သုံးရလဲဆိုတာကို နားလည်ရမယ်။","kind": "overview","children": [],"html": null}],"html": null},{"text": "Rules / Criteria / Measurement","kind": "group","children": [{"text": "Criteria / Recognition","kind": "topic","children": [{"text": "Framework chapter — identify Asset / Liability / Equity / Income / Expense and apply recognition only when useful, relevant information can be faithfully represented.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial Measurement","kind": "topic","children": [{"text": "N/A — this is the conceptual basis used by specific IFRS/IAS standards.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Subsequent Measurement","kind": "topic","children": [{"text": "Use the applicable specific standard. Framework supports judgement when no specific rule directly resolves the issue.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Accounting / Journal Treatment","kind": "topic","children": [{"text": "No standard journal entry. First identify the economic su ce & substance over form","kind": "topic","children": [{"text": "Uncertainty အောက်မှာ caution သုံးပေမယ့် deliberate understatement မလုပ်ရ။ Legal form ထက် commercial substance ကိုကြည့်ရမယ်။","kind": "detail","children": [],"html": null}],"html": null},{"text": "Regulatory structure","kind": "topic","children": [{"text": "IFRS Foundation → IASB → IFRS Interpretations Committee. Standard setting, oversight နဲ့ interpretation functions ကွဲတယ်။","kind": "detail","children": [],"html": null}],"html": null},{"text": "Sustainability","kind": "topic","children": [{"text": "IFRS S1/S2 အောက်မှာ Governance, Strategy, Risk Management, Metrics & Targets ကို disclosure framework အဖြစ်နားလည်ပါ။","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Formula / Working Map","kind": "group","children": [{"text": "No single calculation","kind": "formula","children": [{"text": "ဒီ chapter က formula-heavy မဟုတ်ဘဲ definition → recognition → measurement → presentation reasoning ကို အဓိကစစ်တယ်။","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Exam Thinking Process","kind": "group","children": [{"text": "Step 1 — Scenario ထဲက economic event ကို ပထမဆုံး identify လုပ်ပါ။","kind": "step","children": [],"html": null},{"text": "Step 2 — ဘယ် financial statement element ကို ထိသလဲ ခွဲပါ။","kind": "step","children": [],"html": null},{"text": "Step 3 — Specific IFRS/IAS ရှိ/မရှိ စစ်ပါ။ ရှိရင် specific standard က Framework ထက် priority ရှိတယ်။","kind": "step","children": [],"html": null},{"text": "Step 4 — Specific rule မရှင်းရင် relevance, faithful representation, substance over form ကို သုံးပြီး treatment ကို justify လုပ်ပါ။","kind": "step","children": [],"html": null},{"text": "Step 5 — Financial statement effect ကို SOFP / SOPL / OCI / disclosure အလိုက် conclude လုပ်ပါ။","kind": "step","children": [],"html": null}],"html": null},{"text": "Examples / Application","kind": "group","children": [{"text": "Internally generated brand","kind": "example","children": [{"text": "Brand က future benefits ရနိုင်ပေမယ့် internally generated value ကို reliable/faithful measurement မရနိုင်တာကြောင့် arbitrary value ထည့်တာ မသင့်။ Exam မှာ 'future benefit ရှိတယ်' တစ်ချက်တည်းနဲ့ asset မလုပ်ပါနဲ့။","kind": "detail","children": [],"html": null}],"html": null},{"text": "Going concern warning","kind": "example","children": [{"text": "Entity က liquidation ဆုံးဖြတ်ပြီးသားဆိုရင် normal going-concern carrying amounts ကို မျက်စိမှိတ်မသုံးရ။ Asset recoverability နဲ့ liability settlement basis ကို ပြန်စဉ်းစားရမယ်။","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Common Mistakes / Exam Traps","kind": "group","children": [{"text": "Framework definition တစ်ကြောင်းအလွတ်ကျက်ပြီး application မရေးခြင်း","kind": "trap","children": [],"html": null},{"text": "Prudence = assets အမြဲလျှော့ပြခြင်း လို့မှားယူခြင်း","kind": "trap","children": [],"html": null},{"text": "Accrual = cash basis နဲ့ရောခြင်း","kind": "trap","children": [],"html": null},{"text": "Specific IFRS ရှိတာကို Framework နဲ့ override လုပ်ခြင်း","kind": "trap","children": [],"html": null}],"html": null},{"text": "Exam Focus","kind": "group","children": [{"text": "Section A/B မှာ definitions, qualitative characteristics, substance over form; written scenario မှာ WHY ကို ရှင်းပြနိုင်ရမယ်။","kind": "exam","children": [],"html": null}],"html": null}],"html": null},{"text": "Chapter 2: IFRS 13 Fair Value + IFRS 18 Presentation & Disclosure","kind": "chapter","children": [{"text": "Deep Excel-style Study Sheets","kind": "group","children": [{"text": "Deep Master Sheet","kind": "sheet","children": [],"html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 2 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IFRS 13: fair value uses a market-participant exit-price concept. IFRS 18: classify income/expenses into presentation categories and provide required subtotals/disaggregation.</td>\n   <td>IFRS 13: use market evidence / valuation inputs at the measurement date. IFRS 18: not an asset-measurement standard; it governs presentation and disclosure.</td>\n   <td>IFRS 13: remeasure whenever the related standard requires FV. IFRS 18: maintain consistent category, aggregation/disaggregation and note presentation.</td>\n   <td>Depends on the underlying standard. IFRS 18 generally changes presentation, not recognition by itself.</td>\n   <td><div class='formula-box'><b>Present value (basic)</b><div class='fstack'>PV = Future cash flow ÷ (1 + r)^n</div></div><div class='formula-box'><b>Fair value adjustment</b><div class='fstack'>FV adjustment = Fair value at measurement date − existing carrying amount</div></div></td>\n   <td>IFRS 18 affects SOPL categories/subtotals, OCI, SOFP presentation and Notes. IFRS 13 affects carrying amounts where another standard requires fair value.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Market participant view သို့ entity-specific view လား စစ်ပါ။</li><li><b>Step 2:</b> Asset type အလိုက် highest-and-best-use လို/မလို ခွဲပါ။</li><li><b>Step 3:</b> Input source ကို Level 1/2/3 classify လုပ်ပါ။</li><li><b>Step 4:</b> Presentation question ဆိုရင် income/expense nature ကို operating/investing/financing နဲ့ map လုပ်ပါ။</li></ol></td>\n   <td><div class='mini-example'><b>Factory land with condo potential</b><br>Factory ဆက်သုံးမယ်ဆိုတဲ့ management intent တစ်ခုတည်းမဟုတ်ဘဲ market participants က legally/financially feasible condo redevelopment ကို ပိုတန်ဖိုးထားရင် higher use ကို Fair Value ထဲထည့်စဉ်းစားနိုင်တယ်။</div><div class='mini-example'><b>Quoted share</b><br>Active exchange မှာ identical share quoted price ရှိရင် Level 1 input ဖြစ်ပြီး model-based estimate ထက် priority ပိုမြင့်တယ်။</div></td>\n   <td><ul><li>Fair Value = management&#x27;s preferred value လို့ယူခြင်း</li><li>Highest and best use ကို entity intent နဲ့တူတယ်လို့ယူခြင်း</li><li>Level 3 = unreliable, therefore prohibited လို့မှားယူခြင်း</li><li>Presentation category နဲ့ cash-flow category ကို အလိုအလျောက်တူတယ်လို့ယူခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Fair value definition</b></td><td>Measurement date မှာ orderly transaction တစ်ခုအတွင်း asset ရောင်းရင်ရမယ့် price သို့ liability transfer လုပ်ရင်ပေးရမယ့် price — market participants perspective.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Highest and best use</b></td><td>Non-financial asset အတွက် physically possible, legally permissible, financially feasible ဖြစ်တဲ့ best use ကိုယူတယ်။</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Principal / most advantageous market</b></td><td>Principal market ရှိရင်အဲဒီ market; မရှိမှ most advantageous market စဉ်းစားတယ်။</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Fair value hierarchy</b></td><td>Level 1 = quoted active market inputs; Level 2 = observable other inputs; Level 3 = unobservable valuation inputs.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Presentation logic</b></td><td>SOPL/OCI line items ကို operating, investing, financing logic နဲ့ classify လုပ်ရာမှာ transaction nature ကိုကြည့်ရမယ်။</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Disaggregation &amp; disclosure</b></td><td>Material information ကို meaningful categories ခွဲပြပြီး users နားလည်နိုင်အောင် presentation လုပ်ရမယ်။</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Fair value measurement က consolidation, PPE revaluation, investment property, financial instruments နဲ့ ချိတ်မေးနိုင်တယ်။</div>\n</div>\n"}],"html": null},{"text": "Chapter Overview","kind": "group","children": [{"text": "Fair Value ဆိုတာ entity-specific value မဟုတ်ဘဲ market participant perspective က exit price ဖြစ်တယ်။ Presentation အပိုင်းမှာ financial performance ကို operating / investing / financing စတဲ့ categories နဲ့တစ်ပြေးညီဖော်ပြနိုင်ဖို့ logic ကိုသိရမယ်။","kind": "overview","children": [],"html": null}],"html": null},{"text": "Rules / Criteria / Measurement","kind": "group","children": [{"text": "Criteria / Recognition","kind": "topic","children": [{"text": "IFRS 13: fair value uses a market-participant exit-price concept. IFRS 18: classify income/expenses into presentation categories and provide required subtotals/disaggregation.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial Measurement","kind": "topic","children": [{"text": "IFRS 13: use market evidence / valuation inputs at the measurement date. IFRS 18: not an asset-measurement standard; it governs presentation and disclosure.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Subsequent Measurement","kind": "topic","children": [{"text": "IFRS 13: remeasure whenever the related standard requires FV. IFRS 18: maintain consistent category, aggregation/disaggregation and note presentation.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Accounting / Journal Treatment","kind": "topic","children": [{"text": "Depends on the underlying standard. IFRS 18 generally changes presentation, not recognition by itself.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Financial Statement Impact","kind": "topic","children": [{"text": "IFRS 18 affects SOPL categories/subtotals, OCI, SOFP presentation and Notes. IFRS 13 affects carrying amounts where another standard requires fair value.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Topic Details","kind": "group","children": [{"text": "Fair value definition","kind": "topic","children": [{"text": "Measurement date မှာ orderly transaction တစ်ခုအတွင်း asset ရောင်းရင်ရမယ့် price သို့ liability transfer လုပ်ရင်ပေးရမယ့် price — market participants perspective.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Highest and best use","kind": "topic","children": [{"text": "Non-financial asset အတွက် physically possible, legally permissible, financially feasible ဖြစ်တဲ့ best use ကိုယူတယ်။","kind": "detail","children": [],"html": null}],"html": null},{"text": "Principal / most advantageous market","kind": "topic","children": [{"text": "Principal market ရှိရင်အဲဒီ market; မရှိမှ most advantageous market စဉ်းစားတယ်။","kind": "detail","children": [],"html": null}],"html": null},{"text": "Fair value hierarchy","kind": "topic","children": [{"text": "Level 1 = quoted active market inputs; Level 2 = observable other inputs; Level 3 = unobservable valuation inputs.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Presentation logic","kind": "topic","children": [{"text": "SOPL/OCI line items ကို operating, investing, financing logic နဲ့ classify လုပ်ရာမှာ transaction nature ကိုကြည့်ရမယ်။","kind": "detail","children": [],"html": null}],"html": null},{"text": "Disaggregation & disclosure","kind": "topic","children": [{"text": "Material information ကို meaningful categories ခွဲပြပြီး users နားလည်နိုင်အောင် presentation လုပ်ရမယ်။","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Formula / Working Map","kind": "group","children": [{"text": "Present value (basic)","kind": "formula","children": [{"text": "PV = Future cash flow ÷ (1 + r)^n","kind": "detail","children": [],"html": null}],"html": null},{"text": "Fair value adjustment","kind": "formula","children": [{"text": "FV adjustment = Fair value at measurement date − existing carrying amount","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Exam Thinking Process","kind": "group","children": [{"text": "Step 1 — Market participant view သို့ entity-specific view လား စစ်ပါ။","kind": "step","children": [],"html": null},{"text": "Step 2 — Asset type အလိုက် highest-and-best-use လို/မလို ခွဲပါ။","kind": "step","children": [],"html": null},{"text": "Step 3 — Input source ကို Level 1/2/3 classify လုပ်ပါ။","kind": "step","children": [],"html": null},{"text": "Step 4 — Presentation question ဆိုရင် income/expense nature ကို operating/investing/financing နဲ့ map လုပ်ပါ။","kind": "step","children": [],"html": null}],"html": null},{"text": "Examples / Application","kind": "group","children": [{"text": "Factory land with condo potential","kind": "example","children": [{"text": "Factory ဆက်သုံးမယ်ဆိုတဲ့ management intent တစ်ခုတည်းမဟုတ်ဘဲ market participants က legally/financially feasible condo redevelopment ကို ပိုတန်ဖိုးထားရင် higher use ကို Fair Value ထဲထည့်စဉ်းစားနိုင်တယ်။","kind": "detail","children": [],"html": null}],"html": null},{"text": "Quoted share","kind": "example","children": [{"text": "Active exchange မှာ identical share quoted price ရှိရင် Level 1 input ဖြစ်ပြီး model-based estimate ထက် priority ပိုမြင့်တယ်။","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Common Mistakes / Exam Traps","kind": "group","children": [{"text": "Fair Value = management's preferred value လို့ယူခြင်း","kind": "trap","children": [],"html": null},{"text": "Highest and best use ကို entity intent နဲ့တူတယ်လို့ယူခြင်း","kind": "trap","children": [],"html": null},{"text": "Level 3 = unreliable, therefore prohibited လို့မှားယူခြင်း","kind": "trap","children": [],"html": null},{"text": "Presentation category နဲ့ cash-flow category ကို အလိုအလျောက်တူတယ်လို့ယူခြင်း","kind": "trap","children": [],"html": null}],"html": null},{"text": "Exam Focus","kind": "group","children": [{"text": "Fair value measurement က consolidation, PPE revaluation, investment property, financial instruments နဲ့ ချိတ်မေးနိုင်တယ်။","kind": "exam","children": [],"html": null}],"html": null}],"html": null},{"text": "Chapter 3: IAS 16 – Property, Plant and Equipment (PPE)","kind": "chapter","children": [{"text": "Deep Excel-style Study Sheets","kind": "group","children": [{"text": "Deep Master Sheet","kind": "sheet","children": [],"html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 3 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 16 recognition: future economic benefits probable + cost reliably measurable. Subsequent expenditure uses the same recognition logic.</td>\n   <td>Cost = purchase price net of trade discounts/rebates + import duties/non-refundable taxes + directly attributable costs + eligible IAS 23 borrowing costs + relevant restoration obligation.</td>\n   <td>Policy choice by class: Cost Model OR Revaluation Model. Depreciate significant components separately; review useful life/residual value/method prospectively.</td>\n   <td>Purchase: Dr PPE / Cr Cash or Payable. Depreciation: Dr Expense / Cr Accumulated Depreciation. Revaluation increase normally Dr PPE / Cr OCI-Revaluation Surplus, subject to reversals.</td>\n   <td><div class='formula-box'><b>Straight-line depreciation</b><div class='fstack'>(Cost − Residual value) ÷ Useful life</div></div><div class='formula-box'><b>Reducing-balance depreciation</b><div class='fstack'>Opening carrying amount × Depreciation rate</div></div><div class='formula-box'><b>Units-of-production</b><div class='fstack'>(Cost − Residual value) ÷ Total expected units × Units produced</div></div><div class='formula-box'><b>Carrying amount</b><div class='fstack'>Cost or revalued amount − Accumulated depreciation − Accumulated impairment</div></div><div class='formula-box'><b>Disposal gain/loss</b><div class='fstack'>Disposal proceeds − Carrying amount at disposal date</div></div><div class='formula-box'><b>Revised annual depreciation</b><div class='fstack'>Carrying amount at estimate-change date − revised residual value, divided by remaining useful life</div></div></td>\n   <td>PPE appears in SOFP at carrying amount. Depreciation/impairment usually affects SOPL. Revaluation surplus usually OCI/Equity. Disposal gain/loss affects SOPL.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Asset ready for use ဖြစ်ပြီလား?</li><li><b>Step 2:</b> Cost item တစ်ခုချင်းကို directly attributable / abnormal / operating cost လား classify လုပ်ပါ။</li><li><b>Step 3:</b> Significant components ရှိ/မရှိစစ်ပါ။</li><li><b>Step 4:</b> Depreciation start date, useful life, residual value, method ကိုသတ်မှတ်ပါ။</li><li><b>Step 5:</b> Revaluation/disposal ဖြစ်ရင် CA ကို event date အထိ update အရင်လုပ်ပါ။</li></ol></td>\n   <td><div class='mini-example'><b>Machine cost</b><br>Machine price 100,000; trade discount 5,000; delivery 3,000; installation 4,000; training 2,000. PPE cost = 102,000. Training 2,000 → expense.</div><div class='mini-example'><b>Estimate change</b><br>CA at 1 Jan = 60,000; revised residual 6,000; remaining life 3 years → new annual depreciation = 18,000 prospectively.</div><div class='mini-example'><b>Disposal</b><br>CA 30,000, proceeds 35,000 → disposal gain 5,000 in SOPL.</div></td>\n   <td><ul><li>Recoverable VAT ကို asset cost ထဲထည့်ခြင်း</li><li>Training / initial operating losses ကို capitalise လုပ်ခြင်း</li><li>Depreciation ကို purchase date မှာစခြင်း instead of available-for-use</li><li>Useful life change ကို retrospective ပြန်ရေးခြင်း</li><li>Revaluation increase အားလုံး SOPL သွင်းခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Recognition</b></td><td>Future economic benefits probable + cost reliably measurable.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Initial cost</b></td><td>Purchase price net of trade discount + import duty + non-refundable taxes + directly attributable transport/installation/site preparation/professional/testing costs + initial dismantling/restoration estimate.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Exclude from cost</b></td><td>Admin/general overhead, initial operating loss, staff training, repair &amp; maintenance, insurance, day-to-day operating cost.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Subsequent expenditure</b></td><td>Future benefits တိုးစေတဲ့ major replacement/overhaul/capacity-quality-life improvement → capitalise; routine repair → expense.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Component accounting</b></td><td>Significant parts with different useful lives → separate depreciation.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Depreciation start/stop</b></td><td>Ready/available for use မှာ start; held for sale classification / derecognition ပေါ်မူတည်၍ cease.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Changes in estimates</b></td><td>Useful life, residual value, depreciation method change → prospective under IAS 8.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Revaluation</b></td><td>Class of assets ကို consistent basis နဲ့ revalue. Increase usually OCI/revaluation surplus, decrease usually SOPL subject to previous surplus/reversal.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Disposal</b></td><td>Profit/loss = proceeds − carrying amount; derecognise cost and accumulated depreciation.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Section A/B အပြင် Section C adjustment တစ်ခုအဖြစ် cost, depreciation, revaluation, disposal ကို မကြာခဏချိတ်မေးနိုင်တယ်။</div>\n</div>\n"}],"html": null},{"text": "Chapter Overview","kind": "group","children": [{"text": "PPE မှာ အဓိကမေးတာက recognition, initial cost, capital vs revenue expenditure, depreciation, component accounting, revaluation, disposal ဖြစ်တယ်။ Source notes မှာ recognition criteria, cost components, depreciation methods, life/scrap/method changes, revaluation နဲ့ complex assets ကို တစ်ဆက်တည်းဖော်ပြထားတယ်။","kind": "overview","children": [],"html": null}],"html": null},{"text": "Rules / Criteria / Measurement","kind": "group","children": [{"text": "Criteria / Recognition","kind": "topic","children": [{"text": "IAS 16 recognition: future economic benefits probable + cost reliably measurable. Subsequent expenditure uses the same recognition logic.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial Measurement","kind": "topic","children": [{"text": "Cost = purchase price net of trade discounts/rebates + import duties/non-refundable : "Future benefits တိုးစေတဲ့ major replacement/overhaul/capacity-quality-life improvement → capitalise; routine repair → expense.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Component accounting","kind": "topic","children": [{"text": "Significant parts with different useful lives → separate depreciation.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Depreciation start/stop","kind": "topic","children": [{"text": "Ready/available for use မှာ start; held for sale classification / derecognition ပေါ်မူတည်၍ cease.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Changes in estimates","kind": "topic","children": [{"text": "Useful life, residual value, depreciation method change → prospective under IAS 8.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Revaluation","kind": "topic","children": [{"text": "Class of assets ကို consistent basis နဲ့ revalue. Increase usually OCI/revaluation surplus, decrease usually SOPL subject to previous surplus/reversal.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Disposal","kind": "topic","children": [{"text": "Profit/loss = proceeds − carrying amount; derecognise cost and accumulated depreciation.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Formula / Working Map","kind": "group","children": [{"text": "Straight-line depreciation","kind": "formula","children": [{"text": "(Cost − Residual value) ÷ Useful life","kind": "detail","children": [],"html": null}],"html": null},{"text": "Reducing-balance depreciation","kind": "formula","children": [{"text": "Opening carrying amount × Depreciation rate","kind": "detail","children": [],"html": null}],"html": null},{"text": "Units-of-production","kind": "formula","children": [{"text": "(Cost − Residual value) ÷ Total expected units × Units produced","kind": "detail","children": [],"html": null}],"html": null},{"text": "Carrying amount"
