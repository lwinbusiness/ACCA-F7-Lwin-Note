 disposal gain 5,000 in SOPL.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Common Mistakes / Exam Traps","kind": "group","children": [{"text": "Recoverable VAT ကို asset cost ထဲထည့်ခြင်း","kind": "trap","children": [],"html": null},{"text": "Training / initial operating losses ကို capitalise လုပ်ခြင်း","kind": "trap","children": [],"html": null},{"text": "Depreciation ကို purchase date မှာစခြင်း instead of available-for-use","kind": "trap","children": [],"html": null},{"text": "Useful life change ကို retrospective ပြန်ရေးခြင်း","kind": "trap","children": [],"html": null},{"text": "Revaluation increase အားလုံး SOPL သွင်းခြင်း","kind": "trap","children": [],"html": null}],"html": null},{"text": "Exam Focus","kind": "group","children": [{"text": "Section A/B အပြင် Section C adjustment တစ်ခုအဖြစ် cost, depreciation, revaluation, disposal ကို မကြာခဏချိတ်မေးနိုင်တယ်။","kind": "exam","children": [],"html": null}],"html": null}],"html": null},{"text": "Chapter 4: IAS 40 – Investment Property","kind": "chapter","children": [{"text": "Deep Excel-style Study Sheets","kind": "group","children": [{"text": "Deep Master Sheet","kind": "sheet","children": [],"html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 4 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 40 classification: property held to earn rentals and/or for capital appreciation, not owner-occupied and not held for ordinary-course sale.</td>\n   <td>Initially at cost, including transaction costs / directly attributable expenditure.</td>\n   <td>Choose Cost Model or Fair Value Model. Under FV model: remeasure to FV each reporting date and do not depreciate.</td>\n   <td>FV model increase: Dr Investment Property / Cr P&amp;L FV Gain. Decrease: Dr P&amp;L FV Loss / Cr Investment Property.</td>\n   <td><div class='formula-box'><b>Fair value gain/loss</b><div class='fstack'>Closing Fair Value − Carrying amount immediately before remeasurement</div></div></td>\n   <td>Investment Property in SOFP. FV changes under FV model in SOPL. Under cost model, depreciation/impairment apply.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Property purpose ကို identify လုပ်ပါ။</li><li><b>Step 2:</b> Own use / rent / capital appreciation / sale development ဘယ်ဟာလဲ?</li><li><b>Step 3:</b> Chosen model ကို check လုပ်ပါ။</li><li><b>Step 4:</b> Transfer ဆိုရင် change-of-use date မှာ carrying amount/FV treatment ကို determine လုပ်ပါ။</li></ol></td>\n   <td><div class='mini-example'><b>Rental building</b><br>Building ကို third parties ထံ long-term rental ပေးထား → IAS 40 IP.</div><div class='mini-example'><b>Head office</b><br>Company ကိုယ်တိုင်သုံးတဲ့ head office → IAS 16, rental potential ရှိတာတင်နဲ့ IAS 40 မဖြစ်။</div></td>\n   <td><ul><li>Property ဆိုတိုင်း IAS 40 လို့ယူခြင်း</li><li>Fair value model သုံးပြီး depreciation ထပ်လုပ်ခြင်း</li><li>Management intention တစ်ခုတည်းနဲ့ transfer လုပ်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Classification</b></td><td>Rental income and/or capital appreciation purpose → IAS 40. Owner occupied → IAS 16. Held for sale in ordinary business → IAS 2.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Initial measurement</b></td><td>Cost including transaction costs.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Cost model</b></td><td>IAS 16 style depreciation/impairment approach.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Fair value model</b></td><td>Fair value changes → SOPL; normally no depreciation under FV model.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Transfers</b></td><td>Change in use evidence ရှိမှ IAS 16 ↔ IAS 40 ↔ IAS 2 transfer.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Mixed-use property</b></td><td>Separately saleable/leasable components ဖြစ်ရင် split; otherwise significance of owner-occupied portion matters.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Classification + subsequent measurement + transfer adjustments ကို အဓိကစစ်တယ်။</div>\n</div>\n"}],"html": null},{"text": "Chapter Overview","kind": "group","children": [{"text": "Investment Property (IP) ကို owner-occupied PPE နဲ့ development/sale inventory ကနေ ခွဲတတ်ဖို့က အရေးကြီးဆုံး။ Rental income သို့ capital appreciation အတွက် held ဖြစ်ရမယ်။","kind": "overview","children": [],"html": null}],"html": null},{"text": "Rules / Criteria / Measurement","kind": "group","children": [{"text": "Criteria / Recognition","kind": "topic","children": [{"text": "IAS 40 classification: property held to earn rentals and/or for capital appreciation, not owner-occupied and not held for ordinary-course sale.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial Measurement","kind": "topic","children": [{"text": "Initially at cost, including transaction costs / directly attributable expenditure.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Subsequent Measurement","kind": "topic","children": [{"text": "Choose Cost Model or Fair Value Model. Under FV model: remeasure to FV each reporting date and do not depreciate.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Accounting / Journal Treatment","kind": "topic","children": [{"text": "FV model increase: Dr Investment Property / Cr P&L FV Gain. Decrease: Dr P&L FV Loss / Cr Investment Property.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Financial Statement Impact","kind": "topic","children": [{"text": "Investment Property in SOFP. FV changes under FV model in SOPL. Under cost model, depreciation/impairment apply.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Topic Details","kind": "group","children": [{"text": "Classification","kind": "topic","children": [{"text": "Rental income and/or capital appreciation purpose → IAS 40. Owner occupied → IAS 16. Held for sale in ordinary business → IAS 2.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial measurement","kind": "topic","children": [{"text": "Cost including transaction costs.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Cost model","kind": "topic","children": [{"text": "IAS 16 style depreciation/impairment approach.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Fair value model","kind": "topic","children": [{"text": "Fair value changes → SOPL; normally no depreciation under FV model.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Transfers","kind": "topic","children": [{"text": "Change in use evidence ရှိမှ IAS 16 ↔ IAS 40 ↔ IAS 2 transfer.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Mixed-use property","kind": "topic","children": [{"text": "Separately saleable/leasable components ဖြစ်ရင် split; otherwise significance of owner-occupied portion matters.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Formula / Working Map","kind": "group","children": [{"text": "Fair value gain/loss","kind": "formula","children": [{"text": "Closing Fair Value − Carrying amount immediately before remeasurement","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Exam Thinking Process","kind": "group","children": [{"text": "Step 1 — Property purpose ကို identify လုပ်ပါ။","kind": "step","children": [],"html": null},{"text": "Step 2 — Own use / rent / capital appreciation / sale development ဘယ်ဟာလဲ?","kind": "step","children": [],"html": null},{"text": "Step 3 — Chosen model ကို check လုပ်ပါ။","kind": "step","children": [],"html": null},{"text": "Step 4 — Transfer ဆိုရင် change-of-use date မှာ carrying amount/FV treatment ကို determine လုပ်ပါ။","kind": "step","children": [],"html": null}],"html": null},{"text": "Examples / Application","kind": "group","children": [{"text": "Rental building","kind": "example","children": [{"text": "Building ကို third parties ထံ long-term rental ပေးထား → IAS 40 IP.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Head office","kind": "example","children": [{"text": "Company ကိုယ်တိုင်သုံးတဲ့ head office → IAS 16, rental potential ရှိတာတင်နဲ့ IAS 40 မဖြစ်။","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Common Mistakes / Exam Traps","kind": "group","children": [{"text": "Property ဆိုတိုင်း IAS 40 လို့ယူခြင်း","kind": "trap","children": [],"html": null},{"text": "Fair value model သုံးပြီး depreciation ထပ်လုပ်ခြင်း","kind": "trap","children": [],"html": null},{"text": "Management intention တစ်ခုတည်းနဲ့ transfer လုပ်ခြင်း","kind": "trap","children": [],"html": null}],"html": null},{"text": "Exam Focus","kind": "group","children": [{"text": "Classification + subsequent measurement + transfer adjustments ကို အဓိကစစ်တယ်။","kind": "exam","children": [],"html": null}],"html": null}],"html": null},{"text": "Chapter 5: IAS 23 – Borrowing Costs","kind": "chapter","children": [{"text": "Deep Excel-style Study Sheets","kind": "group","children": [{"text": "Deep Master Sheet","kind": "sheet","children": [],"html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 5 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 23 applies to borrowing costs directly attributable to a qualifying asset that takes a substantial period to get ready for use or sale.</td>\n   <td>Specific borrowing: actual eligible borrowing costs less temporary investment income. General borrowing: capitalization rate × weighted qualifying expenditure.</td>\n   <td>Capitalize only during eligible construction period; suspend during extended abnormal interruptions; cease when substantially all preparation activities are complete.</td>\n   <td>Dr Qualifying Asset / Cr Interest Payable or Cash for capitalized portion; non-eligible borrowing cost → finance expense.</td>\n   <td><div class='formula-box'><b>Specific borrowing capitalisation</b><div class='fstack'>Actual eligible borrowing cost − relevant temporary investment income</div></div><div class='formula-box'><b>General borrowing capitalisation</b><div class='fstack'>Weighted-average capitalisation rate × weighted qualifying expenditure</div></div><div class='formula-box'><b>Simple interest</b><div class='fstack'>Principal × annual rate × time fraction</div></div></td>\n   <td>Capitalized amount increases asset cost in SOFP; non-capitalized interest affects financing/finance expense in SOPL.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Asset qualifying asset ဟုတ်/မဟုတ်စစ်ပါ။</li><li><b>Step 2:</b> Loan specific/general ခွဲပါ။</li><li><b>Step 3:</b> Start/suspend/cease dates timeline ဆွဲပါ။</li><li><b>Step 4:</b> Eligible period ပေါ် interest တွက်ပါ။</li><li><b>Step 5:</b> Capitalised amount နဲ့ SOPL finance cost ကို split လုပ်ပါ။</li></ol></td>\n   <td><div class='mini-example'><b>Specific loan</b><br>Loan 1,000,000 @ 8%; eligible construction 9 months → gross eligible interest 60,000 before any temporary investment adjustment.</div><div class='mini-example'><b>Suspension</b><br>Strike ကြောင့် 2 months abnormal stop ဖြစ်ရင် those months borrowing cost ကို expense လုပ်နိုင်ပြီး capitalise မလုပ်ရ။</div></td>\n   <td><ul><li>Loan drawdown date ကနေ automatically capitalise လုပ်ခြင်း</li><li>Normal technical/administrative delay နဲ့ abnormal suspension ရောခြင်း</li><li>Asset ready ဖြစ်ပြီးနောက် interest ဆက် capitalise လုပ်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Qualifying asset</b></td><td>Intended use/sale အတွက် substantial period လိုအပ်တဲ့ asset.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Specific borrowing</b></td><td>Specific loan borrowing cost less temporary investment income, where applicable.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>General borrowing</b></td><td>Weighted average capitalization rate ကို qualifying expenditure ပေါ် apply.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Commencement</b></td><td>Expenditure incurred + borrowing costs incurred + activities to prepare asset underway.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Suspension</b></td><td>Extended abnormal interruption period အတွင်း capitalization suspend.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Cessation</b></td><td>Substantially all activities complete ဖြစ်ချိန် capitalisation cease.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Timeline calculation တိကျဖို့ အရေးကြီး။ Month fraction mistakes က marks ဆုံးရှုံးစေတယ်။</div>\n</div>\n"}],"html": null},{"text": "Chapter Overview","kind": "group","children": [{"text": "Qualifying asset တည်ဆောက်ဖို့ borrowing cost ကို capitalization လုပ်ရမယ့် period ကို မှန်အောင်တွက်နိုင်ဖို့ chapter ဖြစ်တယ်။","kind": "overview","children": [],"html": null}],"html": null},{"text": "Rules / Criteria / Measurement","kind": "group","children": [{"text": "Criteria / Recognition","kind": "topic","children": [{"text": "IAS 23 applies to borrowing costs directly attributable to a qualifying asset that takes a substantial period to get ready for use or sale.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial Measurement","kind": "topic","children": [{"text": "Specific borrowing: actual eligible borrowing costs less temporary investment income. General borrowing: capitalization rate × weighted qualifying expenditure.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Subsequent Measurement","kind": "topic","children": [{"text": "Capitalize only during eligible construction period; suspend during extended abnormal interruptions; cease when substantially all preparation activities are complete.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Accounting / Journal Treatment","kind": "topic","children": [{"text": "Dr Qualifying Asset / Cr Interest Payable or Cash for capitalized portion; non-eligible borrowing cost → finance expense.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Financial Statement Impact","kind": "topic","children": [{"text": "Capitalized amount increases asset cost in SOFP; non-capitalized interest affects financing/finance expense in SOPL.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Topic Details","kind": "group","children": [{"text": "Qualifying asset","kind": "topic","children": [{"text": "Intended use/sale အတွက် substantial period လိုအပ်တဲ့ asset.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Specific borrowing","kind": "topic","children": [{"text": "Specific loan borrowing cost less temporary investment income, where applicable.","kind": "detail","children": [],"html": null}],"html": null},{"text": "General borrowing","kind": "topic","children": [{"text": "Weighted average capitalization rate ကို qualifying expenditure ပေါ် apply.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Commencement","kind": "topic","children": [{"text": "Expenditure incurred + borrowing costs incurred + activities to prepare asset underway.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Suspension","kind": "topic","children": [{"text": "Extended abnormal interruption period အတွင်း capitalization suspend.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Cessation","kind": "topic","children": [{"text": "Substantially all activities complete ဖြစ်ချိန် capitalisation cease.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Formula / Working Map","kind": "group","children": [{"text": "Specific borrowing capitalisation","kind": "formula","children": [{"text": "Actual eligible borrowing cost − relevant temporary investment income","kind": "detail","children": [],"html": null}],"html": null},{"text": "General borrowing capitalisation","kind": "formula","children": [{"text": "Weighted-average capitalisation rate × weighted qualifying expenditure","kind": "detail","children": [],"html": null}],"html": null},{"text": "Simple interest","kind": "formula","children": [{"text": "Principal × annual rate × time fraction","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Exam Thinking Process","kind": "group","children": [{"text": "Step 1 — Asset qualifying asset ဟုတ်/မဟုတ်စစ်ပါ။","kind": "step","children": [],"html": null},{"text": "Step 2 — Loan specific/general ခွဲပါ။","kind": "step","children": [],"html": null},{"text": "Step 3 — Start/suspend/cease dates timeline ဆွဲပါ။","kind": "step","children": [],"html": null},{"text": "Step 4 — Eligible period ပေါ် interest တွက်ပါ။","kind": "step","children": [],"html": null},{"text": "Step 5 — Capitalised amount နဲ့ SOPL finance cost ကို split လုပ်ပါ။","kind": "step","children": [],"html": null}],"html": null},{"text": "Examples / Application","kind": "group","children": [{"text": "Specific loan","kind": "example","children": [{"text": "Loan 1,000,000 @ 8%; eligible construction 9 months → gross eligible interest 60,000 before any temporary investment adjustment.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Suspension","kind": "example","children": [{"text": "Strike ကြောင့် 2 months abnormal stop ဖြစ်ရင် those months borrowing cost ကို expense လုပ်နိုင်ပြီး capitalise မလုပ်ရ။","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Common Mistakes / Exam Traps","kind": "group","children": [{"text": "Loan drawdown date ကနေ automatically capitalise လုပ်ခြင်း","kind": "trap","children": [],"html": null},{"text": "Normal technical/administrative delay နဲ့ abnormal suspension ရောခြင်း","kind": "trap","children": [],"html": null},{"text": "Asset ready ဖြစ်ပြီးနောက် interest ဆက် capitalise လုပ်ခြင်း","kind": "trap","children": [],"html": null}],"html": null},{"text": "Exam Focus","kind": "group","children": [{"text": "Timeline calculation တိကျဖို့ အရေးကြီး။ Month fraction mistakes က marks ဆုံးရှုံးစေတယ်။","kind": "exam","children": [],"html": null}],"html": null}],"html": null},{"text": "Chapter 6: IAS 38 – Intangible Assets","kind": "chapter","children": [{"text": "Deep Excel-style Study Sheets","kind": "group","children": [{"text": "Deep Master Sheet","kind": "sheet","children": [],"html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 6 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 38: identifiable non-monetary asset without physical substance. Internally generated development cost capitalized only after required development criteria are met; research is expensed.</td>\n   <td>Purchased intangible: purchase price + directly attributable costs. Development: only qualifying expenditure incurred after criteria are satisfied.</td>\n   <td>Finite-life: amortize and test impairment when indicated. Indefinite-life: no amortization; annual impairment testing.</td>\n   <td>Recognition: Dr Intangible Asset / Cr Cash/Payable. Amortization: Dr Expense / Cr Accumulated Amortization.</td>\n   <td><div class='formula-box'><b>Straight-line amortisation</b><div class='fstack'>(Cost − Residual value) ÷ Useful life</div></div><div class='formula-box'><b>Development asset CA</b><div class='fstack'>Capitalised development cost − accumulated amortisation − impairment</div></div></td>\n   <td>Intangible asset in SOFP; amortization/impairment in SOPL, unless included in another asset cost where permitted.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Identifiable/control/future benefit စစ်ပါ။</li><li><b>Step 2:</b> Purchased vs internally generated ခွဲပါ။</li><li><b>Step 3:</b> Internal project ဆို research/development phase ခွဲပါ။</li><li><b>Step 4:</b> Development criteria satisfied date ကို pinpoint လုပ်ပြီး အဲဒီ date ကစပြီး only capitalise လုပ်ပါ။</li></ol></td>\n   <td><div class='mini-example'><b>R&amp;D project</b><br>Jan–Mar research 30k; development criteria met 1 Apr; Apr–Dec eligible cost 90k → 30k expense, 90k capitalise subject to criteria.</div><div class='mini-example'><b>Purchased patent</b><br>Purchase price + directly attributable legal registration costs → intangible asset cost.</div></td>\n   <td><ul><li>Research cost ကို capitalise လုပ်ခြင်း</li><li>Development project success expected တင်နဲ့ criteria အကုန်ပြည့်တယ်လို့ယူခြင်း</li><li>Internally generated brand valuation ကို asset လုပ်ခြင်း</li><li>Indefinite life asset ကို amortise လုပ်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Definition</b></td><td>Identifiable non-monetary asset without physical substance; separable or contractual/legal rights.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Purchased intangible</b></td><td>Cost measurable ဖြစ်လို့ recognition ပိုရှင်း.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Research phase</b></td><td>Expense as incurred.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Development phase</b></td><td>Technical feasibility, intention, ability, future benefits/market, resources, reliable measurement စတဲ့ criteria ပြည့်မှ capitalise.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Internally generated brands</b></td><td>Brand, masthead, publishing title, customer list စတာတွေကို internally generated value အဖြစ် generally recognise မလုပ်.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Finite life</b></td><td>Amortise systematic basis over useful life.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Indefinite life</b></td><td>No amortisation; annual impairment review.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Revaluation</b></td><td>Active market ရှိတဲ့ rare cases မှသာ revaluation model practical.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Recognition logic နဲ့ capitalisation date အဓိက။ PPE ကဲ့သို့ calculation ရှိပေမယ့် recognition judgement ပိုများတယ်။</div>\n</div>\n"}],"html": null},{"text": "Chapter Overview","kind": "group","children": [{"text": "Intangible asset မှာ purchased asset နဲ့ internally generated expenditure ကို ခွဲရမယ်။ Research expense, development criteria, useful life finite/indefinite, amortisation/impairment က key points။","kind": "overview","children": [],"html": null}],"html": null},{"text": "Rules / Criteria / Measurement","kind": "group","children": [{"text": "Criteria / Recognition","kind": "topic","children": [{"text": "IAS 38: identifiable non-monetary asset without physical substance. Internally generated development cost capitalized only after required development criteria are met; research is expensed.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial Measurement","kind": "topic","children": [{"text": "Purchased intangible: purchase price + directly attributable costs. Development: only qualifying expenditure incurred after criteria are satisfied.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Subsequent Measurement","kind": "topic","children": [{"text": "Finite-life: amortize and test impairment when indicated. Indefinite-life: no amortization; annual impairment testing.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Accounting / Journal Treatment","kind": "topic","children": [{"text": "Recognition: Dr Intangible Asset / Cr Cash/Payable. Amortization: Dr Expense / Cr Accumulated Amortization.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Financial Statement Impact","kind": "topic","children": [{"text": "Intangible asset in SOFP; amortization/impairment in SOPL, unless included in another asset cost where permitted.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Topic Details","kind": "group","children": [{"text": "Definition","kind": "topic","children": [{"text": "Identifiable non-monetary asset without physical substance; separable or contractual/legal rights.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Purchased intangible","kind": "topic","children": [{"text": "Cost measurable ဖြစ်လို့ recognition ပိုရှင်း.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Research phase","kind": "topic","children": [{"text": "Expense as incurred.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Development phase","kind": "topic","children": [{"text": "Technical feasibility, intention, ability, future benefits/market, resources, reliable measurement စတဲ့ criteria ပြည့်မှ capitalise.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Internally generated brands","kind": "topic","children": [{"text": "Brand, masthead, publishing title, customer list စတာတွေကို internally generated value အဖြစ် generally recognise မလုပ်.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Finite life","kind": "topic","children": [{"text": "Amortise systematic basis over useful life.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Indefinite life","kind": "topic","children": [{"text": "No amortisation; annual impairment review.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Revaluation","kind": "topic","children": [{"text": "Active market ရှိတဲ့ rare cases မှသာ revaluation model practical.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Formula / Working Map","kind": "group","children": [{"text": "Straight-line amortisation","kind": "formula","children": [{"text": "(Cost − Residual value) ÷ Useful life","kind": "detail","children": [],"html": null}],"html": null},{"text": "Development asset CA","kind": "formula","children": [{"text": "Capitalised development cost − accumulated amortisation − impairment","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Exam Thinking Process","kind": "group","children": [{"text": "Step 1 — Identifiable/control/future benefit စစ်ပါ။","kind": "step","children": [],"html": null},{"text": "Step 2 — Purchased vs internally generated ခွဲပါ။","kind": "step","children": [],"html": null},{"text": "Step 3 — Internal project ဆို research/development phase ခွဲပါ။","kind": "step","children": [],"html": null},{"text": "Step 4 — Development criteria satisfied date ကို pinpoint လုပ်ပြီး အဲဒီ date ကစပြီး only capitalise လုပ်ပါ။","kind": "step","children": [],"html": null}],"html": null},{"text": "Examples / Application","kind": "group","children": [{"text": "R&D project","kind": "example","children": [{"text": "Jan–Mar research 30k; development criteria met 1 Apr; Apr–Dec eligible cost 90k → 30k expense, 90k capitalise subject to criteria.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Purchased patent","kind": "example","children": [{"text": "Purchase price + directly attributable legal registration costs → intangible asset cost.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Common Mistakes / Exam Traps","kind": "group","children": [{"text": "Research cost ကို capitalise လုပ်ခြင်း","kind": "trap","children": [],"html": null},{"text": "Development project success expected တင်နဲ့ criteria အကုန်ပြည့်တယ်လို့ယူခြင်း","kind": "trap","children": [],"html": null},{"text": "Internally generated brand valuation ကို asset လုပ်ခြင်း","kind": "trap","children": [],"html": null},{"text": "Indefinite life asset ကို amortise လုပ်ခြင်း","kind": "trap","children": [],"html": null}],"html": null},{"text": "Exam Focus","kind": "group","children": [{"text": "Recognition logic နဲ့ capitalisation date အဓိက။ PPE ကဲ့သို့ calculation ရှိပေမယ့် recognition judgement ပိုများတယ်။","kind": "exam","children": [],"html": null}],"html": null}],"html": null},{"text": "Chapter 7: IAS 36 – Impairment of Assets","kind": "chapter","children": [{"text": "Deep Excel-style Study Sheets","kind": "group","children": [{"text": "Deep Master Sheet","kind": "sheet","children": [],"html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 7 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 36 impairment when carrying amount exceeds recoverable amount. Recoverable amount = higher of FVLCD and VIU.</td>\n   <td>N/A as a standalone asset recognition rule; calculate the asset/CGU carrying amount first.</td>\n   <td>Test when indicators exist; some assets require annual testing. Reversal possible for non-goodwill assets subject to ceiling; goodwill impairment is not reversed.</td>\n   <td>Dr Impairment Loss / Cr Asset or Accumulated Impairment. Reversal: Dr Asset / Cr Reversal Gain, where permitted.</td>\n   <td><div class='formula-box'><b>Recoverable Amount</b><div class='fstack'>max(FVLCD, VIU)</div></div><div class='formula-box'><b>Impairment loss</b><div class='fstack'>max(0, Carrying Amount − Recoverable Amount)</div></div><div class='formula-box'><b>VIU basic</b><div class='fstack'>Σ Future cash flowₜ ÷ (1+r)^t</div></div></td>\n   <td>Impairment usually SOPL, unless it reverses a previous revaluation where the underlying standard requires OCI treatment.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Indicator/annual test trigger identify.</li><li><b>Step 2:</b> CA calculate.</li><li><b>Step 3:</b> FVLCD and VIU available data calculate.</li><li><b>Step 4:</b> Higher amount = RA.</li><li><b>Step 5:</b> CA &gt; RA ဆို loss recognise/allocate.</li><li><b>Step 6:</b> Prior impairment reversal question ရှိရင် revised CA ceiling စစ်ပါ။</li></ol></td>\n   <td><div class='mini-example'><b>Single asset</b><br>CA 500k, FVLCD 430k, VIU 460k → RA 460k → impairment 40k.</div><div class='mini-example'><b>CGU</b><br>CGU CA 1,000 including goodwill 100; RA 850 → loss 150: goodwill 100 first, remaining 50 other assets pro-rata subject to minimum limits.</div></td>\n   <td><ul><li>Lower of FVLCD/VIU ကို RA လို့ယူခြင်း</li><li>Goodwill impairment ကို reverse လုပ်ခြင်း</li><li>CGU loss ကို goodwill မတိုင်ခင် assets ထဲ pro-rata ဖြန့်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Impairment indicators</b></td><td>External + internal indicators; certain assets annual testing required.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Recoverable amount</b></td><td>Higher of Fair Value Less Costs of Disposal (FVLCD) and Value in Use (VIU).</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Value in use</b></td><td>Future cash flows discounted to present value.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Individual asset</b></td><td>CA &gt; RA → impairment loss.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>CGU</b></td><td>Independent cash inflows မရှိတဲ့ assets ကို Cash-Generating Unit အဖြစ် test.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>CGU allocation</b></td><td>Loss ကို goodwill first, then other assets pro-rata subject to floors.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Reversal</b></td><td>Conditions improve ရင် reversal possible for non-goodwill assets; goodwill impairment reversal prohibited.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Calculation + journal/FS effect. Consolidation goodwill impairment နဲ့ အလွန်ချိတ်ဆက်တယ်။</div>\n</div>\n"}],"html": null},{"text": "Chapter Overview","kind": "group","children": [{"text": "Impairment question တွေမှာ Carrying Amount ကို Recoverable Amount နဲ့ နှိုင်းပြီး loss ကို allocate လုပ်ရတယ်။ Recoverable Amount = higher of FVLCD and VIU.","kind": "overview","children": [],"html": null}],"html": null},{"text": "Rules / Criteria / Measurement","kind": "group","children": [{"text": "Criteria / Recognition","kind": "topic","children": [{"text": "IAS 36 impairment when carrying amount exceeds recoverable amount. Recoverable amount = higher of FVLCD and VIU.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial Measurement","kind": "topic","children": [{"text": "N/A as a standalone asset recognition rule; calculate the asset/CGU carrying amount first.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Subsequent Measurement","kind": "topic","children": [{"text": "Test when indicators exist; some assets require annual testing. Reversal possible for non-goodwill assets subject to ceiling; goodwill impairment is not reversed.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Accounting / Journal Treatment","kind": "topic","children": [{"text": "Dr Impairment Loss / Cr Asset or Accumulated Impairment. Reversal: Dr Asset / Cr Reversal Gain, where permitted.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Financial Statement Impact","kind": "topic","children": [{"text": "Impairment usually SOPL, unless it reverses a previous revaluation where the underlying standard requires OCI treatment.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Topic Details","kind": "group","children": [{"text": "Impairment indicators","kind": "topic","children": [{"text": "External + internal indicators; certain assets annual testing required.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Recoverable amount","kind": "topic","children": [{"text": "Higher of Fair Value Less Costs of Disposal (FVLCD) and Value in Use (VIU).","kind": "detail","children": [],"html": null}],"html": null},{"text": "Value in use","kind": "topic","children": [{"text": "Future cash flows discounted to present value.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Individual asset","kind": "topic","children": [{"text": "CA > RA → impairment loss.","kind": "detail","children": [],"html": null}],"html": null},{"text": "CGU","kind": "topic","children": [{"text": "Independent cash inflows မရှိတဲ့ assets ကို Cash-Generating Unit အဖြစ် test.","kind": "detail","children": [],"html": null}],"html": null},{"text": "CGU allocation","kind": "topic","children": [{"text": "Loss ကို goodwill first, then other assets pro-rata subject to floors.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Reversal","kind": "topic","children": [{"text": "Conditions improve ရင် reversal possible for non-goodwill assets; goodwill impairment reversal prohibited.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Formula / Working Map","kind": "group","children": [{"text": "Recoverable Amount","kind": "formula","children": [{"text": "max(FVLCD, VIU)","kind": "detail","children": [],"html": null}],"html": null},{"text": "Impairment loss","kind": "formula","children": [{"text": "max(0, Carrying Amount − Recoverable Amount)","kind": "detail","children": [],"html": null}],"html": null},{"text": "VIU basic","kind": "formula","children": [{"text": "Σ Future cash flowₜ ÷ (1+r)^t","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Exam Thinking Process","kind": "group","children": [{"text": "Step 1 — Indicator/annual test trigger identify.","kind": "step","children": [],"html": null},{"text": "Step 2 — CA calculate.","kind": "step","children": [],"html": null},{"text": "Step 3 — FVLCD and VIU available data calculate.","kind": "step","children": [],"html": null},{"text": "Step 4 — Higher amount = RA.","kind": "step","children": [],"html": null},{"text": "Step 5 — CA > RA ဆို loss recognise/allocate.","kind": "step","children": [],"html": null},{"text": "Step 6 — Prior impairment reversal question ရှိရင် revised CA ceiling စစ်ပါ။","kind": "step","children": [],"html": null}],"html": null},{"text": "Examples / Application","kind": "group","children": [{"text": "Single asset","kind": "example","children": [{"text": "CA 500k, FVLCD 430k, VIU 460k → RA 460k → impairment 40k.","kind": "detail","children": [],"html": null}],"html": null},{"text": "CGU","kind": "example","children": [{"text": "CGU CA 1,000 including goodwill 100; RA 850 → loss 150: goodwill 100 first, remaining 50 other assets pro-rata subject to minimum limits.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Common Mistakes / Exam Traps","kind": "group","children": [{"text": "Lower of FVLCD/VIU ကို RA လို့ယူခြင်း","kind": "trap","children": [],"html": null},{"text": "Goodwill impairment ကို reverse လုပ်ခြင်း","kind": "trap","children": [],"html": null},{"text": "CGU loss ကို goodwill မတိုင်ခင် assets ထဲ pro-rata ဖြန့်ခြင်း","kind": "trap","children": [],"html": null}],"html": null},{"text": "Exam Focus","kind": "group","children": [{"text": "Calculation + journal/FS effect. Consolidation goodwill impairment နဲ့ အလွန်ချိတ်ဆက်တယ်။","kind": "exam","children": [],"html": null}],"html": null}],"html": null},{"text": "Chapter 8: IAS 37 – Provisions, Contingent Liabilities & Contingent Assets","kind": "chapter","children": [{"text": "Deep Excel-style Study Sheets","kind": "group","children": [{"text": "Deep Master Sheet","kind": "sheet","children": [],"html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 8 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 37 provision: present legal/constructive obligation from past event + probable outflow + reliable estimate.</td>\n   <td>Recognize best estimate; use expected value for large populations or most likely outcome adjusted for risk where appropriate; discount if time value is material.</td>\n   <td>Review each reporting date and update to current best estimate. Unwinding of discount increases the provision over time.</td>\n   <td>Dr Expense or Related Asset / Cr Provision. Unwinding: Dr Finance Cost / Cr Provision.</td>\n   <td><div class='formula-box'><b>Expected value</b><div class='fstack'>Σ (Probability × Outcome)</div></div><div class='formula-box'><b>PV of provision</b><div class='fstack'>Future expected payment ÷ (1+r)^n</div></div><div class='formula-box'><b>Unwinding</b><div class='fstack'>Opening discounted provision × discount rate</div></div></td>\n   <td>Provision in SOFP. Expense usually SOPL; decommissioning may initially be included in PPE. Contingent items may be disclosure-only.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Past event ရှိလား?</li><li><b>Step 2:</b> Present legal/constructive obligation ရှိလား?</li><li><b>Step 3:</b> Outflow probable လား?</li><li><b>Step 4:</b> Estimate reliable လား?</li><li><b>Step 5:</b> Recognition vs disclosure vs no action classify.</li><li><b>Step 6:</b> Measurement basis expected value/most likely/PV select.</li></ol></td>\n   <td><div class='mini-example'><b>Warranty</b><br>75% no fault, 20% minor repair 100, 5% major repair 1,000 → expected cost per unit = 0 + 20 + 50 = 70.</div><div class='mini-example'><b>Legal claim</b><br>Lawyer says loss unlikely → no provision; possible but not probable ဆို contingent liability disclosure.</div></td>\n   <td><ul><li>Future operating losses provision လုပ်ခြင်း</li><li>Board decision တစ်ခုတည်းနဲ့ constructive obligation ဖြစ်တယ်လို့ယူခြင်း</li><li>Contingent asset ကို probable ဖြစ်တာနဲ့ asset recognise လုပ်ခြင်း</li><li>Discounted provision unwinding မလုပ်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Provision criteria</b></td><td>Present legal/constructive obligation + probable outflow + reliable estimate.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Contingent liability</b></td><td>Possible obligation or present obligation not recognised because outflow not probable / estimate unreliable; disclose unless remote.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Contingent asset</b></td><td>Possible asset; disclose only when inflow probable, recognise when virtually certain.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Measurement</b></td><td>Best estimate. Large population → expected value; single obligation → most likely outcome adjusted for risks.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Discounting</b></td><td>Time value material ဖြစ်ရင် present value; unwinding = finance cost.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Restructuring</b></td><td>Detailed formal plan + valid expectation; only direct expenditures necessarily entailed.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Onerous contract</b></td><td>Unavoidable costs &gt; expected benefits → provision.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Decommissioning</b></td><td>Initial estimate may be added to related PPE with matching provision.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Scenario wording (&#x27;probable&#x27;, &#x27;possible&#x27;, &#x27;virtually certain&#x27;) ကို အလွန်သတိထား။</div>\n</div>\n"}],"html": null},{"text": "Chapter Overview","kind": "group","children": [{"text": "Provision question က 3-condition test ကို မှန်အောင်သုံးနိုင်ရမယ်: present obligation from past event, probable outflow, reliable estimate. မပြည့်ရင် contingent/disclosure/no action ကို distinguish လုပ်ရတယ်။","kind": "overview","children": [],"html": null}],"html": null},{"text": "Rules / Criteria / Measurement","kind": "group","children": [{"text": "Criteria / Recognition","kind": "topic","children": [{"text": "IAS 37 provision: present legal/constructive obligation from past event + probable outflow + reliable estimate.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial Measurement","kind": "topic","children": [{"text": "Recognize best estimate; use expected value for large populations or most likely outcome adjusted for risk where appropriate; discount if time value is material.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Subsequent Measurement","kind": "topic","children": [{"text": "Review each reporting date and update to current best estimate. Unwinding of discount increases the provision over time.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Accounting / Journal Treatment","kind": "topic","children": [{"text": "Dr Expense or Related Asset / Cr Provision. Unwinding: Dr Finance Cost / Cr Provision.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Financial Statement Impact","kind": "topic","children": [{"text": "Provision in SOFP. Expense usually SOPL; decommissioning may initially be included in PPE. Contingent items may be disclosure-only.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Topic Details","kind": "group","children": [{"text": "Provision criteria","kind": "topic","children": [{"text": "Present legal/constructive obligation + probable outflow + reliable estimate.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Contingent liability","kind": "topic","children": [{"text": "Possible obligation or present obligation not recognised because outflow not probable / estimate unreliable; disclose unless remote.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Contingent asset","kind": "topic","children": [{"text": "Possible asset; disclose only when inflow probable, recognise when virtually certain.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Measurement","kind": "topic","children": [{"text": "Best estimate. Large population → expected value; single obligation → most likely outcome adjusted for risks.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Discounting","kind": "topic","children": [{"text": "Time value material ဖြစ်ရင် present value; unwinding = finance cost.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Restructuring","kind": "topic","children": [{"text": "Detailed formal plan + valid expectation; only direct expenditures necessarily entailed.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Onerous contract","kind": "topic","children": [{"text": "Unavoidable costs > expected benefits → provision.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Decommissioning","kind": "topic","children": [{"text": "Initial estimate may be added to related PPE with matching provision.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Formula / Working Map","kind": "group","children": [{"text": "Expected value","kind": "formula","children": [{"text": "Σ (Probability × Outcome)","kind": "detail","children": [],"html": null}],"html": null},{"text": "PV of provision","kind": "formula","children": [{"text": "Future expected payment ÷ (1+r)^n","kind": "detail","children": [],"html": null}],"html": null},{"text": "Unwinding","kind": "formula","children": [{"text": "Opening discounted provision × discount rate","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Exam Thinking Process","kind": "group","children": [{"text": "Step 1 — Past event ရှိလား?","kind": "step","children": [],"html": null},{"text": "Step 2 — Present legal/constructive obligation ရှိလား?","kind": "step","children": [],"html": null},{"text": "Step 3 — Outflow probable လား?","kind": "step","children": [],"html": null},{"text": "Step 4 — Estimate reliable လား?","kind": "step","children": [],"html": null},{"text": "Step 5 — Recognition vs disclosure vs no action classify.","kind": "step","children": [],"html": null},{"text": "Step 6 — Measurement basis expected value/most likely/PV select.","kind": "step","children": [],"html": null}],"html": null},{"text": "Examples / Application","kind": "group","children": [{"text": "Warranty","kind": "example","children": [{"text": "75% no fault, 20% minor repair 100, 5% major repair 1,000 → expected cost per unit = 0 + 20 + 50 = 70.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Legal claim","kind": "example","children": [{"text": "Lawyer says loss unlikely → no provision; possible but not probable ဆို contingent liability disclosure.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Common Mistakes / Exam Traps","kind": "group","children": [{"text": "Future operating losses provision လုပ်ခြင်း","kind": "trap","children": [],"html": null},{"text": "Board decision တစ်ခုတည်းနဲ့ constructive obligation ဖြစ်တယ်လို့ယူခြင်း","kind": "trap","children": [],"html": null},{"text": "Contingent asset ကို probable ဖြစ်တာနဲ့ asset recognise လုပ်ခြင်း","kind": "trap","children": [],"html": null},{"text": "Discounted provision unwinding မလုပ်ခြင်း","kind": "trap","children": [],"html": null}],"html": null},{"text": "Exam Focus","kind": "group","children": [{"text": "Scenario wording ('probable', 'possible', 'virtually certain') ကို အလွန်သတိထား။","kind": "exam","children": [],"html": null}],"html": null}],"html": null},{"text": "Chapter 9: IAS 10 – Events after the Reporting Period","kind": "chapter","children": [{"text": "Deep Excel-style Study Sheets","kind": "group","children": [{"text": "Deep Master Sheet","kind": "sheet","children": [],"html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 9 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 10: determine whether post-reporting event gives evidence of a condition existing at reporting date (adjusting) or arose after reporting date (non-adjusting).</td>\n   <td>N/A — event classification standard.</td>\n   <td>Adjust amounts for adjusting events. Material non-adjusting events are disclosed, not adjusted. Reassess going concern where necessary.</td>\n   <td>Adjusting event: post the required correcting entry. Non-adjusting material event: no journal entry, disclosure only.</td>\n   <td><div class='formula-box'><b>No special formula</b><div class='fstack'>Classification drives whether existing amounts are adjusted or only disclosed.</div></div></td>\n   <td>May change asset/liability/profit amounts if adjusting; otherwise Notes disclosure. Going concern can affect the entire measurement basis.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Event date vs reporting date timeline ဆွဲပါ။</li><li><b>Step 2:</b> Underlying condition reporting date မှာရှိပြီးသားလား?</li><li><b>Step 3:</b> ရှိ → adjusting; မရှိ → non-adjusting.</li><li><b>Step 4:</b> Material non-adjusting → disclosure.</li><li><b>Step 5:</b> Going concern impact ကို separate check.</li></ol></td>\n   <td><div class='mini-example'><b>Customer bankruptcy</b><br>Year-end receivable customer ဟာ year-end မှာ financial difficulty ရှိပြီး Jan မှာ bankrupt → usually adjusting evidence for impairment.</div><div class='mini-example'><b>Fire after year-end</b><br>Factory fire arose after reporting date → non-adjusting, but material disclosure may be required.</div></td>\n   <td><ul><li>Cash paid after year-end ဆို adjusting လို့ယူခြင်း</li><li>Event date ကိုပဲကြည့်ပြီး underlying condition မကြည့်ခြင်း</li><li>Material non-adjusting event ကို လုံးဝ ignore လုပ်ခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Adjusting event</b></td><td>Reporting date မှာရှိပြီးသား condition အကြောင်း additional evidence ပေးတဲ့ event → amounts adjust.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Non-adjusting event</b></td><td>Reporting date နောက်မှ new condition ဖြစ် → no adjustment; material ဖြစ်ရင် disclose nature + estimate.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Authorisation date</b></td><td>Events considered up to date financial statements authorised for issue.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Going concern exception</b></td><td>Post-reporting event က going concern assumption ကို မသင့်တော့စေရင် pervasive basis issue ဖြစ်နိုင်တယ်.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Dividends</b></td><td>Reporting date နောက် declared dividend generally liability at reporting date မဟုတ်.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Timeline + evidence test ကို စာကြောင်းတိုတိုနဲ့ justify လုပ်ပါ။</div>\n</div>\n"}],"html": null},{"text": "Chapter Overview","kind": "group","children": [{"text": "Reporting date နောက်ပိုင်း event က reporting-date condition ကို confirm လုပ်တာလား၊ new condition လား ခွဲရတယ်။","kind": "overview","children": [],"html": null}],"html": null},{"text": "Rules / Criteria / Measurement","kind": "group","children": [{"text": "Criteria / Recognition","kind": "topic","children": [{"text": "IAS 10: determine whether post-reporting event gives evidence of a condition existing at reporting date (adjusting) or arose after reporting date (non-adjusting).","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial Measurement","kind": "topic","children": [{"text": "N/A — event classification standard.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Subsequent Measurement","kind": "topic","children": [{"text": "Adjust amounts for adjusting events. Material non-adjusting events are disclosed, not adjusted. Reassess going concern where necessary.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Accounting / Journal Treatment","kind": "topic","children": [{"text": "Adjusting event: post the required correcting entry. Non-adjusting material event: no journal entry, disclosure only.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Financial Statement Impact","kind": "topic","children": [{"text": "May change asset/liability/profit amounts if adjusting; otherwise Notes disclosure. Going concern can affect the entire measurement basis.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Topic Details","kind": "group","children": [{"text": "Adjusting event","kind": "topic","children": [{"text": "Reporting date မှာရှိပြီးသား condition အကြောင်း additional evidence ပေးတဲ့ event → amounts adjust.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Non-adjusting event","kind": "topic","children": [{"text": "Reporting date နောက်မှ new condition ဖြစ် → no adjustment; material ဖြစ်ရင် disclose nature + estimate.","kind": "detail","children": [],"html": null}],"html": null}, ting date → non-adjusting, but material disclosure may be required.","kind": "detail","children": [],"html": null}],"html": null}],"html": null},{"text": "Common Mistakes / Exam Traps","kind": "group","children": [{"text": "Cash paid after year-end ဆို adjusting လို့ယူခြင်း","kind": "trap","children": [],"html": null},{"text": "Event date ကိုပဲကြည့်ပြီး underlying condition မကြည့်ခြင်း","kind": "trap","children": [],"html": null},{"text": "Material non-adjusting event ကို လုံးဝ ignore လုပ်ခြင်း","kind": "trap","children": [],"html": null}],"html": null},{"text": "Exam Focus","kind": "group","children": [{"text": "Timeline + evidence test ကို စာကြောင်းတိုတိုနဲ့ justify လုပ်ပါ။","kind": "exam","children": [],"html": null}],"html": null}],"html": null},{"text": "Chapter 10: IAS 2 – Inventories","kind": "chapter","children": [{"text": "Deep Excel-style Study Sheets","kind": "group","children": [{"text": "Deep Master Sheet","kind": "sheet","children": [],"html": "\n<div class=\"sheet-wrap wide-sheet\">\n <div class=\"sheet-title\">Chapter 10 — Deep Rule / Measurement / Exam Sheet</div>\n <table class=\"excel-sheet master-detail\">\n  <thead><tr>\n   <th>Scope / Criteria / Recognition</th><th>Initial Measurement</th><th>Subsequent Measurement</th>\n   <th>Rules & Treatment</th><th>Formula / Working</th><th>Financial Statement Impact</th>\n   <th>Step-by-step Thinking</th><th>Examples</th><th>Exam Risks</th>\n  </tr></thead>\n  <tbody><tr>\n   <td>IAS 2 inventory recognized when entity controls goods held for sale, in production, or materials/supplies to be consumed.</td>\n   <td>Cost = purchase + conversion + other costs to bring inventories to present location/condition; exclude abnormal waste, certain storage/admin/selling costs.</td>\n   <td>Measure at lower of Cost and NRV. Reverse prior write-down when NRV recovers, limited to original write-down.</td>\n   <td>Write-down: Dr Inventory Write-down Expense / Cr Inventory. Reversal: Dr Inventory / Cr Reversal of Write-down.</td>\n   <td><div class='formula-box'><b>NRV</b><div class='fstack'>Estimated selling price − Costs to complete − Selling costs</div></div><div class='formula-box'><b>Closing inventory</b><div class='fstack'>Quantity × lower of unit Cost and unit NRV</div></div><div class='formula-box'><b>Weighted average unit cost</b><div class='fstack'>Total cost of goods available ÷ Total units available</div></div></td>\n   <td>Inventory in Current Assets. Write-down/reversal affects Cost of Sales or operating expense in SOPL.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Inventory item/quantity establish.</li><li><b>Step 2:</b> Unit cost derive.</li><li><b>Step 3:</b> NRV derive.</li><li><b>Step 4:</b> Lower of cost &amp; NRV item-by-item/group appropriate basis.</li><li><b>Step 5:</b> Cut-off/GIT/consignment issueရှိရင် ownership first.</li></ol></td>\n   <td><div class='mini-example'><b>NRV</b><br>Cost 50; selling price 54; completion 3; selling cost 4 → NRV 47 → write down 3.</div><div class='mini-example'><b>Price rise</b><br>FIFO closing inventory tends to reflect latest purchase costs more closely than older layers; source notes compare FIFO vs average effects.</div></td>\n   <td><ul><li>Selling cost ကို inventory cost ထဲထည့်ခြင်း</li><li>Cost &gt; NRV ဖြစ်တာကို gain recognise လုပ်ခြင်း</li><li>NRV = selling price လို့သာယူခြင်း</li><li>Physical count only = ownership လို့ယူခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Cost</b></td><td>Purchase + conversion + other costs to bring inventory to present location/condition.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Exclude</b></td><td>Abnormal waste, unnecessary storage, admin overhead not contributing, selling costs.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Cost formulas</b></td><td>FIFO or weighted average for ordinarily interchangeable items; specific identification for unique items.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>NRV</b></td><td>Estimated selling price less estimated completion and selling costs.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Write-down</b></td><td>Cost &gt; NRV → expense/write-down.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Reversal</b></td><td>NRV recovery ဖြစ်ရင် prior write-down extent အထိ reverse.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Cut-off / ownership</b></td><td>Physical location တစ်ခုတည်းမဟုတ်ဘဲ risks/control/terms ကိုကြည့်ပြီး inventory ownership decide.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr></tbody>\n </table>\n <div class=\"exam-focus\"><b>Exam Focus:</b> Short calculations + cut-off adjustments + gross profit effect တွေမေးလေ့ရှိတယ်။</div>\n</div>\n"}],"html": null},{"text": "Chapter Overview","kind": "group","children": [{"text": "Inventory ကို lower of Cost and NRV နဲ့ measure. Cost composition, FIFO/weighted average, write-down/reversal, cut-off/counting issues အဓိက။","kind": "overview","children": [],"html": null}],"html": null},{"text": "Rules / Criteria / Measurement","kind": "group","children": [{"text": "Criteria / Recognition","kind": "topic","children": [{"text": "IAS 2 inventory recognized when entity controls goods held for sale, in production, or materials/supplies to be consumed.","kind": "detail","children": [],"html": null}],"html": null},{"text": "Initial Measurement","kind": "topic","children": [{"text": ical Asset.</td>\n   <td><div class='formula-box'><b>FVLCTS</b><div class='fstack'>Fair Value − Costs to Sell</div></div><div class='formula-box'><b>FV movement</b><div class='fstack'>Closing FVLCTS − Opening carrying amount ± purchases/sales effects as applicable</div></div></td>\n   <td>Biological assets in SOFP; FV changes in SOPL.</td>\n   <td><ol class='steps-list'><li><b>Step 1:</b> Asset biological / bearer plant / harvested produce ဘယ်အဆင့်လဲ?</li><li><b>Step 2:</b> Correct standard map.</li><li><b>Step 3:</b> Measurement date FVLCTS.</li><li><b>Step 4:</b> Movement gain/loss to SOPL.</li></ol></td>\n   <td><div class='mini-example'><b>Cattle</b><br>Year-end cattle FV 120, costs to sell 5 → carrying amount 115.</div><div class='mini-example'><b>Rubber tree</b><br>Bearer tree itself → IAS 16; latex produce growing/harvest → IAS 41 then IAS 2 at harvest.</div></td>\n   <td><ul><li>Bearer plants ကို IAS 41 နဲ့ အမြဲ measure လုပ်ခြင်း</li><li>Harvestပြီးသား produce ကို IAS 41 ဆက်သုံးခြင်း</li><li>Fair value gain ကို OCI သွင်းခြင်း</li></ul></td>\n  </tr></tbody>\n </table>\n <div class=\"sheet-subtitle\">Detailed Topic Rules</div>\n <table class=\"excel-sheet topic-detail\">\n  <thead><tr><th>Topic</th><th>Detailed explanation</th><th>How to think in the exam</th></tr></thead>\n  <tbody><tr><td><b>Biological assets</b></td><td>Living animals/plants within IAS 41 scope.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Bearer plants</b></td><td>Produce bear လုပ်ပြီး themselves normally sold as produce မဟုတ်တဲ့ bearer plants → IAS 16.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Measurement</b></td><td>Initial and reporting date generally FVLCTS.</td><td>Rule → Apply facts → Calculate if needed → Identify SOPL/SOFP/OCI/Disclosure impact.</td></tr><tr><td><b>Changes in fair value</b></td><td>Gain/loss in SOPL.</td><td>Rule → Apply facts
